<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FloatTabs Stage 0 Input Test</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 32px; background: Canvas; color: CanvasText; }
    main { max-width: 560px; margin: 0 auto; }
    input, textarea { box-sizing: border-box; width: 100%; margin: 8px 0 20px; padding: 12px; font: inherit; }
    textarea { min-height: 180px; resize: vertical; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>FloatTabs Stage 0</h1>
    <p>This deterministic page exists only to verify WKWebView focus and keyboard input without relying on a login or network connection.</p>
    <label for="single">Single-line input</label>
    <input id="single" autofocus value="Click here, then type. Cmd+A / Cmd+C should work.">
    <label for="multi">Textarea</label>
    <textarea id="multi">Use this area to verify normal keyboard editing.</textarea>
    <p>Temporary global toggle: <code>Control + Option + Command + F</code></p>
  </main>
</body>
</html>
