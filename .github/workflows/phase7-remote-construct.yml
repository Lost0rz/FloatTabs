name: Phase7 Remote Construct

on:
  push:
    branches:
      - codex/ft-runtime-lifecycle-phase7-automatic-001

permissions:
  contents: write

jobs:
  construct:
    if: github.repository == 'Lost0rz/FloatTabs'
    runs-on: [self-hosted, macOS, ARM64, mac-mini-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify construction input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "codex/ft-runtime-lifecycle-phase7-automatic-001"
      - name: Apply bounded Phase 7 transform
        run: python3 tools/phase7_remote_construct.py
      - name: Verify patch hygiene
        run: git diff --check
      - name: Remove temporary construction machinery
        shell: bash
        run: |
          rm -f tools/phase7_remote_construct.py
          rm -f .github/workflows/phase7-remote-construct.yml
      - name: Commit and push construction result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Phase 7 automatic runtime lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
