name: Publish Monterey Compatibility Release

on:
  push:
    branches:
      - main
    paths:
      - 'tools/release/build_monterey_dmg.sh'
      - '.github/workflows/publish-monterey-release.yml'
      - 'docs/release/compatibility/FloatTabs_v0.1.3-monterey.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Skip if compatibility release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.3-monterey >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Monterey compatibility package
        if: steps.existing.outputs.exists != 'true'
        env:
          FLOATTABS_OUTPUT_DIR: ${{ runner.temp }}/FloatTabsMonterey
          FLOATTABS_MONTEREY_TARGET: '12.0'
        run: |
          chmod +x tools/release/build_monterey_dmg.sh
          tools/release/build_monterey_dmg.sh

      - name: Publish compatibility release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_DIR: ${{ runner.temp }}/FloatTabsMonterey
        run: |
          set -euo pipefail
          gh release create v0.1.3-monterey \
            --target "$GITHUB_SHA" \
            --title "FloatTabs v0.1.3 Monterey Compatibility" \
            --notes-file docs/release/compatibility/FloatTabs_v0.1.3-monterey.md \
            --latest=false \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dmg" \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dmg.sha256" \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dSYM.zip" \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dSYM.zip.sha256"

      - name: Verify release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.3-monterey --json tagName,targetCommitish,assets
