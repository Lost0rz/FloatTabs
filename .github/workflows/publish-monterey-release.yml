name: Publish Monterey Compatibility Release

# This workflow belongs only to the dedicated compatibility release line.
# It is intentionally tag-triggered and is not merged into / triggered by main.
on:
  push:
    tags:
      - 'v0.1.3-monterey'

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce release-line isolation
        env:
          STANDARD_BASE_SHA: ad810e94549cade77ec00bd0f2aee1b170d8023c
          STANDARD_V013_SHA: 67ce0a30cc7ce0430d1edf332f6cf65917ce65a22
        run: |
          set -euo pipefail
          git fetch --tags origin

          if [[ "$GITHUB_REF" != 'refs/tags/v0.1.3-monterey' ]]; then
            echo "error: unexpected compatibility release ref: $GITHUB_REF" >&2
            exit 1
          fi

          standard_tag_sha="$(git rev-list -n 1 v0.1.3)"
          if [[ "$standard_tag_sha" != "$STANDARD_V013_SHA" ]]; then
            echo "error: standard v0.1.3 tag moved; refusing compatibility publication" >&2
            echo "expected: $STANDARD_V013_SHA" >&2
            echo "actual:   $standard_tag_sha" >&2
            exit 1
          fi

          changed="$(git diff --name-only "$STANDARD_BASE_SHA"...HEAD)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/monterey-compat-ci\.yml|\.github/workflows/publish-monterey-release\.yml|docs/release/compatibility/.*|tools/release/build_monterey_dmg\.sh|tools/release/monterey_transform_lib\.py|tools/release/prepare_monterey_[A-Za-z0-9_]+\.py)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'error: compatibility tag contains standard-edition source or unrelated changes:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Refuse to overwrite an existing compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.3-monterey >/dev/null 2>&1; then
            echo 'error: v0.1.3-monterey already exists; compatibility releases are immutable' >&2
            exit 1
          fi

      - name: Build isolated Monterey compatibility package
        env:
          FLOATTABS_OUTPUT_DIR: ${{ runner.temp }}/FloatTabsMonterey
          FLOATTABS_MONTEREY_TARGET: '12.0'
        run: |
          chmod +x tools/release/build_monterey_dmg.sh
          tools/release/build_monterey_dmg.sh

      - name: Publish compatibility release only
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_DIR: ${{ runner.temp }}/FloatTabsMonterey
        run: |
          set -euo pipefail
          gh release create v0.1.3-monterey \
            --target "$GITHUB_SHA" \
            --title "FloatTabs v0.1.3 Monterey Compatibility" \
            --notes-file docs/release/compatibility/FloatTabs_v0.1.3-monterey.md \
            --latest=false \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dmg" \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dmg.sha256" \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dSYM.zip" \
            "$OUTPUT_DIR/FloatTabs-0.1.3-monterey.dSYM.zip.sha256"

      - name: Verify standard release remains untouched
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.1.3 --json tagName,targetCommitish,assets
          gh release view v0.1.3-monterey --json tagName,targetCommitish,assets,isLatest
