name: Stage 5C Construction

on:
  push:
    branches:
      - feat/stage-5c-presentation-pin
    paths:
      - .github/stage5c.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-5c-presentation-pin
          fetch-depth: 0

      - name: Apply Stage 5C patch
        run: python3 .github/stage5c_patch.py

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'host.isHidden = true' FloatTabs/Web/WebViewContainer.swift
          grep -q 'final class PinPanelControl' FloatTabs/UI/ExternalTabRail.swift
          grep -q 'applicationDidResignActive' FloatTabs/Panel/PanelController.swift
          grep -q 'case togglePin' FloatTabs/Hotkeys/AppCommandController.swift

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -resolvePackageDependencies

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -derivedDataPath .derivedData-stage5c \
            build

      - name: Unit tests
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -derivedDataPath .derivedData-stage5c \
            test

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabsTests/WebViewFactoryTests.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/ExternalShellTests.swift
          git commit -m 'feat: add Stage 5C presentation and pin behavior'
          git push origin HEAD:feat/stage-5c-presentation-pin
