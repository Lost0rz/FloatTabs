name: Republish v0.1.3 Build 5

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  republish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'patch/v0.1.3-settings-build5'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Verify v0.1.3 build 5 metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);/\1/p' FloatTabs.xcodeproj/project.pbxproj | head -n 1)"
          BUILD="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION = \([^;]*\);/\1/p' FloatTabs.xcodeproj/project.pbxproj | head -n 1)"
          test "$VERSION" = "0.1.3"
          test "$BUILD" = "5"
          grep -q 'About FloatTabs' FloatTabs/UI/GlobalSettingsController.swift

      - name: Run XCTest on merged source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -destination 'platform=macOS' \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and verify replacement Universal 2 package
        env:
          FLOATTABS_OUTPUT_DIR: ${{ runner.temp }}/FloatTabsRelease
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/release/build_dmg.sh
          tools/release/build_dmg.sh
          cd "${{ runner.temp }}/FloatTabsRelease"
          shasum -a 256 -c FloatTabs-0.1.3.dmg.sha256
          shasum -a 256 -c FloatTabs-0.1.3.dSYM.zip.sha256

      - name: Replace existing v0.1.3 release assets and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.3
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/FloatTabsRelease
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            "$OUTPUT_DIR/FloatTabs-0.1.3.dmg" \
            "$OUTPUT_DIR/FloatTabs-0.1.3.dmg.sha256" \
            "$OUTPUT_DIR/FloatTabs-0.1.3.dSYM.zip" \
            "$OUTPUT_DIR/FloatTabs-0.1.3.dSYM.zip.sha256" \
            --clobber
          gh release edit "$TAG" \
            --title "FloatTabs $TAG" \
            --notes-file docs/release/FloatTabs_v0.1.3.md \
            --target "$MERGE_SHA"
          git tag -f "$TAG" "$MERGE_SHA"
          git push --force origin "refs/tags/$TAG"
          gh release view "$TAG" --json tagName,targetCommitish,assets
