name: Prepare v0.1.4 Release on Main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.1.4-main-prep.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Update release metadata and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path('FloatTabs.xcodeproj/project.pbxproj')
          text = project.read_text()
          assert text.count('CURRENT_PROJECT_VERSION = 5;') == 2
          assert text.count('MARKETING_VERSION = 0.1.3;') == 2
          project.write_text(
              text.replace('CURRENT_PROJECT_VERSION = 5;', 'CURRENT_PROJECT_VERSION = 6;')
                  .replace('MARKETING_VERSION = 0.1.3;', 'MARKETING_VERSION = 0.1.4;')
          )

          settings = Path('FloatTabs/UI/GlobalSettingsController.swift')
          text = settings.read_text()
          pattern = re.compile(
              r'enum AppReleaseInfo \{\n'
              r'    static let latestFixes = \[\n'
              r'.*?'
              r'    \]\n\n'
              r'    static func displayVersion',
              re.S,
          )
          replacement = '''enum AppReleaseInfo {
              static let latestFixes = [
                  "ChatGPT completions now enter an unseen Ready state with a red Tab indicator and menu-bar attention count.",
                  "Ready alerts can use a configurable macOS system sound, per-alert volume, and instant Settings previews.",
                  "Committed ChatGPT navigation now rejects stale document observations until the current page re-establishes its authorized baseline.",
                  "The menu-bar favicon follows the selected Slot's committed site while attention remains runtime-only.",
              ]

              static func displayVersion'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1
          settings.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          replacements = {
              '<a href="https://github.com/Lost0rz/FloatTabs/releases/tag/v0.1.3"><strong>Download FloatTabs v0.1.3</strong></a>': '<a href="https://github.com/Lost0rz/FloatTabs/releases/tag/v0.1.4"><strong>Download FloatTabs v0.1.4</strong></a>',
              '**Current release package:** **v0.1.3 Build 5**. Build 5 supersedes the original Build 4 package while keeping the same `v0.1.3` release and download URL.': '**Current release package:** **v0.1.4 Build 6**.',
              '1. Download [`FloatTabs-0.1.3.dmg`](https://github.com/Lost0rz/FloatTabs/releases/download/v0.1.3/FloatTabs-0.1.3.dmg).': '1. Download [`FloatTabs-0.1.4.dmg`](https://github.com/Lost0rz/FloatTabs/releases/download/v0.1.4/FloatTabs-0.1.4.dmg).',
              'FloatTabs v0.1.3 is currently unsigned and unnotarized.': 'FloatTabs v0.1.4 is currently unsigned and unnotarized.',
              'shasum -a 256 -c FloatTabs-0.1.3.dmg.sha256': 'shasum -a 256 -c FloatTabs-0.1.4.dmg.sha256',
              '- Current release record: [`docs/release/FloatTabs_v0.1.3.md`](docs/release/FloatTabs_v0.1.3.md)': '- Current release record: [`docs/release/FloatTabs_v0.1.4.md`](docs/release/FloatTabs_v0.1.4.md)',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)

          core_anchor = '| Single-click activation | Tab / Add / Pin / Settings respond on the first click even when FloatTabs is not the active app. |\n'
          assert core_anchor in text
          text = text.replace(
              core_anchor,
              core_anchor
              + '| ChatGPT Ready attention | Tracks ChatGPT generation at runtime and marks unseen completed work with a red Tab indicator. |\n'
              + '| Menu-bar attention | Shows the unseen ChatGPT Ready count while FloatTabs is hidden and follows the selected Slot’s committed-site favicon. |\n'
              + '| Configurable Ready alerts | Settings → Notifications can enable/disable Ready sounds, choose an available macOS system sound, set per-alert volume, and preview changes immediately. |\n',
              1,
          )

          zh_anchor = '- 支持 Pin、自动隐藏、多显示器 WebKit 全屏、后台音频和 Hot / Warm / Cold 内存策略。\n'
          assert zh_anchor in text
          text = text.replace(
              zh_anchor,
              zh_anchor + '- ChatGPT 回答在后台完成时可进入 Ready 状态：Tab 显示红点、菜单栏聚合未读 Ready 数量，并可按设置播放提示音。\n',
              1,
          )

          new_section = '''## What's New in v0.1.4

v0.1.4 is the ChatGPT Attention and notification release. It builds on the v0.1.3 floating-shell baseline without changing normal Tab, fullscreen, resizing, or Hot / Warm / Cold semantics.

- Added a Slot-scoped ChatGPT runtime attention state (`Idle → Generating → Ready`) with a red favicon indicator for unseen completed responses.
- Added real-presentation acknowledgement so Ready clears only when the actual ChatGPT WebView becomes user-visible, including fullscreen source and visible companion presentations.
- Protected Generating and unseen Ready runtimes from FloatTabs-initiated Warm/Cold eviction without changing the existing residency policy itself.
- Added hidden-app menu-bar Ready aggregation and current-site favicon projection for the selected committed WebKit page.
- Added a Ready completion sound and a dedicated **Settings → Notifications** pane.
- Added automatic sound preview when choosing a sound or completing a volume adjustment, plus a manual **Play Preview** button.
- Added per-alert volume control and an enable/disable switch. Defaults preserve the prior behavior: On, Ping, 100%.
- Kept Settings previews available when automatic alerts are disabled; 0% volume is true silence and never falls back to a system beep.
- Hardened committed ChatGPT navigation so stale old-document/natural baselines cannot reopen the attention barrier; only an authorized current-document resync can establish the new baseline after a supported commit.
- Kept attention runtime-only: prompt/response text is not persisted into FloatTabs preferences or backups.
- Backup/restore now carries the Ready sound preferences while remaining backward compatible with older schema-1 backups.

Manual QA confirmed the new Ready sound selection/volume behavior and existing first-click interaction on the release candidate. Automated coverage includes the attention state machine, navigation/document lifetime, visibility, lifecycle protection, menu-bar projection, sound policy/settings, and backup compatibility.

See [`docs/release/FloatTabs_v0.1.4.md`](docs/release/FloatTabs_v0.1.4.md) for the detailed release record.

'''
          pattern = re.compile(r"## What's New in v0\.1\.3\n.*?(?=## Verify the Download\n)", re.S)
          text, count = pattern.subn(new_section, text, count=1)
          assert count == 1
          readme.write_text(text)

          contract = Path('docs/product/FloatTabs_ChatGPT_Attention_Contract_V1.md')
          text = contract.read_text()
          old = '> Status: **FROZEN** — business-confirmed, docs-only. Runtime implementation has not started.'
          assert old in text
          contract.write_text(text.replace(
              old,
              '> Status: **IMPLEMENTED / FROZEN CONTRACT** — shipped in FloatTabs v0.1.4; business semantics remain authoritative.',
              1,
          ))

          plan = Path('docs/product/FloatTabs_ChatGPT_Attention_Construction_Plan_V1.md')
          text = plan.read_text()
          old = '> Status: **ACTIVE FROZEN DELIVERY PLAN**'
          assert old in text
          plan.write_text(text.replace(
              old,
              '> Status: **IMPLEMENTED — historical delivery record for FloatTabs v0.1.4**',
              1,
          ))

          Path('docs/release/FloatTabs_v0.1.4.md').write_text('''# FloatTabs v0.1.4

Release date: 2026-08-23

Build: **6**

## Summary

v0.1.4 ships ChatGPT Ready attention as a complete product feature and adds user-configurable completion sounds. The release keeps FloatTabs attention state runtime-only, preserves the existing Hot / Warm / Cold policy semantics, and hardens navigation/document replacement so stale ChatGPT observations cannot synthesize a false Ready state.

## Highlights

### ChatGPT Ready attention

FloatTabs now tracks a Slot-scoped runtime state for supported ChatGPT pages:

```text
Idle → Generating → Ready
```

A completed response becomes **Ready** only when the actual ChatGPT WebView is not user-visible. Ready is acknowledged when that WebView becomes genuinely presented to the user. The red indicator is attached to the Tab favicon, and hidden FloatTabs presentations can aggregate the Ready count in the menu bar.

Attention remains runtime-only and is not stored as a notification inbox. Prompt/response content is not intentionally copied into native persistence, backups, logs, or analytics.

### Visibility and lifecycle integration

The Ready decision uses the real presentation authority instead of logical selection alone. Normal source presentation, WebKit element-fullscreen source presentation, and the visible fullscreen companion are handled explicitly.

Generating and unseen Ready runtimes are protected from FloatTabs-initiated Warm/Cold eviction. Media protection stays independent; the existing Hot / Warm / Cold timing and policy meanings are unchanged.

### Menu-bar attention and favicon

When FloatTabs is hidden, the menu bar can project the derived unseen Ready count. The selected Slot's menu-bar favicon follows its committed/current-history WebKit site rather than assuming the configured Home URL after navigation.

The existing menu-bar display preference continues to support Icon + Name and Icon Only modes.

### Configurable Ready sounds

**Settings → Notifications** now provides:

- **Play sound when ChatGPT is ready** — default On;
- **Sound** — curated macOS system sounds that are actually loadable on the current machine;
- **Volume** — FloatTabs-local playback volume from 0–100%, default 100%;
- **Play Preview** — manual preview of the current sound and volume.

Changing the Sound previews it immediately. Completing a Volume adjustment previews once at the new level; the slider is intentionally non-continuous so dragging does not create repeated sounds.

Settings previews remain available while automatic Ready sounds are disabled. A 0% volume is true silence and never falls back to `NSSound.beep()`.

Automatic Ready playback and Settings previews share one production `AttentionSoundPlayer` path. The automatic alert still fires only when the existing Ready count increases.

### Navigation/document hardening

Supported committed ChatGPT navigations now enter an authorized-resync barrier. Natural/stale script baselines cannot establish the replacement document merely by being fresh; only the current attached WKWebView, matching generation/identity, and named-world authorized resync result can reopen the baseline.

Unsupported committed destinations and runtime-recovery seams keep their separate fail-closed semantics.

### Backup compatibility

Ready sound preferences are included in schema-1 FloatTabs backups:

- enabled state;
- selected sound name;
- FloatTabs-local volume.

Older schema-1 backups that lack these optional fields continue to decode and resolve to the compatibility defaults: On, Ping, 100%.

## Validation

Feature integration was independently audited before merge. The final attention-sound PR was validated with:

- focused sound/settings tests: PASS;
- two full local XCTest rounds: **460 tests, 0 failures** each;
- Apple Silicon arm64 Debug / Release / XCTest: PASS in macOS CI;
- Intel x86_64 Debug / Release / XCTest: PASS in macOS CI;
- Universal 2 Release build and binary architecture verification: PASS;
- QA DMG workflow: PASS;
- `Package.resolved`: unchanged;
- manual QA: Ready sound selection, volume, automatic preview, enable/disable behavior, persistence, and existing attention state behavior PASS;
- manual release-candidate check: first-click interaction is not swallowed.

The final release commit is additionally validated by the repository build/test and Publish Release workflows. The post-commit **Publish Release** workflow builds and verifies the Universal 2 package and checksum sidecars before publishing the GitHub Release.

## Distribution

FloatTabs v0.1.4 Build 6 is distributed as an unsigned, unnotarized Universal 2 DMG for Apple Silicon and Intel Macs.

Expected release assets:

- `FloatTabs-0.1.4.dmg`
- `FloatTabs-0.1.4.dmg.sha256`
- `FloatTabs-0.1.4.dSYM.zip`
- `FloatTabs-0.1.4.dSYM.zip.sha256`

Verify the DMG with:

```bash
shasum -a 256 -c FloatTabs-0.1.4.dmg.sha256
```
''')
          PY
          git diff --check

      - name: Validate release build and tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit release and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-v0.1.4-main-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs.xcodeproj/project.pbxproj \
            FloatTabs/UI/GlobalSettingsController.swift \
            README.md \
            docs/product/FloatTabs_ChatGPT_Attention_Contract_V1.md \
            docs/product/FloatTabs_ChatGPT_Attention_Construction_Plan_V1.md \
            docs/release/FloatTabs_v0.1.4.md \
            .github/workflows/release-v0.1.4-main-prep.yml
          git diff --cached --check
          git commit -m 'chore: release FloatTabs v0.1.4'
          git push origin HEAD:main
