name: Apply PR17 Follow-up

on:
  push:
    branches:
      - agent/address-bar-current-page-actions
    paths:
      - '.github/pr17_followup_patch.py'
      - '.github/pr17-followup-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/address-bar-current-page-actions
          fetch-depth: 0

      - name: Apply follow-up implementation
        run: python3 .github/pr17_followup_patch.py

      - name: Check patch
        run: |
          git diff --check
          git diff -- \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabs/UI/GlobalSettingsController.swift \
            FloatTabsTests/AppCommandControllerTests.swift

      - name: Resolve packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Run focused shortcut and command tests
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          -only-testing:FloatTabsTests/AppCommandControllerTests
          test

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabs/UI/GlobalSettingsController.swift \
            FloatTabsTests/AppCommandControllerTests.swift
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finish address bar layout and editable shortcuts'
          git push origin HEAD:agent/address-bar-current-page-actions
