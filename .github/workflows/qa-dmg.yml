name: QA DMG

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
    paths:
      - 'FloatTabs/**'
      - 'FloatTabs.xcodeproj/**'
      - 'tools/release/**'
      - '.github/workflows/qa-dmg.yml'

jobs:
  build-dmg:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build and verify Apple Silicon QA DMG
        env:
          FLOATTABS_OUTPUT_DIR: ${{ runner.temp }}/FloatTabsRelease
        run: |
          chmod +x tools/release/build_dmg.sh
          tools/release/build_dmg.sh

      # The repository is public, while QA builds are intentionally unsigned and
      # private. Pull requests still build and verify the image, but only an
      # explicit maintainer dispatch retains the binary artifacts.
      - name: Upload manually requested Apple Silicon QA DMG and debug symbols
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-Apple-Silicon-QA-DMG
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dmg
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dmg.sha256
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dSYM.zip
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dSYM.zip.sha256
