name: QA DMG

# QA images are produced only for explicit real-Mac acceptance or release checks.
# Ordinary PR readiness is routed by Engineering Governance instead.
on:
  workflow_dispatch:

jobs:
  build-dmg:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build and verify Apple Silicon QA DMG
        env:
          FLOATTABS_OUTPUT_DIR: ${{ runner.temp }}/FloatTabsRelease
        run: |
          chmod +x tools/release/build_dmg.sh
          tools/release/build_dmg.sh

      # QA binaries are created only by deliberate dispatch; never as a PR side effect.
      - name: Upload manually requested Apple Silicon QA DMG and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-Apple-Silicon-QA-DMG
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dmg
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dmg.sha256
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dSYM.zip
            ${{ runner.temp }}/FloatTabsRelease/FloatTabs-*.dSYM.zip.sha256
