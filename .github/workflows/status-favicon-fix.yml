name: Status Favicon Fix

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - '.github/workflows/status-favicon-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Apply selected favicon patch
        run: python3 .github/status-favicon_patch.py

      - name: Check patch formatting
        run: git diff --check

      - name: Resolve packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -derivedDataPath .derivedData \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Full unit tests
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/MenuBar/StatusItemController.swift FloatTabs/Panel/PanelController.swift FloatTabs/App/AppCoordinator.swift FloatTabsTests/ExternalShellTests.swift
          git commit -m 'fix: show selected website favicon in menu bar'
          git push origin HEAD:perf/stage-5-resource-benchmark
