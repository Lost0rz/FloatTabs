name: Benchmark Tool CI

# PR benchmark changes are selected by the shared Governance router.
# Keep the historical post-merge and manual self-test as project evidence.
on:
  push:
    branches:
      - main
    paths:
      - 'tools/benchmark/**'
      - '.github/workflows/benchmark-tool-ci.yml'
  workflow_dispatch:

jobs:
  self-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Python version
        run: python3 --version

      - name: Compile benchmark harnesses
        run: |
          python3 -m py_compile tools/benchmark/floattabs_benchmark.py
          python3 -m py_compile tools/benchmark/floattabs_phase7_acceptance.py
          python3 -m py_compile tools/benchmark/floattabs_lifecycle_benchmark.py

      - name: Run low-level benchmark harness self-test
        run: python3 tools/benchmark/floattabs_benchmark.py --self-test

      - name: Run Phase 7 acceptance harness self-test
        run: python3 tools/benchmark/floattabs_phase7_acceptance.py --self-test

      - name: Verify Stage 5E lifecycle entry point is retired
        shell: bash
        run: |
          set +e
          output="$(python3 tools/benchmark/floattabs_lifecycle_benchmark.py 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'RETIRED' <<<"$output"
