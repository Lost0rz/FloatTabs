name: Benchmark Tool CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/benchmark/**'
      - '.github/workflows/benchmark-tool-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/benchmark/**'
      - '.github/workflows/benchmark-tool-ci.yml'
  workflow_dispatch:

jobs:
  self-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Python version
        run: python3 --version

      - name: Compile benchmark harness
        run: python3 -m py_compile tools/benchmark/floattabs_benchmark.py

      - name: Run benchmark harness self-test
        run: python3 tools/benchmark/floattabs_benchmark.py --self-test
