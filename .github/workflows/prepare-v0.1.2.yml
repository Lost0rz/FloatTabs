name: Prepare v0.1.2 Version Metadata

on:
  push:
    branches:
      - release/v0.1.2
    paths:
      - '.github/workflows/prepare-v0.1.2.yml'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v0.1.2

      - name: Bump project version to 0.1.2 (3)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('FloatTabs.xcodeproj/project.pbxproj')
          text = path.read_text()
          old_marketing = 'MARKETING_VERSION = 0.1.1;'
          old_build = 'CURRENT_PROJECT_VERSION = 2;'
          marketing_count = text.count(old_marketing)
          build_count = text.count(old_build)
          if marketing_count == 0 or build_count == 0:
              raise SystemExit(f'expected old version metadata not found: marketing={marketing_count}, build={build_count}')
          text = text.replace(old_marketing, 'MARKETING_VERSION = 0.1.2;')
          text = text.replace(old_build, 'CURRENT_PROJECT_VERSION = 3;')
          path.write_text(text)
          print(f'updated MARKETING_VERSION entries: {marketing_count}')
          print(f'updated CURRENT_PROJECT_VERSION entries: {build_count}')
          PY
          grep -n 'MARKETING_VERSION = 0.1.2;' FloatTabs.xcodeproj/project.pbxproj
          grep -n 'CURRENT_PROJECT_VERSION = 3;' FloatTabs.xcodeproj/project.pbxproj

      - name: Commit version metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo 'Version metadata already prepared.'
            exit 0
          fi
          git commit -m 'chore: bump version to 0.1.2'
          git push origin HEAD:release/v0.1.2
