name: Stage 5C Refine

on:
  push:
    branches:
      - feat/stage-5c-presentation-pin
    paths:
      - .github/stage5c-refine.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-5c-presentation-pin
          fetch-depth: 0

      - name: Restore rejected Pin and auto-hide surface to benchmark baseline
        run: |
          git fetch origin perf/stage-5-resource-benchmark
          git checkout origin/perf/stage-5-resource-benchmark -- \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/ExternalShellTests.swift

      - name: Validate intended diff
        run: |
          git diff --check
          grep -q 'initial: .init(.backtick, modifiers: \[.command\])' FloatTabs/Hotkeys/GlobalHotkeyController.swift
          grep -q 'host.isHidden = true' FloatTabs/Web/WebViewContainer.swift
          ! grep -q 'togglePin' FloatTabs/Hotkeys/AppCommandController.swift
          ! grep -q 'PinPanelControl' FloatTabs/UI/ExternalTabRail.swift
          ! grep -q 'applicationDidResignActive' FloatTabs/Panel/PanelController.swift

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Lost0rz@users.noreply.github.com'
          git add \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/ExternalShellTests.swift
          git commit -m 'refactor: use explicit panel toggle without pin mode'
          git push origin HEAD:feat/stage-5c-presentation-pin
