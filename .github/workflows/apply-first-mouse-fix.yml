name: Apply first-mouse fix

on:
  push:
    branches:
      - fix/chatgpt-first-mouse

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply focused source and regression-test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('FloatTabs/Web/WebViewFactory.swift')
          source = source_path.read_text()
          source_anchor = '''    @available(*, unavailable)\n    required init?(coder: NSCoder) {\n        fatalError("init(coder:) has not been implemented")\n    }\n\n    func setRendering(\n'''
          source_replacement = '''    @available(*, unavailable)\n    required init?(coder: NSCoder) {\n        fatalError("init(coder:) has not been implemented")\n    }\n\n    /// FloatTabs can remain visible while another app owns key focus. Accept the\n    /// activation click so page controls such as ChatGPT Copy receive the same\n    /// first physical click instead of requiring a second click after activation.\n    override func acceptsFirstMouse(for event: NSEvent?) -> Bool {\n        true\n    }\n\n    func setRendering(\n'''
          if source.count(source_anchor) != 1:
              raise SystemExit('unexpected FloatTabsWebView source anchor count')
          source_path.write_text(source.replace(source_anchor, source_replacement, 1))

          test_path = Path('FloatTabsTests/WebViewFactoryTests.swift')
          tests = test_path.read_text()
          test_anchor = '''    func testStageZeroWebViewUsesPersistentWebsiteDataStore() {\n        let webView = WebViewFactory.makeStageZeroWebView()\n        XCTAssertTrue(webView.configuration.websiteDataStore.isPersistent)\n        XCTAssertTrue(webView.configuration.preferences.isElementFullscreenEnabled)\n    }\n\n    func testAutomaticMobileUsesCurrentIPhoneSafariIdentity() {\n'''
          test_replacement = '''    func testStageZeroWebViewUsesPersistentWebsiteDataStore() {\n        let webView = WebViewFactory.makeStageZeroWebView()\n        XCTAssertTrue(webView.configuration.websiteDataStore.isPersistent)\n        XCTAssertTrue(webView.configuration.preferences.isElementFullscreenEnabled)\n    }\n\n    func testFloatTabsWebViewAcceptsInactiveWindowFirstMouse() {\n        let webView = WebViewFactory.makeWebView()\n\n        XCTAssertTrue(webView.acceptsFirstMouse(for: nil))\n    }\n\n    func testAutomaticMobileUsesCurrentIPhoneSafariIdentity() {\n'''
          if tests.count(test_anchor) != 1:
              raise SystemExit('unexpected WebViewFactoryTests anchor count')
          test_path.write_text(tests.replace(test_anchor, test_replacement, 1))
          PY

          git diff --check

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Debug build and unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/FloatTabsFirstMouseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Commit focused fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-first-mouse-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- FloatTabs/Web/WebViewFactory.swift FloatTabsTests/WebViewFactoryTests.swift
          git diff --cached --check
          git commit -m 'fix: deliver first click to inactive web content'
          git push origin HEAD:fix/chatgpt-first-mouse
