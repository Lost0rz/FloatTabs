name: Apply navigation intent UI wiring

on:
  push:
    branches:
      - feat/navigation-intent-slot-home-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-intent-slot-home-v2
          fetch-depth: 0

      - name: Apply guarded source and test patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # PanelController: command + tab menu wiring + navigation helper.
          replace_once(
              "FloatTabs/Panel/PanelController.swift",
              """        case .quickURL:\n            presentQuickURL()\n        }\n""",
              """        case .quickURL:\n            presentQuickURL()\n\n        case .returnHome:\n            returnActiveSlotHome()\n        }\n""",
          )
          replace_once(
              "FloatTabs/Panel/PanelController.swift",
              """        rail.onSelect = { [weak self] id in\n            _ = self?.tabStore.select(id: id)\n        }\n        rail.onAdd = { [weak self] in\n""",
              """        rail.onSelect = { [weak self] id in\n            _ = self?.tabStore.select(id: id)\n        }\n        rail.onReturnHome = { [weak self] id in\n            self?.returnSlotHome(id: id)\n        }\n        rail.onAdd = { [weak self] in\n""",
          )
          replace_once(
              "FloatTabs/Panel/PanelController.swift",
              """    private func presentAddWebAppEditor() {\n""",
              """    private func returnActiveSlotHome() {\n        guard let id = tabStore.activeTabID else { return }\n        returnSlotHome(id: id)\n    }\n\n    private func returnSlotHome(id: UUID) {\n        guard let profile = tabStore.profiles.first(where: { $0.id == id }),\n              WebAppURL.isSafe(profile.homeURL) else {\n            return\n        }\n\n        // `homeURL` is stable Slot identity; only `currentURL` moves. Updating\n        // currentURL before load also makes Return to Home deterministic for a\n        // cold inactive Slot without clearing a warm WebView's history list.\n        tabStore.updateCurrentURL(id: id, url: profile.homeURL)\n        if webViewPool.contains(slotID: id) {\n            webViewPool.navigate(slotID: id, to: profile.homeURL)\n        }\n\n        if tabStore.activeTabID == id {\n            focusActiveWebViewIfAvailable()\n        }\n    }\n\n    private func presentAddWebAppEditor() {\n""",
          )

          # ExternalTabRail: Return to Home is the first Slot context-menu action.
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              """    var onSelect: ((UUID) -> Void)?\n    var onAdd: (() -> Void)?\n""",
              """    var onSelect: ((UUID) -> Void)?\n    var onReturnHome: ((UUID) -> Void)?\n    var onAdd: (() -> Void)?\n""",
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              """        view.onSelect = { [weak self] slotID in self?.onSelect?(slotID) }\n        view.onEdit = { [weak self] slotID in self?.onEdit?(slotID) }\n""",
              """        view.onSelect = { [weak self] slotID in self?.onSelect?(slotID) }\n        view.onReturnHome = { [weak self] slotID in self?.onReturnHome?(slotID) }\n        view.onEdit = { [weak self] slotID in self?.onEdit?(slotID) }\n""",
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              """    var onSelect: ((UUID) -> Void)?\n    var onEdit: ((UUID) -> Void)?\n""",
              """    var onSelect: ((UUID) -> Void)?\n    var onReturnHome: ((UUID) -> Void)?\n    var onEdit: ((UUID) -> Void)?\n""",
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              """    override func menu(for event: NSEvent) -> NSMenu? {\n        let menu = NSMenu()\n\n        let rename = NSMenuItem(title: \"Rename…\", action: #selector(renameFromMenu), keyEquivalent: \"\")\n""",
              """    override func menu(for event: NSEvent) -> NSMenu? {\n        let menu = NSMenu()\n\n        let home = NSMenuItem(\n            title: \"Return to Home\",\n            action: #selector(returnHomeFromMenu),\n            keyEquivalent: \"h\"\n        )\n        home.keyEquivalentModifierMask = [.command, .shift]\n        home.target = self\n        menu.addItem(home)\n        menu.addItem(.separator())\n\n        let rename = NSMenuItem(title: \"Rename…\", action: #selector(renameFromMenu), keyEquivalent: \"\")\n""",
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              """    @objc private func renameFromMenu() {\n        onRename?(slotID)\n    }\n""",
              """    @objc private func returnHomeFromMenu() {\n        onReturnHome?(slotID)\n    }\n\n    @objc private func renameFromMenu() {\n        onRename?(slotID)\n    }\n""",
          )

          # Shortcut coverage.
          replace_once(
              "FloatTabsTests/AppCommandControllerTests.swift",
              """        XCTAssertEqual(\n            AppCommandController.command(characters: \"\\t\", keyCode: 48, modifiers: [.control, .shift]),\n            .previousSlot\n        )\n\n        XCTAssertNil(AppCommandController.command(characters: \"a\", keyCode: 0, modifiers: [.command]))\n""",
              """        XCTAssertEqual(\n            AppCommandController.command(characters: \"\\t\", keyCode: 48, modifiers: [.control, .shift]),\n            .previousSlot\n        )\n        XCTAssertEqual(\n            AppCommandController.command(characters: \"h\", keyCode: 4, modifiers: [.command, .shift]),\n            .returnHome\n        )\n        XCTAssertEqual(\n            AppCommandController.command(characters: \"H\", keyCode: 4, modifiers: [.command, .shift]),\n            .returnHome\n        )\n\n        XCTAssertNil(AppCommandController.command(characters: \"a\", keyCode: 0, modifiers: [.command]))\n""",
          )

          # Stable home/current URL data contract.
          replace_once(
              "FloatTabsTests/TabStoreTests.swift",
              """    func testActiveSelectionUpdatesIdentity() {\n""",
              """    func testCurrentNavigationNeverMutatesStableHomeURL() {\n        let repository = MemoryProfileRepository()\n        let store = TabStore(repository: repository)\n        let profile = store.add(name: \"A\", homeURL: urlA)!\n\n        store.updateCurrentURL(id: profile.id, url: urlB)\n\n        let updated = try! XCTUnwrap(store.profiles.first(where: { $0.id == profile.id }))\n        XCTAssertEqual(updated.homeURL, urlA)\n        XCTAssertEqual(updated.currentURL, urlB)\n\n        let relaunched = TabStore(repository: repository)\n        let restored = try! XCTUnwrap(relaunched.profiles.first(where: { $0.id == profile.id }))\n        XCTAssertEqual(restored.homeURL, urlA)\n        XCTAssertEqual(restored.currentURL, urlB)\n    }\n\n    func testActiveSelectionUpdatesIdentity() {\n""",
          )

          # Slot context-menu ordering and shortcut hint.
          replace_once(
              "FloatTabsTests/ExternalShellTests.swift",
              """    func testActiveInactiveAndAddGeometryMatchDesignTokens() {\n""",
              """    func testTabContextMenuStartsWithReturnToHome() {\n        let (_, zone) = makeZoneHarness()\n        let active = makeProfile(order: 0, name: \"GPT\")\n        zone.apply(profiles: [active], activeTabID: active.id)\n        zone.layoutSubtreeIfNeeded()\n\n        let tab = try! XCTUnwrap(zone.tabView(for: active.id))\n        let event = NSEvent.mouseEvent(\n            with: .rightMouseDown,\n            location: NSPoint(x: tab.frame.midX, y: tab.frame.midY),\n            modifierFlags: [],\n            timestamp: 0,\n            windowNumber: 0,\n            context: nil,\n            eventNumber: 1,\n            clickCount: 1,\n            pressure: 1\n        )!\n        let menu = try! XCTUnwrap(tab.menu(for: event))\n        let first = try! XCTUnwrap(menu.items.first)\n\n        XCTAssertEqual(first.title, \"Return to Home\")\n        XCTAssertEqual(first.keyEquivalent, \"h\")\n        XCTAssertEqual(first.keyEquivalentModifierMask, [.command, .shift])\n    }\n\n    func testActiveInactiveAndAddGeometryMatchDesignTokens() {\n""",
          )

          # Navigation and popup policy now follows explicit user intent.
          replace_once(
              "FloatTabsTests/WebViewPoolTests.swift",
              """    func testNavigationCoordinatorLetsCrossSiteBlankReachUIDelegate() {\n        let result = WebNavigationCoordinator.disposition(\n            hasTargetFrame: false,\n            sourceURL: URL(string: \"https://example.com/article\"),\n            targetURL: URL(string: \"https://developer.apple.com/documentation\")\n        )\n\n        XCTAssertEqual(result, .allow)\n    }\n""",
              """    func testNavigationCoordinatorKeepsCrossSiteUserBlankInCurrentSlot() {\n        let result = WebNavigationCoordinator.disposition(\n            hasTargetFrame: false,\n            navigationType: .linkActivated,\n            sourceURL: URL(string: \"https://example.com/article\"),\n            targetURL: URL(string: \"https://developer.apple.com/documentation\")\n        )\n\n        XCTAssertEqual(result, .loadInCurrentSlot)\n    }\n\n    func testNavigationCoordinatorLetsScriptedBlankReachUIDelegate() {\n        let result = WebNavigationCoordinator.disposition(\n            hasTargetFrame: false,\n            navigationType: .other,\n            sourceURL: URL(string: \"https://example.com/article\"),\n            targetURL: URL(string: \"https://accounts.example-idp.com/oauth\")\n        )\n\n        XCTAssertEqual(result, .allow)\n    }\n""",
          )
          replace_once(
              "FloatTabsTests/WebViewPoolTests.swift",
              """    func testPopupRoutingSendsCrossSiteUserLinkToDefaultBrowser() {\n        let result = PopupCoordinator.disposition(\n            navigationType: .linkActivated,\n            sourceURL: URL(string: \"https://example.com\"),\n            targetURL: URL(string: \"https://developer.apple.com\")\n        )\n\n        XCTAssertEqual(result, .externalBrowser)\n    }\n""",
              """    func testPopupRoutingKeepsCrossSiteUserLinkInCurrentSlot() {\n        let result = PopupCoordinator.disposition(\n            navigationType: .linkActivated,\n            sourceURL: URL(string: \"https://example.com\"),\n            targetURL: URL(string: \"https://developer.apple.com\")\n        )\n\n        XCTAssertEqual(result, .currentSlot)\n    }\n""",
          )
          replace_once(
              "FloatTabsTests/WebViewPoolTests.swift",
              """    func testUploadPanelPolicyForSingleFile() {\n""",
              """    func testExplicitLinkContextMenuOffersUserControlledDestinations() {\n        let webView = WebViewFactory.makeWebView()\n        let coordinator = LinkContextMenuCoordinator(\n            webView: webView,\n            openFloating: { _, _ in },\n            openExternal: { _ in }\n        )\n        let url = URL(string: \"https://developer.apple.com/documentation\")!\n        let menu = coordinator.menu(for: url, sourceWebView: webView)\n        let actionTitles = menu.items.filter { !$0.isSeparatorItem }.map(\\.title)\n        let script = LinkContextMenuCoordinator.userScript()\n\n        XCTAssertEqual(\n            actionTitles,\n            [\"Open in Floating Window\", \"Open in Default Browser\", \"Copy Link\"]\n        )\n        XCTAssertEqual(script.injectionTime, .atDocumentStart)\n        XCTAssertFalse(script.isForMainFrameOnly)\n        XCTAssertTrue(script.source.contains(\"contextmenu\"))\n        XCTAssertTrue(script.source.contains(LinkContextMenuCoordinator.handlerName))\n        coordinator.invalidate()\n    }\n\n    func testExplicitUserFloatingWindowKeepsPersistentSessionAndSourceIdentity() {\n        let source = WebViewFactory.makeWebView()\n        source.customUserAgent = \"FloatTabs-Test-UA/1.0\"\n        let coordinator = PopupCoordinator(parentWebView: source)\n        let url = URL(string: \"https://example.invalid/floating\")!\n\n        let floating = try! XCTUnwrap(\n            coordinator.openUserFloatingWindow(url, from: source)\n        )\n\n        XCTAssertTrue(floating.configuration.websiteDataStore.isPersistent)\n        XCTAssertEqual(floating.customUserAgent, source.customUserAgent)\n        XCTAssertEqual(coordinator.userFloatingWindowCount, 1)\n        coordinator.closeAll()\n    }\n\n    func testUploadPanelPolicyForSingleFile() {\n""",
          )
          PY

      - name: Commit business changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FloatTabs FloatTabsTests
          git diff --cached --check
          git commit -m "feat: wire slot home and navigation intent UI"
          git push origin HEAD:feat/navigation-intent-slot-home-v2
