name: Stage 4 closeout source sync

on:
  push:
    branches:
      - feat/stage-4-closeout

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-4-closeout
          fetch-depth: 0

      - name: Apply guarded closeout sync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_section(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one section, found {count}")
              return updated

          product_path = Path("docs/product/FloatTabs_Product_Development_Spec_v0.5.md")
          product = product_path.read_text()

          product = replace_section(
              product,
              r"## 6\.1 Slot Context Menu\n.*?(?=\n---\n\n# 7\.)",
              """## 6.1 Slot Context Menu

Slot 右键菜单保持精简，管理的是 Slot 本身而不是模拟完整浏览器：

```text
Return to Home
────────────
Edit Web App…
────────────
Remove Web App…
```

`Edit Web App…` 已包含 Name，因此不再提供独立 `Rename` 动作。排序继续使用拖拽；`⌘1…⌘9` 始终跟随当前排序。

`Return to Home` 导航到稳定的 `homeURL`，不主动清空 WebKit back/forward history。熟练用户也可使用 `⌘⇧H`。
""",
              "Product §6.1",
          )

          product = replace_section(
              product,
              r"# 10\. Keyboard Model\n.*?(?=\n---\n\n# 11\.)",
              """# 10. Keyboard Model

FloatTabs 激活时：

| Shortcut | Action |
|---|---|
| `⌘1…⌘9` | Select Slot by order |
| `⌃Tab` | Next Slot |
| `⌃⇧Tab` | Previous Slot |
| `⌘T` | Add Web App |
| `⌘L` | Quick URL |
| `⌘⇧H` | Return active Slot to Home |
| `⌘R` | Reload |
| `⌘+` | Zoom In |
| `⌘-` | Zoom Out |
| `⌘0` | Reset Zoom |
| `Esc` | Dismiss current transient UI |
| `⌘,` | Global Settings |

`⌘W` 不删除 persistent Slot。V1 可保持未绑定，避免误删/语义冲突。
""",
              "Product §10",
          )

          product = replace_section(
              product,
              r"# 12\. Navigation Policy\n.*?(?=\n---\n\n# 13\.)",
              """# 12. Navigation Policy

## 12.1 Current Slot — 默认浏览容器

普通 HTTP(S) 用户导航默认保留在当前 Slot，不再按 Host / 跨站与否自动跳到系统浏览器：

```text
ordinary left click              → current Slot
user target=_blank HTTP(S) link  → current Slot
```

浏览过程中持续更新 `currentURL`；稳定的 `homeURL` 代表该 Slot 的回归点，不随深度浏览漂移。

```text
Tab context menu → Return to Home
⌘⇧H             → Return active Slot to Home
```

Return Home 是普通导航，不主动清空 WebKit back/forward history。

## 12.2 Explicit Destinations / Website Popups

HTTP(S) 链接右键提供显式用户意图：

```text
Open in Floating Window → user-created FloatTabs floating window
Open in Default Browser → system default browser
Copy Link               → clipboard
```

网站自身创建的新上下文保持独立语义：

- scripted `window.open` / OAuth/login popup → temporary child WKWebView；
- `about:blank` auth bootstrap → temporary child WKWebView；
- non-HTTP(S) scheme → system handler；
- never auto-create permanent FloatTabs Slot。

因此默认浏览器是“用户显式选择的目的地”，不是“cross-site URL 自动分类结果”。

**不存在右上角 FloatTabs `…`。**
""",
              "Product §12",
          )

          product = replace_section(
              product,
              r"## Stage 2 — Persistent Web App Slots\n.*?(?=\n## Stage 3 —)",
              """## Stage 2 — Persistent Web App Slots

- TabStore；
- External Index Tabs；
- `+` Add；
- Edit/Remove；
- drag reorder；
- `⌘1…⌘9`；
- `⌃Tab`；
- current URL；
- relaunch restore。

""",
              "Product Stage 2",
          )

          product = replace_section(
              product,
              r"## Stage 4 — Web Compatibility & Sessions\n.*?(?=\n## Stage 5 —)",
              """## Stage 4 — Web Compatibility & Sessions

- persistent website-data QA；
- direct login restore；
- Navigation Intent：普通 HTTP(S) 用户导航留在当前 Slot；
- explicit Floating Window / Default Browser link actions；
- scripted `window.open` / popup/OAuth child WebView；
- representative real-site session/OAuth QA；
- full priority-site Google/Apple/provider compatibility matrix remains a V1 release QA gate；
- upload；
- download；
- content-process recovery。

""",
              "Product Stage 4",
          )

          product, count = re.subn(
              r"#15\s+Handle target=_blank / default browser routing",
              "#15 Implement Navigation Intent / target=_blank / explicit floating + default-browser routing",
              product,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Product issue #15: expected one match, found {count}")

          product = replace_section(
              product,
              r"## Slots\n.*?(?=\n## Rendering)",
              """## Slots

- [ ] persistent left-edge Slots
- [ ] Add/Edit/Remove
- [ ] Return to Home + `⌘⇧H`
- [ ] drag reorder
- [ ] `⌘1…⌘9`
- [ ] `⌃Tab`
- [ ] current URL persisted
- [ ] last active restored

""",
              "Product DoD Slots",
          )

          product = replace_section(
              product,
              r"## Web / Login\n.*?(?=\n## Resource)",
              """## Web / Login

- [ ] persistent login across restart
- [ ] session survives normal in-place update
- [ ] ordinary HTTP(S) navigation remains in current Slot
- [ ] target=_blank / Navigation Intent policy
- [ ] popup/OAuth child WebView
- [ ] Google/Apple/provider compatibility recorded per priority site before V1 release
- [ ] explicit default-browser action
- [ ] file upload
- [ ] download
- [ ] process termination recovery

""",
              "Product DoD Web/Login",
          )

          product_path.write_text(product)

          architecture_path = Path("docs/architecture/FloatTabs_Technical_Architecture_v1.2.md")
          architecture = architecture_path.read_text()

          architecture = replace_section(
              architecture,
              r"# 8\. Navigation Policy\n.*?(?=\n---\n\n# 9\.)",
              """# 8. Navigation Policy

FloatTabs remains a lightweight persistent Web App container rather than a traditional research browser, but ordinary user navigation stays inside the active Slot unless the user explicitly chooses another destination.

## 8.1 Ordinary User Navigation

Host comparison is not a browser-boundary rule.

```text
ordinary HTTP(S) left click       → current Slot
user target=_blank HTTP(S) link   → current Slot
```

Normal navigation continuously updates `currentURL` while preserving the stable Slot `homeURL`.

## 8.2 Explicit Destinations / Website Popups

HTTP(S) link context actions expose explicit user intent:

```text
Open in Floating Window → user-created FloatTabs floating window
Open in Default Browser → system default browser
Copy Link               → clipboard
```

Website-created contexts remain separate:

- scripted `window.open` / OAuth/login popup → temporary child WebView when appropriate;
- `about:blank` auth bootstrap → temporary child WebView;
- non-web schemes → system handler;
- never auto-create a permanent FloatTabs Slot.

The system default browser is therefore an explicit user-selected destination, not an automatic cross-site policy.

## 8.3 Slot Home / Quick URL

`homeURL` is stable Slot identity; `currentURL` is mutable browsing position.

```text
Tab context menu → Return to Home
⌘⇧H             → Return active Slot to Home
```

Return Home performs normal navigation and does not explicitly clear WebKit back/forward history.

There is no permanent address bar. `⌘L` opens a temporary URL overlay; V1 has no history/search suggestions.

There is no top-right FloatTabs `…` menu.
""",
              "Architecture §8",
          )

          architecture = replace_section(
              architecture,
              r"## 14\.1 Web Content Process Termination\n.*?(?=\n## 14\.2)",
              """## 14.1 Web Content Process Termination

`SlotNavigationObserver` surfaces `webViewWebContentProcessDidTerminate` to `WebViewPool`.

Recovery policy:

- active Slot → immediately reload the last known safe/current URL with normal protocol cache policy;
- inactive Slot → record deferred recovery and reload its persisted `currentURL` (falling back to `homeURL`) when that Slot is next activated;
- reuse the same `WKWebView` for deferred recovery when sufficient;
- do not crash the host app;
- do not clear or replace `WKWebsiteDataStore.default()`.

""",
              "Architecture §14.1",
          )

          architecture_path.write_text(architecture)

          factory_path = Path("FloatTabs/Web/WebViewFactory.swift")
          factory = factory_path.read_text()
          old_comment = '''    /// At rest the WebView owns no visible AppKit scroller at all. This avoids
    /// inheriting the user's global "Show scroll bars: Always" preference.
    /// Scrollers are enabled only during active wheel/trackpad scrolling by the
    /// transient-scroller controller below.
'''
          new_comment = '''    /// AppKit scrollers stay visually disabled even while the document scrolls.
    /// This avoids inheriting the user's global "Show scroll bars: Always"
    /// preference and forms the native half of the permanent scrollbar
    /// suppression policy without disabling document scrolling.
'''
          if factory.count(old_comment) != 1:
              raise SystemExit("WebViewFactory scrollbar comment: expected one match")
          factory_path.write_text(factory.replace(old_comment, new_comment, 1))
          PY

      - name: Commit closeout sync
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product/FloatTabs_Product_Development_Spec_v0.5.md docs/architecture/FloatTabs_Technical_Architecture_v1.2.md FloatTabs/Web/WebViewFactory.swift
          git commit -m "docs: align Stage 4 closeout source of truth"
          git push origin HEAD:feat/stage-4-closeout
