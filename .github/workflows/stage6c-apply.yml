name: Stage 6C Apply

on:
  push:
    branches:
      - feat/stage-6c-page-context-menu
    paths:
      - '.github/stage6c_patch.py'
      - '.github/stage6c-trigger'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-6c-page-context-menu

      - name: Apply Stage 6C patch
        run: python3 .github/stage6c_patch.py

      - name: Check diff
        run: git diff --check

      - name: Resolve packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Full unit tests
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit validated Stage 6C implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Web/WebViewPool.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/Tabs/WebAppProfile.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/ExternalShellTests.swift \
            docs/product/FloatTabs_Product_Development_Spec_v0.5.md \
            docs/architecture/FloatTabs_Technical_Architecture_v1.2.md \
            docs/design/FloatTabs_UI_Design_System_v1.2.md
          git commit -m 'feat: refine Stage 6C page context menu'
          git push origin HEAD:feat/stage-6c-page-context-menu
