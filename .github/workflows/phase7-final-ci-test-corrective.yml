name: Phase7 Final CI Single-Test Corrective

on:
  push:
    branches:
      - codex/ft-runtime-lifecycle-phase7-automatic-001

permissions:
  contents: write

jobs:
  corrective:
    if: github.repository == 'Lost0rz/FloatTabs'
    runs-on: [self-hosted, macOS, ARM64, mac-mini-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply single authorized test correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("FloatTabsTests/WebAttentionCrossFeatureTests.swift")
          text = path.read_text()
          old = '''        if webInteractionRegained {
              XCTAssertNil(controller.debugInactivePlanToken(slotID: slot.id))
        } else {
              XCTAssertNotNil(controller.debugInactivePlanToken(slotID: slot.id))
        }'''
          new = '''        XCTAssertNil(controller.debugInactivePlanToken(slotID: slot.id))'''
          if old not in text:
              raise SystemExit("expected environment-dependent inactive-plan assertion not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify one-test-file scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "FloatTabsTests/WebAttentionCrossFeatureTests.swift"

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Full XCTest
        id: xctest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/FloatTabsPhase7FinalCorrective.xcresult"
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/FloatTabsPhase7FinalCorrective" \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsPhase7FinalCorrective.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/phase7-final-corrective-xctest.log"

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase7-Final-Corrective-XCTest-Diagnostics
          path: |
            ${{ runner.temp }}/phase7-final-corrective-xctest.log
            ${{ runner.temp }}/FloatTabsPhase7FinalCorrective.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Require full XCTest pass
        if: steps.xctest.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Remove temporary corrective workflow
        run: rm -f .github/workflows/phase7-final-ci-test-corrective.yml

      - name: Commit and push verified single-test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stabilize Phase 7 lifecycle ownership assertion"
          git push origin "HEAD:${GITHUB_REF_NAME}"
