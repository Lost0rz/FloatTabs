name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Native WebKit viewport strategy probe
        shell: bash
        run: |
          cat > /tmp/FloatTabsViewportProbe.swift <<'SWIFT'
          import AppKit
          import Foundation
          import WebKit

          final class Waiter: NSObject, WKNavigationDelegate {
              var finished = false
              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  finished = true
              }
          }

          @discardableResult
          func spin(until condition: () -> Bool, timeout: TimeInterval = 5) -> Bool {
              let deadline = Date().addingTimeInterval(timeout)
              while !condition(), Date() < deadline {
                  RunLoop.current.run(mode: .default, before: Date().addingTimeInterval(0.01))
              }
              return condition()
          }

          func evaluate(_ script: String, in webView: WKWebView) -> Any? {
              var done = false
              var result: Any?
              var failure: Error?
              webView.evaluateJavaScript(script) { value, error in
                  result = value
                  failure = error
                  done = true
              }
              _ = spin(until: { done })
              if let failure {
                  print("JS ERROR: \(failure)")
              }
              return result
          }

          func probe(name: String, configure: (WKWebView) -> Void) {
              let configuration = WKWebViewConfiguration()
              configuration.websiteDataStore = .nonPersistent()
              let webView = WKWebView(
                  frame: NSRect(x: 0, y: 0, width: 430, height: 820),
                  configuration: configuration
              )
              let window = NSWindow(
                  contentRect: NSRect(x: 0, y: 0, width: 430, height: 820),
                  styleMask: [.borderless],
                  backing: .buffered,
                  defer: false
              )
              window.contentView = webView
              window.orderFront(nil)

              configure(webView)

              let waiter = Waiter()
              webView.navigationDelegate = waiter
              webView.loadHTMLString(
                  """
                  <!doctype html>
                  <html>
                    <head>
                      <meta name="viewport" content="width=device-width, initial-scale=1">
                      <style>
                        html, body { margin: 0; width: 100%; height: 100%; }
                        #target {
                          position: fixed;
                          left: 50vw;
                          top: 50vh;
                          width: 120px;
                          height: 80px;
                          transform: translate(-50%, -50%);
                        }
                      </style>
                    </head>
                    <body>
                      <button id="target">click</button>
                      <script>
                        window.clicks = 0;
                        target.addEventListener('click', () => window.clicks++);
                      </script>
                    </body>
                  </html>
                  """,
                  baseURL: nil
              )
              _ = spin(until: { waiter.finished })

              let metrics = evaluate(
                  """
                  JSON.stringify({
                    innerWidth: window.innerWidth,
                    clientWidth: document.documentElement.clientWidth,
                    desktopMQ: matchMedia('(min-width: 1000px)').matches,
                    dpr: devicePixelRatio,
                    zoom: getComputedStyle(document.documentElement).zoom,
                    rect: (() => { const r = target.getBoundingClientRect(); return [r.left,r.top,r.width,r.height]; })()
                  })
                  """,
                  in: webView
              ) as? String ?? "<nil>"

              let location = NSPoint(x: 215, y: 410)
              if let down = NSEvent.mouseEvent(
                  with: .leftMouseDown,
                  location: location,
                  modifierFlags: [],
                  timestamp: ProcessInfo.processInfo.systemUptime,
                  windowNumber: window.windowNumber,
                  context: nil,
                  eventNumber: 1,
                  clickCount: 1,
                  pressure: 1
              ), let up = NSEvent.mouseEvent(
                  with: .leftMouseUp,
                  location: location,
                  modifierFlags: [],
                  timestamp: ProcessInfo.processInfo.systemUptime,
                  windowNumber: window.windowNumber,
                  context: nil,
                  eventNumber: 2,
                  clickCount: 1,
                  pressure: 0
              ) {
                  webView.mouseDown(with: down)
                  webView.mouseUp(with: up)
                  _ = spin(until: { ((evaluate("window.clicks", in: webView) as? NSNumber)?.intValue ?? 0) > 0 }, timeout: 1)
              }

              let clicks = (evaluate("window.clicks", in: webView) as? NSNumber)?.intValue ?? -1
              print("PROBE \(name): pageZoom=\(webView.pageZoom) magnification=\(webView.magnification) metrics=\(metrics) clicks=\(clicks)")
              window.orderOut(nil)
          }

          _ = NSApplication.shared

          probe(name: "baseline") { _ in }
          probe(name: "pageZoom-430-over-1280") { webView in
              webView.pageZoom = 430.0 / 1280.0
          }
          probe(name: "magnification-430-over-1280") { webView in
              webView.allowsMagnification = true
              webView.setMagnification(430.0 / 1280.0, centeredAt: NSPoint(x: 215, y: 410))
          }
          probe(name: "pageZoom-900-over-390") { webView in
              webView.pageZoom = 900.0 / 390.0
          }
          SWIFT
          xcrun swift /tmp/FloatTabsViewportProbe.swift

      - name: Unit tests
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          test
