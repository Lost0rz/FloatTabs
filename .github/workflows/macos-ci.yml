name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-4-web-compatibility-sessions

      - name: Apply guarded permanent scrollbar suppression repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} guarded match(es), found {actual}")
              p.write_text(text.replace(old, new, count))

          factory = "FloatTabs/Web/WebViewFactory.swift"

          replace(
              factory,
              '''@MainActor
enum WebViewFactory {
    static func makeWebView(
''',
              '''@MainActor
enum WebViewFactory {
    private static let hiddenScrollbarScriptSource = """
    (() => {
      const styleID = 'floattabs-hidden-scrollbar-style';
      const install = () => {
        const root = document.documentElement;
        if (!root || document.getElementById(styleID)) return;

        const style = document.createElement('style');
        style.id = styleID;
        style.textContent = `
          html, body {
            scrollbar-width: none !important;
          }
          html::-webkit-scrollbar,
          body::-webkit-scrollbar {
            width: 0 !important;
            height: 0 !important;
            display: none !important;
          }
        `;
        (document.head || root).appendChild(style);
      };

      if (document.documentElement) {
        install();
      } else {
        document.addEventListener('DOMContentLoaded', install, { once: true });
      }
    })();
    """

    static func hiddenScrollbarUserScript() -> WKUserScript {
        WKUserScript(
            source: hiddenScrollbarScriptSource,
            injectionTime: .atDocumentStart,
            forMainFrameOnly: false
        )
    }

    static func makeWebView(
'''
          )

          replace(
              factory,
              '''        configuration.defaultWebpagePreferences.preferredContentMode =
            rendering.effectiveWebsiteMode == .desktop ? .desktop : .mobile

        let webView = FloatTabsWebView(frame: .zero, configuration: configuration)
''',
              '''        configuration.defaultWebpagePreferences.preferredContentMode =
            rendering.effectiveWebsiteMode == .desktop ? .desktop : .mobile
        configuration.userContentController.addUserScript(hiddenScrollbarUserScript())

        let webView = FloatTabsWebView(frame: .zero, configuration: configuration)
'''
          )

          replace(
              factory,
              '''    static func configureHiddenScrollerStyle(_ scrollView: NSScrollView) {
        scrollView.scrollerStyle = .overlay
        scrollView.autohidesScrollers = true
        scrollView.hasVerticalScroller = false
        scrollView.hasHorizontalScroller = false
    }

    static func setScrollerVisibility(
        _ scrollView: NSScrollView,
        vertical: Bool,
        horizontal: Bool
    ) {
        scrollView.scrollerStyle = .overlay
        scrollView.autohidesScrollers = true
        scrollView.hasVerticalScroller = vertical
        scrollView.hasHorizontalScroller = horizontal

        if vertical || horizontal {
            scrollView.flashScrollers()
        }
    }
''',
              '''    static func configureHiddenScrollerStyle(_ scrollView: NSScrollView) {
        scrollView.scrollerStyle = .overlay
        scrollView.autohidesScrollers = true
        scrollView.verticalScroller?.isHidden = true
        scrollView.horizontalScroller?.isHidden = true
        scrollView.hasVerticalScroller = false
        scrollView.hasHorizontalScroller = false
    }
'''
          )

          replace(
              factory,
              '''final class FloatTabsWebView: WKWebView {
    private var transientScrollerController: TransientWebScrollerController?
    private(set) var websiteMode: WebsiteMode = .desktop
''',
              '''final class FloatTabsWebView: WKWebView {
    private(set) var websiteMode: WebsiteMode = .desktop
'''
          )

          replace(
              factory,
              '''    override init(frame frameRect: NSRect, configuration: WKWebViewConfiguration) {
        super.init(frame: frameRect, configuration: configuration)
        transientScrollerController = TransientWebScrollerController(webView: self)
        refreshWebsiteLayoutScale()
    }
''',
              '''    override init(frame frameRect: NSRect, configuration: WKWebViewConfiguration) {
        super.init(frame: frameRect, configuration: configuration)
        refreshWebsiteLayoutScale()
    }
'''
          )

          replace(
              factory,
              '''    override func viewDidMoveToWindow() {
        super.viewDidMoveToWindow()
        refreshWebsiteLayoutScale()
        transientScrollerController?.refreshScrollerState()
    }
''',
              '''    override func viewDidMoveToWindow() {
        super.viewDidMoveToWindow()
        refreshWebsiteLayoutScale()
        WebViewFactory.configureHiddenScrollers(in: self)
    }
'''
          )

          transient_block = '''

/// WKWebView retains this controller for its whole lifetime. The controller
/// watches local scroll-wheel events over this WebView and temporarily exposes
/// only the scroller axis that is actually moving. Once scrolling stops, both
/// AppKit scrollers are removed again so they cannot reserve or paint idle UI.
@MainActor
private final class TransientWebScrollerController {
    private weak var webView: WKWebView?
    private var localScrollMonitor: Any?
    private var hideWorkItem: DispatchWorkItem?

    private static let idleHideDelay: TimeInterval = 0.6
    private static let minimumDelta: CGFloat = 0.01

    init(webView: WKWebView) {
        self.webView = webView
        refreshScrollerState()

        localScrollMonitor = NSEvent.addLocalMonitorForEvents(matching: .scrollWheel) {
            [weak self] event in
            self?.handleScrollWheel(event)
            return event
        }
    }

    deinit {
        hideWorkItem?.cancel()
        if let localScrollMonitor {
            NSEvent.removeMonitor(localScrollMonitor)
        }
    }

    func refreshScrollerState() {
        guard let webView else { return }
        WebViewFactory.configureHiddenScrollers(in: webView)
    }

    private func handleScrollWheel(_ event: NSEvent) {
        guard let webView,
              event.window === webView.window else {
            return
        }

        let location = webView.convert(event.locationInWindow, from: nil)
        guard webView.bounds.contains(location) else { return }

        let showVertical = abs(event.scrollingDeltaY) > Self.minimumDelta
        let showHorizontal = abs(event.scrollingDeltaX) > Self.minimumDelta
        guard showVertical || showHorizontal else { return }

        let scrollViews = WebViewFactory.descendantScrollViews(in: webView)
        for scrollView in scrollViews {
            WebViewFactory.setScrollerVisibility(
                scrollView,
                vertical: showVertical,
                horizontal: showHorizontal
            )
        }

        scheduleHide()
    }

    private func scheduleHide() {
        hideWorkItem?.cancel()

        let item = DispatchWorkItem { [weak self] in
            guard let webView = self?.webView else { return }
            WebViewFactory.configureHiddenScrollers(in: webView)

            // WebKit can replace its internal scroll view during the same layout
            // turn. Re-scan once more on the next main-queue turn so the current
            // scroller, not a stale captured instance, is forced back to rest.
            DispatchQueue.main.async { [weak webView] in
                guard let webView else { return }
                WebViewFactory.configureHiddenScrollers(in: webView)
            }
        }

        hideWorkItem = item
        DispatchQueue.main.asyncAfter(
            deadline: .now() + Self.idleHideDelay,
            execute: item
        )
    }
}
'''
          p = Path(factory)
          text = p.read_text()
          if text.count(transient_block) != 1:
              raise SystemExit(f"{factory}: transient controller block mismatch")
          p.write_text(text.replace(transient_block, "\n", 1))

          observer = Path("FloatTabs/Web/SlotNavigationObserver.swift")
          observer_text = observer.read_text()
          old_name = "restoreTransientScrollerPolicy"
          actual = observer_text.count(old_name)
          if actual != 6:
              raise SystemExit(f"SlotNavigationObserver.swift: expected 6 transient-policy references, found {actual}")
          observer.write_text(observer_text.replace(old_name, "restoreHiddenScrollerPolicy"))

          tests = "FloatTabsTests/WebViewFactoryTests.swift"
          replace(
              tests,
              '''    func testScrollerVisibilityCanBeEnabledOnlyForActiveAxis() {
        let scrollView = NSScrollView(frame: NSRect(x: 0, y: 0, width: 300, height: 500))
        WebViewFactory.configureHiddenScrollerStyle(scrollView)

        WebViewFactory.setScrollerVisibility(
            scrollView,
            vertical: true,
            horizontal: false
        )

        XCTAssertEqual(scrollView.scrollerStyle, .overlay)
        XCTAssertTrue(scrollView.autohidesScrollers)
        XCTAssertTrue(scrollView.hasVerticalScroller)
        XCTAssertFalse(scrollView.hasHorizontalScroller)

        WebViewFactory.configureHiddenScrollerStyle(scrollView)
        XCTAssertFalse(scrollView.hasVerticalScroller)
        XCTAssertFalse(scrollView.hasHorizontalScroller)
    }
''',
              '''    func testWebViewInstallsPermanentContentScrollbarSuppression() {
        let webView = WebViewFactory.makeWebView()
        let script = webView.configuration.userContentController.userScripts.first {
            $0.source.contains("floattabs-hidden-scrollbar-style")
        }

        XCTAssertNotNil(script)
        XCTAssertEqual(script?.injectionTime, WKUserScriptInjectionTime.atDocumentStart)
        XCTAssertFalse(script?.isForMainFrameOnly ?? true)
        XCTAssertTrue(script?.source.contains("html::-webkit-scrollbar") == true)
        XCTAssertTrue(script?.source.contains("scrollbar-width: none") == true)
    }

    func testContentScrollbarSuppressionPreservesDocumentScrolling() {
        let webView = WebViewFactory.makeWebView()
        _ = host(webView, visibleSize: NSSize(width: 320, height: 400))
        loadTestHTML(in: webView)

        let styleInstalled = evaluateNumber(
            "document.getElementById('floattabs-hidden-scrollbar-style') ? 1 : 0",
            in: webView
        )
        let scrollY = evaluateNumber(
            "(() => { document.body.style.height = '2400px'; window.scrollTo(0, 200); return window.scrollY; })()",
            in: webView
        )

        XCTAssertEqual(styleInstalled, 1, accuracy: 0.001)
        XCTAssertGreaterThan(scrollY, 0)
    }
'''
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FloatTabs/Web/WebViewFactory.swift FloatTabs/Web/SlotNavigationObserver.swift FloatTabsTests/WebViewFactoryTests.swift
          if git diff --cached --quiet; then
            echo "Guarded repair produced no changes" >&2
            exit 1
          fi
          git commit -m "fix: permanently suppress webpage scrollbars"
          git push origin HEAD:feat/stage-4-web-compatibility-sessions

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'

          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult
