name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Write public WebKit strategy probe
        shell: bash
        run: |
          cat > /tmp/FloatTabsViewportProbe.swift <<'SWIFT'
          import AppKit
          import Foundation
          import WebKit

          final class Waiter: NSObject, WKNavigationDelegate {
              var finished = false
              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  finished = true
              }
          }

          @discardableResult
          func spin(until condition: () -> Bool, timeout: TimeInterval = 5) -> Bool {
              let deadline = Date().addingTimeInterval(timeout)
              while !condition(), Date() < deadline {
                  RunLoop.current.run(mode: .default, before: Date().addingTimeInterval(0.01))
              }
              return condition()
          }

          func evaluate(_ script: String, in webView: WKWebView) -> Any? {
              var done = false
              var result: Any?
              var failure: Error?
              webView.evaluateJavaScript(script) { value, error in
                  result = value
                  failure = error
                  done = true
              }
              _ = spin(until: { done })
              if let failure { print("JS ERROR: \(failure)") }
              return result
          }

          enum Strategy: String {
              case pageZoomDesktop
              case magnificationDesktop
              case pageZoomMobile
          }

          guard CommandLine.arguments.count == 2,
                let strategy = Strategy(rawValue: CommandLine.arguments[1]) else {
              fatalError("missing strategy")
          }

          _ = NSApplication.shared
          let configuration = WKWebViewConfiguration()
          configuration.websiteDataStore = .nonPersistent()
          let webView = WKWebView(
              frame: NSRect(x: 0, y: 0, width: strategy == .pageZoomMobile ? 900 : 430, height: 820),
              configuration: configuration
          )
          let window = NSWindow(
              contentRect: webView.frame,
              styleMask: [.borderless],
              backing: .buffered,
              defer: false
          )
          window.contentView = webView
          window.orderFront(nil)

          switch strategy {
          case .pageZoomDesktop:
              webView.pageZoom = 430.0 / 1280.0
          case .magnificationDesktop:
              webView.allowsMagnification = true
              webView.setMagnification(430.0 / 1280.0, centeredAt: NSPoint(x: 215, y: 410))
          case .pageZoomMobile:
              webView.pageZoom = 900.0 / 390.0
          }

          let waiter = Waiter()
          webView.navigationDelegate = waiter
          webView.loadHTMLString(
              """
              <!doctype html>
              <html>
                <head>
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <style>
                    html, body { margin: 0; width: 100%; height: 100%; }
                    #target {
                      position: fixed;
                      left: 50vw;
                      top: 50vh;
                      width: 120px;
                      height: 80px;
                      transform: translate(-50%, -50%);
                    }
                  </style>
                </head>
                <body>
                  <button id="target">click</button>
                  <script>
                    window.clicks = 0;
                    target.addEventListener('click', () => window.clicks++);
                  </script>
                </body>
              </html>
              """,
              baseURL: nil
          )
          guard spin(until: { waiter.finished }) else { fatalError("navigation timeout") }

          let innerWidth = (evaluate("window.innerWidth", in: webView) as? NSNumber)?.doubleValue ?? -1
          let clientWidth = (evaluate("document.documentElement.clientWidth", in: webView) as? NSNumber)?.doubleValue ?? -1
          let desktopMQ = (evaluate("matchMedia('(min-width: 1000px)').matches", in: webView) as? NSNumber)?.boolValue ?? false

          let physicalWidth = webView.frame.width
          let location = NSPoint(x: physicalWidth / 2, y: webView.frame.height / 2)
          if let down = NSEvent.mouseEvent(
              with: .leftMouseDown,
              location: location,
              modifierFlags: [],
              timestamp: ProcessInfo.processInfo.systemUptime,
              windowNumber: window.windowNumber,
              context: nil,
              eventNumber: 1,
              clickCount: 1,
              pressure: 1
          ), let up = NSEvent.mouseEvent(
              with: .leftMouseUp,
              location: location,
              modifierFlags: [],
              timestamp: ProcessInfo.processInfo.systemUptime,
              windowNumber: window.windowNumber,
              context: nil,
              eventNumber: 2,
              clickCount: 1,
              pressure: 0
          ) {
              webView.mouseDown(with: down)
              webView.mouseUp(with: up)
              _ = spin(until: {
                  ((evaluate("window.clicks", in: webView) as? NSNumber)?.intValue ?? 0) > 0
              }, timeout: 1)
          }

          let clicks = (evaluate("window.clicks", in: webView) as? NSNumber)?.intValue ?? -1
          print("RESULT strategy=\(strategy.rawValue) innerWidth=\(innerWidth) clientWidth=\(clientWidth) desktopMQ=\(desktopMQ) clicks=\(clicks) pageZoom=\(webView.pageZoom) magnification=\(webView.magnification)")

          let widthOK: Bool
          let mqOK: Bool
          switch strategy {
          case .pageZoomDesktop, .magnificationDesktop:
              widthOK = (1200...1360).contains(innerWidth) && (1200...1360).contains(clientWidth)
              mqOK = desktopMQ
          case .pageZoomMobile:
              widthOK = (360...420).contains(innerWidth) && (360...420).contains(clientWidth)
              mqOK = !desktopMQ
          }

          guard widthOK, mqOK, clicks > 0 else {
              fatalError("strategy failed viewport/click contract")
          }
          SWIFT

      - name: Probe pageZoom Desktop
        continue-on-error: true
        run: xcrun swift /tmp/FloatTabsViewportProbe.swift pageZoomDesktop

      - name: Probe magnification Desktop
        continue-on-error: true
        run: xcrun swift /tmp/FloatTabsViewportProbe.swift magnificationDesktop

      - name: Probe pageZoom Mobile
        continue-on-error: true
        run: xcrun swift /tmp/FloatTabsViewportProbe.swift pageZoomMobile

      - name: Unit tests
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          test
