name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Apply guarded pool expectation repair
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout -B ci-repair "origin/$HEAD_REF"

          python3 <<'PY'
          from pathlib import Path

          tests = Path('FloatTabsTests/WebViewPoolTests.swift')
          text = tests.read_text()
          old = '''        XCTAssertTrue(mobile.customUserAgent?.contains("iPhone") == true)
          '''
          new = '''        XCTAssertTrue(mobile.customUserAgent?.contains("Macintosh") == true)
                  XCTAssertFalse(mobile.customUserAgent?.contains("iPhone") == true)
          '''
          if old not in text:
              if 'XCTAssertTrue(mobile.customUserAgent?.contains("Macintosh") == true)' not in text:
                  raise SystemExit('Expected stale Mobile Automatic UA assertion was not found')
          else:
              tests.write_text(text.replace(old, new, 1))
          PY

          if git diff --quiet -- FloatTabsTests/WebViewPoolTests.swift; then
            echo 'Guarded pool expectation repair already present; no commit needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabsTests/WebViewPoolTests.swift
          git commit -m 'test: keep automatic mobile identity on macOS'
          git push origin "HEAD:$HEAD_REF"

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'

          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult
