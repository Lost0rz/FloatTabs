name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-4-web-compatibility-sessions

      - name: Apply guarded native automatic UA repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('FloatTabs/Web/WebViewFactory.swift')
          text = p.read_text()
          old = '''        webView.customUserAgent = UserAgentProvider.customUserAgent(\n            for: rendering,\n            versions: versions\n        )\n'''
          new = '''        if rendering.browserIdentity != .automatic {\n            webView.customUserAgent = UserAgentProvider.customUserAgent(\n                for: rendering,\n                versions: versions\n            )\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one UA assignment block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FloatTabs/Web/WebViewFactory.swift
          git commit -m "fix: leave automatic user agent owned by WebKit"
          git push origin HEAD:feat/stage-4-web-compatibility-sessions

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'
          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult
