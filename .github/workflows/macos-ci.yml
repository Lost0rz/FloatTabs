name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Apply guarded compatibility regression repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} guarded match(es), found {actual}")
              p.write_text(text.replace(old, new, count))

          replace(
              "FloatTabs/Tabs/WebRenderingProfile.swift",
              '''    /// Website Mode and Browser Identity are independent product layers.\n    /// Automatic follows FloatTabs' native macOS WKWebView identity; only an\n    /// explicit identity selection changes the platform/browser UA.\n    var effectiveWebsiteMode: WebsiteMode {\n        websiteMode\n    }\n\n    var effectiveBrowserIdentity: BrowserIdentity {\n        switch browserIdentity {\n        case .automatic:\n            return .macosSafari\n        default:\n            return browserIdentity\n        }\n    }\n''',
              '''    /// Website Mode and Browser Identity are independent product layers.\n    /// Automatic follows the requested Website Mode, while an explicit identity\n    /// remains independent and always wins.\n    var effectiveWebsiteMode: WebsiteMode {\n        websiteMode\n    }\n\n    var effectiveBrowserIdentity: BrowserIdentity {\n        switch browserIdentity {\n        case .automatic:\n            return websiteMode == .desktop ? .macosSafari : .iphoneSafari\n        default:\n            return browserIdentity\n        }\n    }\n'''
          )

          replace(
              "FloatTabs/Web/WebViewFactory.swift",
              '''    /// Runtime override. Desktop macOS Safari can stay `nil` so WebKit supplies\n    /// its native UA plus `applicationNameForUserAgent`. Mobile content mode is\n    /// different: WebKit synthesizes an iPhone UA when no override is present,\n    /// so keep Website Mode and browser identity independent by explicitly\n    /// restoring the macOS Safari identity there.\n''',
              '''    /// Runtime override. Automatic deliberately stays `nil` so WebKit can pair\n    /// the requested content mode with its native current UA. Explicit identities\n    /// remain compatibility overrides and may replace that native identity.\n'''
          )

          replace(
              "FloatTabs/Web/WebViewFactory.swift",
              '''        let profile = renderingProfile.normalized()\n        let identity = resolvedIdentity(\n            profile.effectiveBrowserIdentity,\n            customUserAgent: profile.customUserAgent\n        )\n\n        if identity == .macosSafari,\n           profile.effectiveWebsiteMode == .desktop {\n            return nil\n        }\n''',
              '''        let profile = renderingProfile.normalized()\n\n        if profile.browserIdentity == .automatic {\n            return nil\n        }\n\n        let identity = resolvedIdentity(\n            profile.effectiveBrowserIdentity,\n            customUserAgent: profile.customUserAgent\n        )\n\n        if identity == .macosSafari,\n           profile.effectiveWebsiteMode == .desktop {\n            return nil\n        }\n'''
          )

          replace(
              "FloatTabs/Web/WebViewFactory.swift",
              '''    static func userAgent(\n        for identity: BrowserIdentity,\n        websiteMode _: WebsiteMode,\n        customUserAgent: String? = nil,\n        versions: BrowserVersionCatalog\n    ) -> String {\n        switch resolvedIdentity(\n            identity,\n            customUserAgent: customUserAgent\n        ) {\n''',
              '''    static func userAgent(\n        for identity: BrowserIdentity,\n        websiteMode: WebsiteMode,\n        customUserAgent: String? = nil,\n        versions: BrowserVersionCatalog\n    ) -> String {\n        let resolved = identity == .automatic\n            ? (websiteMode == .desktop ? BrowserIdentity.macosSafari : .iphoneSafari)\n            : resolvedIdentity(identity, customUserAgent: customUserAgent)\n\n        switch resolved {\n'''
          )

          replace(
              "FloatTabs/Web/WebViewFactory.swift",
              '''    /// Automatic follows the real browser engine/platform, not the requested\n    /// Website Mode. FloatTabs is a macOS WKWebView application, so Automatic\n    /// must stay on the native macOS Safari identity even when the page is laid\n    /// out at a phone-class CSS width. Explicit mobile identities remain\n    /// available when the user intentionally wants an iPhone/Android UA.\n    private static func resolvedIdentity(\n        _ identity: BrowserIdentity,\n        customUserAgent: String?\n    ) -> BrowserIdentity {\n        if identity == .automatic {\n            return .macosSafari\n        }\n\n        if identity == .custom,\n''',
              '''    /// Normalizes explicit compatibility identities. Automatic is resolved by\n    /// Website Mode at the caller so WebKit can own its native current UA.\n    private static func resolvedIdentity(\n        _ identity: BrowserIdentity,\n        customUserAgent: String?\n    ) -> BrowserIdentity {\n        if identity == .custom,\n'''
          )

          replace(
              "FloatTabs/Web/WebViewFactory.swift",
              '''        scheduleHide(for: scrollViews)\n    }\n\n    private func scheduleHide(for scrollViews: [NSScrollView]) {\n        hideWorkItem?.cancel()\n\n        let item = DispatchWorkItem { [weak self, weak webView] in\n            guard self != nil, webView != nil else { return }\n            for scrollView in scrollViews {\n                WebViewFactory.configureHiddenScrollerStyle(scrollView)\n            }\n        }\n''',
              '''        scheduleHide()\n    }\n\n    private func scheduleHide() {\n        hideWorkItem?.cancel()\n\n        let item = DispatchWorkItem { [weak self] in\n            guard let webView = self?.webView else { return }\n            WebViewFactory.configureHiddenScrollers(in: webView)\n\n            // WebKit can replace its internal scroll view during the same layout\n            // turn. Re-scan once more on the next main-queue turn so the current\n            // scroller, not a stale captured instance, is forced back to rest.\n            DispatchQueue.main.async { [weak webView] in\n                guard let webView else { return }\n                WebViewFactory.configureHiddenScrollers(in: webView)\n            }\n        }\n'''
          )

          pool = Path("FloatTabs/Web/WebViewPool.swift")
          pool_text = pool.read_text()
          marker = "@MainActor\nfinal class WebViewPool {\n"
          if pool_text.count(marker) != 1:
              raise SystemExit("FloatTabs/Web/WebViewPool.swift: class marker mismatch")
          policy = '''enum SiteCompatibilityPolicy {\n    static func runtimeRendering(\n        for renderingProfile: WebRenderingProfile,\n        navigationURL: URL\n    ) -> WebRenderingProfile {\n        let rendering = renderingProfile.normalized()\n        guard rendering.browserIdentity == .automatic,\n              rendering.websiteMode == .mobile,\n              requiresDesktopPointerIdentity(for: navigationURL) else {\n            return rendering\n        }\n\n        return rendering.settingBrowserIdentity(.macosSafari)\n    }\n\n    private static func requiresDesktopPointerIdentity(for url: URL) -> Bool {\n        guard let host = url.host?.lowercased() else { return false }\n        return host == "chatgpt.com"\n            || host.hasSuffix(".chatgpt.com")\n            || host == "chat.openai.com"\n    }\n}\n\n'''
          pool.write_text(pool_text.replace(marker, policy + marker, 1))

          replace(
              "FloatTabs/Web/WebViewPool.swift",
              '''        return createWebView(\n            for: profile,\n            navigationURL: navigationURL,\n            cachePolicy: .reloadIgnoringLocalCacheData\n        )\n''',
              '''        return createWebView(\n            for: profile,\n            navigationURL: navigationURL,\n            cachePolicy: .useProtocolCachePolicy\n        )\n'''
          )

          replace(
              "FloatTabs/Web/WebViewPool.swift",
              '''        let rendering = profile.renderingProfile.normalized()\n        let webView = WebViewFactory.makeWebView(renderingProfile: rendering)\n        let observer = SlotNavigationObserver(\n''',
              '''        let rendering = profile.renderingProfile.normalized()\n        let runtimeRendering = SiteCompatibilityPolicy.runtimeRendering(\n            for: rendering,\n            navigationURL: navigationURL\n        )\n        let webView = WebViewFactory.makeWebView(renderingProfile: runtimeRendering)\n        let observer = SlotNavigationObserver(\n'''
          )

          replace(
              "FloatTabsTests/TabStoreTests.swift",
              '''        XCTAssertEqual(mobile.browserIdentity, .automatic)\n        XCTAssertEqual(mobile.effectiveBrowserIdentity, .macosSafari)\n        XCTAssertEqual(mobile.viewportSize, base.viewportSize)\n\n        let wide = mobile.settingSimplePreset(.wide)\n        XCTAssertEqual(wide.websiteMode, .mobile)\n        XCTAssertEqual(wide.browserIdentity, .automatic)\n        XCTAssertEqual(wide.effectiveBrowserIdentity, .macosSafari)\n''',
              '''        XCTAssertEqual(mobile.browserIdentity, .automatic)\n        XCTAssertEqual(mobile.effectiveBrowserIdentity, .iphoneSafari)\n        XCTAssertEqual(mobile.viewportSize, base.viewportSize)\n\n        let wide = mobile.settingSimplePreset(.wide)\n        XCTAssertEqual(wide.websiteMode, .mobile)\n        XCTAssertEqual(wide.browserIdentity, .automatic)\n        XCTAssertEqual(wide.effectiveBrowserIdentity, .iphoneSafari)\n'''
          )

          replace(
              "FloatTabsTests/WebViewFactoryTests.swift",
              '''    func testRenderingProfileAppliesMobileContentModeWithoutForcingMobileIdentity() {\n''',
              '''    func testAutomaticMobileLetsWebKitOwnMobileIdentity() {\n'''
          )

          replace(
              "FloatTabsTests/WebViewFactoryTests.swift",
              '''        XCTAssertTrue(webView.customUserAgent?.contains("Macintosh") == true)\n        XCTAssertFalse(webView.customUserAgent?.contains("iPhone") == true)\n''',
              '''        XCTAssertNil(webView.customUserAgent)\n''',
              count=1
          )

          replace(
              "FloatTabsTests/WebViewFactoryTests.swift",
              '''        let hasMacRuntimeIdentity = evaluateNumber(\n            "navigator.userAgent.includes('Macintosh') && !navigator.userAgent.includes('iPhone') ? 1 : 0",\n            in: webView\n        )\n        XCTAssertEqual(hasMacRuntimeIdentity, 1, accuracy: 0.001)\n''',
              '''        let hasMobileRuntimeIdentity = evaluateNumber(\n            "navigator.userAgent.includes('iPhone') ? 1 : 0",\n            in: webView\n        )\n        XCTAssertEqual(hasMobileRuntimeIdentity, 1, accuracy: 0.001)\n'''
          )

          replace(
              "FloatTabsTests/WebViewFactoryTests.swift",
              '''    func testAutomaticIdentityRemainsNativeMacAcrossWebsiteModes() {\n        let desktopUA = UserAgentProvider.userAgent(\n            for: .automatic,\n            websiteMode: .desktop,\n            versions: versions\n        )\n        let mobileUA = UserAgentProvider.userAgent(\n            for: .automatic,\n            websiteMode: .mobile,\n            versions: versions\n        )\n        XCTAssertEqual(mobileUA, desktopUA)\n        XCTAssertTrue(desktopUA.contains("Macintosh"))\n        XCTAssertTrue(desktopUA.contains("Version/26.6"))\n        XCTAssertTrue(mobileUA.contains("Macintosh"))\n        XCTAssertFalse(mobileUA.contains("iPhone"))\n    }\n''',
              '''    func testAutomaticIdentityFollowsWebsiteModeWhenMaterialized() {\n        let desktopUA = UserAgentProvider.userAgent(\n            for: .automatic,\n            websiteMode: .desktop,\n            versions: versions\n        )\n        let mobileUA = UserAgentProvider.userAgent(\n            for: .automatic,\n            websiteMode: .mobile,\n            versions: versions\n        )\n        XCTAssertNotEqual(mobileUA, desktopUA)\n        XCTAssertTrue(desktopUA.contains("Macintosh"))\n        XCTAssertTrue(desktopUA.contains("Version/26.6"))\n        XCTAssertTrue(mobileUA.contains("iPhone"))\n        XCTAssertFalse(mobileUA.contains("Macintosh"))\n    }\n\n    func testExplicitMacOSSafariCanOverrideMobileAutomaticIdentity() {\n        let rendering = WebRenderingProfile.canonicalDefault\n            .settingWebsiteMode(.mobile)\n            .settingBrowserIdentity(.macosSafari)\n        let ua = UserAgentProvider.customUserAgent(\n            for: rendering,\n            versions: versions\n        )\n\n        XCTAssertTrue(ua?.contains("Macintosh") == true)\n        XCTAssertFalse(ua?.contains("iPhone") == true)\n    }\n'''
          )

          replace(
              "FloatTabsTests/WebViewPoolTests.swift",
              '''        XCTAssertEqual(loadedRequests.last?.cachePolicy, .reloadIgnoringLocalCacheData)\n''',
              '''        XCTAssertEqual(loadedRequests.last?.cachePolicy, .useProtocolCachePolicy)\n'''
          )

          replace(
              "FloatTabsTests/WebViewPoolTests.swift",
              '''        XCTAssertTrue(mobile.customUserAgent?.contains("Macintosh") == true)\n        XCTAssertFalse(mobile.customUserAgent?.contains("iPhone") == true)\n''',
              '''        XCTAssertNil(mobile.customUserAgent)\n'''
          )

          replace(
              "FloatTabsTests/WebViewPoolTests.swift",
              '''        XCTAssertEqual(loadedRequests[1].cachePolicy, .reloadIgnoringLocalCacheData)\n        XCTAssertEqual(loadedRequests[2].cachePolicy, .reloadIgnoringLocalCacheData)\n''',
              '''        XCTAssertEqual(loadedRequests[1].cachePolicy, .useProtocolCachePolicy)\n        XCTAssertEqual(loadedRequests[2].cachePolicy, .useProtocolCachePolicy)\n'''
          )

          replace(
              "FloatTabsTests/WebViewPoolTests.swift",
              '''    func testDevicePresetChangeDoesNotRebuildOrAlterBrowserIdentity() {\n''',
              '''    func testChatGPTMobileAutomaticUsesDesktopPointerCompatibilityIdentity() {\n        let pool = makePool()\n        var profile = makeProfile(\n            name: "ChatGPT",\n            homeURL: URL(string: "https://chatgpt.com/")!\n        )\n        profile.renderingProfile = profile.renderingProfile.settingWebsiteMode(.mobile)\n\n        let webView = pool.webView(for: profile)\n\n        XCTAssertEqual(\n            webView.configuration.defaultWebpagePreferences.preferredContentMode,\n            .mobile\n        )\n        XCTAssertTrue(webView.customUserAgent?.contains("Macintosh") == true)\n        XCTAssertFalse(webView.customUserAgent?.contains("iPhone") == true)\n    }\n\n    func testDevicePresetChangeDoesNotRebuildOrAlterBrowserIdentity() {\n'''
          )

          replace(
              "FloatTabsTests/WebViewPoolTests.swift",
              '''    private func makeProfile(name: String) -> WebAppProfile {\n        WebAppProfile(\n            order: 0,\n            name: name,\n            homeURL: URL(string: "https://example.com/\\(name)")!\n        )\n    }\n''',
              '''    private func makeProfile(name: String, homeURL: URL? = nil) -> WebAppProfile {\n        WebAppProfile(\n            order: 0,\n            name: name,\n            homeURL: homeURL ?? URL(string: "https://example.com/\\(name)")!\n        )\n    }\n'''
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FloatTabs/Tabs/WebRenderingProfile.swift FloatTabs/Web/WebViewFactory.swift FloatTabs/Web/WebViewPool.swift FloatTabsTests/TabStoreTests.swift FloatTabsTests/WebViewFactoryTests.swift FloatTabsTests/WebViewPoolTests.swift
          if git diff --cached --quiet; then
            echo "Guarded repair produced no changes" >&2
            exit 1
          fi
          git commit -m "fix: restore mobile compatibility and warm cached rebuilds"
          git push origin HEAD:feat/stage-4-web-compatibility-sessions

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'

          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult
