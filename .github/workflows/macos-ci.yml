name: macOS CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      stage:
        description: "Default is plan-only. Choose focused/milestone/ready/release explicitly."
        type: choice
        required: true
        default: none
        options: [focused, milestone, ready, release, none]
      focused_test:
        description: "Accepted catalog test ID (focused stage only)"
        type: string
        required: false
      comparison_base:
        description: "Accepted-branch ancestor SHA (manual ready/milestone only)"
        type: string
        required: false

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governed:
    # Drafts never consume Mac runner time; Ready PRs use the trusted main catalog.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: Lost0rz/Engineering-Governance/.github/workflows/ci-router-reusable.yml@v0.10.0
    with:
      capabilities_path: .github/ci-capabilities.json
      stage: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'auto' }}
      focused_test: ${{ inputs.focused_test || '' }}
      comparison_base: ${{ inputs.comparison_base || '' }}

  required-check:
    # Preserve the existing branch-check identity. Manual plan-only runs cannot
    # claim this PR readiness status; the reusable workflow reports them separately.
    name: Build & Test (Apple Silicon arm64)
    needs: governed
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Report governed PR verification
        shell: bash
        env:
          GOVERNED_RESULT: ${{ needs.governed.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$IS_DRAFT" == "true" ]]; then
            [[ "$GOVERNED_RESULT" == "skipped" ]] || exit 1
            echo "DRAFT_DEFERRED / PRODUCT_TESTS_NOT_RUN"
            exit 0
          fi
          if [[ "$GOVERNED_RESULT" != "success" ]]; then
            echo "EG_ROUTED_PR_VERIFICATION_FAILED: $GOVERNED_RESULT" >&2
            exit 1
          fi
          echo "EG_ROUTED_READY_VERIFICATION_PASS"
