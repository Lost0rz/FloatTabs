name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-4-web-compatibility-sessions

      - name: Apply guarded mobile automatic UA repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 guarded match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'FloatTabs/Web/WebViewFactory.swift',
              '''        if profile.browserIdentity == .automatic {\n            return nil\n        }\n\n        let identity = resolvedIdentity(\n''',
              '''        if profile.browserIdentity == .automatic {\n            guard profile.effectiveWebsiteMode == .mobile else { return nil }\n            return userAgent(\n                for: .iphoneSafari,\n                websiteMode: .mobile,\n                versions: versions\n            )\n        }\n\n        let identity = resolvedIdentity(\n'''
          )

          replace(
              'FloatTabs/Web/WebViewFactory.swift',
              '''        if rendering.browserIdentity != .automatic {\n            webView.customUserAgent = UserAgentProvider.customUserAgent(\n                for: rendering,\n                versions: versions\n            )\n        }\n''',
              '''        if let customUserAgent = UserAgentProvider.customUserAgent(\n            for: rendering,\n            versions: versions\n        ) {\n            webView.customUserAgent = customUserAgent\n        }\n'''
          )

          replace(
              'FloatTabsTests/WebViewFactoryTests.swift',
              '''    func testAutomaticMobileLetsWebKitOwnMobileIdentity() {\n''',
              '''    func testAutomaticMobileUsesCurrentIPhoneSafariIdentity() {\n'''
          )

          replace(
              'FloatTabsTests/WebViewFactoryTests.swift',
              '''        XCTAssertNil(webView.customUserAgent)\n''',
              '''        XCTAssertTrue(webView.customUserAgent?.contains("iPhone") == true)\n        XCTAssertTrue(webView.customUserAgent?.contains("Version/26.") == true)\n'''
          )

          replace(
              'FloatTabsTests/WebViewPoolTests.swift',
              '''        XCTAssertNil(mobile.customUserAgent)\n''',
              '''        XCTAssertTrue(mobile.customUserAgent?.contains("iPhone") == true)\n        XCTAssertFalse(mobile.customUserAgent?.contains("Macintosh") == true)\n'''
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FloatTabs/Web/WebViewFactory.swift FloatTabsTests/WebViewFactoryTests.swift FloatTabsTests/WebViewPoolTests.swift
          git commit -m "fix: use mobile Safari identity for automatic mobile sites"
          git push origin HEAD:feat/stage-4-web-compatibility-sessions

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'
          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult
