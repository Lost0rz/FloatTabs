name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
      - 'tools/release/**'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
      - 'tools/release/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon arm64
            runner: macos-26
            arch: arm64
          - label: Intel x86_64
            runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DERIVED_DATA: ${{ runner.temp }}/FloatTabsDerivedData
    steps:
      - uses: actions/checkout@v5

      - name: Runner architecture
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=${{ matrix.arch }}'
          -derivedDataPath "$DERIVED_DATA"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Release build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Release
          -destination 'platform=macOS,arch=${{ matrix.arch }}'
          -derivedDataPath "$DERIVED_DATA"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify native Release architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="$DERIVED_DATA/Build/Products/Release/FloatTabs.app/Contents/MacOS/FloatTabs"
          if [[ ! -f "$binary" ]]; then
            echo "Release binary not found: $binary" >&2
            exit 1
          fi
          architectures="$(lipo -archs "$binary")"
          echo "Release binary architectures: $architectures"
          if [[ " $architectures " != *" ${{ matrix.arch }} "* ]]; then
            echo "Expected architecture ${{ matrix.arch }} is missing." >&2
            exit 1
          fi

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'

          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult

  universal-release:
    name: Universal 2 Release Build
    needs: build-and-test
    runs-on: macos-26
    env:
      DERIVED_DATA: ${{ runner.temp }}/FloatTabsUniversalDerivedData
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Universal 2 Release build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$DERIVED_DATA"
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify Universal 2 binary
        shell: bash
        run: |
          set -euo pipefail
          binary="$DERIVED_DATA/Build/Products/Release/FloatTabs.app/Contents/MacOS/FloatTabs"
          architectures="$(lipo -archs "$binary")"
          echo "Universal Release architectures: $architectures"
          for required in arm64 x86_64; do
            if [[ " $architectures " != *" $required "* ]]; then
              echo "Universal Release binary is missing $required." >&2
              exit 1
            fi
          done
