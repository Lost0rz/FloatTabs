name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Apply guarded mobile identity repair
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout -B ci-repair "origin/$HEAD_REF"

          python3 <<'PY'
          from pathlib import Path

          source = Path('FloatTabs/Web/WebViewFactory.swift')
          text = source.read_text()
          old_comment = '''    /// Runtime override. `nil` is deliberate for macOS Safari so WebKit can
              /// supply its native UA plus `applicationNameForUserAgent`.
          '''
          new_comment = '''    /// Runtime override. Desktop macOS Safari can stay `nil` so WebKit supplies
              /// its native UA plus `applicationNameForUserAgent`. Mobile content mode is
              /// different: WebKit synthesizes an iPhone UA when no override is present,
              /// so keep Website Mode and browser identity independent by explicitly
              /// restoring the macOS Safari identity there.
          '''
          old_policy = '''        if identity == .macosSafari {
                      return nil
                  }
          '''
          new_policy = '''        if identity == .macosSafari,
                     profile.effectiveWebsiteMode == .desktop {
                      return nil
                  }
          '''
          if old_comment not in text or old_policy not in text:
              if 'profile.effectiveWebsiteMode == .desktop' not in text:
                  raise SystemExit('Expected WebViewFactory UA policy was not found')
          else:
              text = text.replace(old_comment, new_comment, 1).replace(old_policy, new_policy, 1)
              source.write_text(text)

          tests = Path('FloatTabsTests/WebViewFactoryTests.swift')
          text = tests.read_text()
          old_assertion = '''        XCTAssertEqual(webView.configuration.defaultWebpagePreferences.preferredContentMode, .mobile)
                  XCTAssertNil(webView.customUserAgent)
                  XCTAssertTrue(
          '''
          new_assertion = '''        XCTAssertEqual(webView.configuration.defaultWebpagePreferences.preferredContentMode, .mobile)
                  XCTAssertTrue(webView.customUserAgent?.contains("Macintosh") == true)
                  XCTAssertFalse(webView.customUserAgent?.contains("iPhone") == true)
                  XCTAssertTrue(
          '''
          old_runtime = '''        XCTAssertTrue(
                      webView.configuration.applicationNameForUserAgent?.contains("Safari/") == true
                  )
                  XCTAssertEqual(floatTabsWebView.userPageZoom, 1.25, accuracy: 0.001)
          '''
          new_runtime = '''        XCTAssertTrue(
                      webView.configuration.applicationNameForUserAgent?.contains("Safari/") == true
                  )

                  loadTestHTML(in: webView)
                  let hasMacRuntimeIdentity = evaluateNumber(
                      "navigator.userAgent.includes('Macintosh') && !navigator.userAgent.includes('iPhone') ? 1 : 0",
                      in: webView
                  )
                  XCTAssertEqual(hasMacRuntimeIdentity, 1, accuracy: 0.001)
                  XCTAssertEqual(floatTabsWebView.userPageZoom, 1.25, accuracy: 0.001)
          '''
          if old_assertion not in text or old_runtime not in text:
              if 'hasMacRuntimeIdentity' not in text:
                  raise SystemExit('Expected WebViewFactoryTests mobile identity assertion was not found')
          else:
              text = text.replace(old_assertion, new_assertion, 1).replace(old_runtime, new_runtime, 1)
              tests.write_text(text)
          PY

          if git diff --quiet -- FloatTabs/Web/WebViewFactory.swift FloatTabsTests/WebViewFactoryTests.swift; then
            echo 'Guarded UA repair already present; no commit needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/Web/WebViewFactory.swift FloatTabsTests/WebViewFactoryTests.swift
          git commit -m 'fix: keep mobile website mode on mac identity'
          git push origin "HEAD:$HEAD_REF"

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'

          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult
