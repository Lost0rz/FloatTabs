name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
      - 'tools/release/**'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
      - 'tools/release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-native-fullscreen-host-repair:
    name: Apply native fullscreen host repair
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/fix-web-fullscreen-state' && github.actor != 'github-actions[bot]' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-web-fullscreen-state
          fetch-depth: 0

      - name: Apply guarded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label, count=None):
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"missing replacement anchor: {label}")
              if count is not None and found != count:
                  raise SystemExit(f"unexpected anchor count for {label}: {found} != {count}")
              return text.replace(old, new)

          path = Path('FloatTabs/App/AppDelegate.swift')
          text = path.read_text()
          pattern = re.compile(r'import AppKit\nimport WebKit\n\n/// Keeps element fullscreen.*?\n@MainActor\nfinal class AppDelegate', re.S)
          text, n = pattern.subn('import AppKit\n\n@MainActor\nfinal class AppDelegate', text, count=1)
          if n != 1:
              raise SystemExit(f'failed to remove NativeFullscreenSessionResetCoordinator: {n}')
          text = must_replace(text, '        NativeFullscreenSessionResetCoordinator.shared.start()\n', '', 'coordinator start', 1)
          text = must_replace(text, '        NativeFullscreenSessionResetCoordinator.shared.stop()\n', '', 'coordinator stop', 1)
          path.write_text(text)

          path = Path('FloatTabs/Web/WebViewFactory.swift')
          text = path.read_text()
          text = must_replace(text, '        NativeFullscreenSessionResetCoordinator.shared.install(in: configuration)\n', '', 'bridge install', 1)
          path.write_text(text)

          path = Path('FloatTabs/Panel/FloatingPanel.swift')
          text = path.read_text()
          old = '''                NativeFullscreenSessionResetCoordinator.shared.handleObservedFullscreenTransition(\n                    for: webView,\n                    previousState: previousState,\n                    currentState: state,\n                    window: currentWindow\n                )\n\n'''
          text = must_replace(text, old, '', 'observed state cleanup', 1)
          path.write_text(text)

          path = Path('FloatTabs/Web/WebViewContainer.swift')
          text = path.read_text()
          text = must_replace(text, '    private let logicalHostView = NSView()\n', '    private let logicalHostView = WebSlotHostView(frame: .zero)\n', 'stable transient host', 1)
          if text.count('            webView.autoresizingMask = []\n') < 1:
              raise SystemExit('missing WebView autoresizing anchor')
          text = text.replace('            webView.autoresizingMask = []\n', '            webView.autoresizingMask = [.width, .height]\n')
          old = '''            hostedWebView?.removeFromSuperview()\n            webView.removeFromSuperview()\n            webView.translatesAutoresizingMaskIntoConstraints = true\n            webView.autoresizingMask = [.width, .height]\n            logicalHostView.addSubview(webView)\n            hostedWebView = webView\n'''
          new = '''            hostedWebView?.removeFromSuperview()\n            logicalHostView.attach(webView)\n            hostedWebView = webView\n'''
          text = must_replace(text, old, new, 'transient host attachment', 1)
          path.write_text(text)

          path = Path('FloatTabsTests/WebViewFactoryTests.swift')
          text = path.read_text()
          pattern = re.compile(r'\n    func testWebViewsUseNativeElementFullscreenWithExitOnlyResetBridge\(\) throws \{.*?\n    \}\n\n    func testFullscreenSessionResetPoliciesRequireAnActiveNativePresentation\(\) \{.*?\n    \}\n', re.S)
          replacement = r'''
    func testWebViewsLeaveNativeElementFullscreenEntryAndExitUntouched() {
        let webView = WebViewFactory.makeWebView()
        let scripts = webView.configuration.userContentController.userScripts

        XCTAssertTrue(webView.configuration.preferences.isElementFullscreenEnabled)
        XCTAssertFalse(scripts.contains(where: { script in
            script.source.contains("__floatTabsNativeFullscreenExitBridgeInstalled")
                || script.source.contains("requestFullscreen")
                || script.source.contains("exitFullscreen")
                || script.source.contains("closeAllMediaPresentations")
        }))
    }

    func testTransientWebViewUsesStableFrameBasedFullscreenHost() throws {
        let webView = WebViewFactory.makeWebView()
        let container = WebPanelContainerView(frame: NSRect(x: 0, y: 0, width: 600, height: 820))

        container.show(webView: webView)
        container.layoutSubtreeIfNeeded()
        let host = try XCTUnwrap(webView.superview as? WebSlotHostView)

        XCTAssertTrue(webView.translatesAutoresizingMaskIntoConstraints)
        XCTAssertTrue(webView.autoresizingMask.contains(.width))
        XCTAssertTrue(webView.autoresizingMask.contains(.height))
        XCTAssertTrue(webView.superview === host)
        XCTAssertFalse(host.constraints.contains(where: { constraint in
            constraint.firstItem as AnyObject? === webView
                || constraint.secondItem as AnyObject? === webView
        }))
    }
'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'failed to replace rejected fullscreen tests: {n}')
          path.write_text(text)

          combined = Path('FloatTabs/App/AppDelegate.swift').read_text() + Path('FloatTabs/Web/WebViewFactory.swift').read_text() + Path('FloatTabs/Panel/FloatingPanel.swift').read_text()
          for token in ['NativeFullscreenSessionResetCoordinator', 'closeAllMediaPresentations', 'floatTabsNativeFullscreenExit', 'fullscreen_public_close_requested', 'fullscreen_public_close_completed']:
              if token in combined:
                  raise SystemExit(f'forbidden rejected-fullscreen token remains: {token}')
          PY
          git diff --check

      - name: Commit repair and restore CI definition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/macos-ci.yml
          git rm -f .github/workflows/tmp-native-fullscreen-host-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/App/AppDelegate.swift FloatTabs/Panel/FloatingPanel.swift FloatTabs/Web/WebViewFactory.swift FloatTabs/Web/WebViewContainer.swift FloatTabsTests/WebViewFactoryTests.swift .github/workflows/macos-ci.yml
          git commit -m 'fix: use fullscreen-safe WebKit host hierarchy'
          git push origin HEAD:agent/fix-web-fullscreen-state

  build-and-test:
    name: Build & Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon arm64
            runner: macos-26
            arch: arm64
          - label: Intel x86_64
            runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Runner architecture
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true
      - name: Xcode version
        run: xcodebuild -version
      - name: Resolve Swift packages
        run: >-
          xcodebuild -project FloatTabs.xcodeproj -scheme FloatTabs -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile
      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Debug build
        run: >-
          xcodebuild -project FloatTabs.xcodeproj -scheme FloatTabs -configuration Debug -destination 'platform=macOS,arch=${{ matrix.arch }}' -derivedDataPath "$RUNNER_TEMP/FloatTabsDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Release build
        run: >-
          xcodebuild -project FloatTabs.xcodeproj -scheme FloatTabs -configuration Release -destination 'platform=macOS,arch=${{ matrix.arch }}' -derivedDataPath "$RUNNER_TEMP/FloatTabsDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Verify native Release architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/FloatTabsDerivedData/Build/Products/Release/FloatTabs.app/Contents/MacOS/FloatTabs"
          architectures="$(lipo -archs "$binary")"
          echo "Release binary architectures: $architectures"
          if [[ " $architectures " != *" ${{ matrix.arch }} "* ]]; then exit 1; fi
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project FloatTabs.xcodeproj -scheme FloatTabs -configuration Debug -destination 'platform=macOS,arch=${{ matrix.arch }}' -derivedDataPath "$RUNNER_TEMP/FloatTabsDerivedData" -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" CODE_SIGNING_ALLOWED=NO MACOSX_DEPLOYMENT_TARGET=14.0 test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"
      - name: Report XCTest failures
        if: failure()
        run: |
          grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult

  universal-release:
    name: Universal 2 Release Build
    needs: build-and-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Resolve Swift packages
        run: >-
          xcodebuild -project FloatTabs.xcodeproj -scheme FloatTabs -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile
      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Universal 2 Release build
        run: >-
          xcodebuild -project FloatTabs.xcodeproj -scheme FloatTabs -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/FloatTabsUniversalDerivedData" ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify Universal 2 binary
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/FloatTabsUniversalDerivedData/Build/Products/Release/FloatTabs.app/Contents/MacOS/FloatTabs"
          architectures="$(lipo -archs "$binary")"
          echo "Universal Release architectures: $architectures"
          for required in arm64 x86_64; do
            if [[ " $architectures " != *" $required "* ]]; then exit 1; fi
          done
