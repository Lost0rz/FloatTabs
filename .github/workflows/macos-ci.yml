name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope-gate:
    name: CI Scope Gate
    runs-on: ubuntu-latest
    outputs:
      run_product_tests: ${{ steps.classify.outputs.run_product_tests }}
      run_workflow_validation: ${{ steps.classify.outputs.run_workflow_validation }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/classify_macos_ci_scope.py

  workflow-validation:
    name: Workflow Configuration Validation
    needs: scope-gate
    if: needs.scope-gate.outputs.run_workflow_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Test CI scope classifier
        run: python3 -m unittest discover -s tools/ci/tests -v

  product-tests:
    name: Product Build & Test (Apple Silicon arm64)
    needs: scope-gate
    if: >-
      needs.scope-gate.outputs.run_product_tests == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, mac-mini-ci]
    steps:
      - uses: actions/checkout@v5

      - name: Runner environment
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          architecture="$(uname -m)"
          echo "uname -m=${architecture}"
          if [[ "$architecture" != "arm64" ]]; then
            echo "Expected an Apple Silicon arm64 runner, got $architecture." >&2
            exit 1
          fi
          sysctl -n machdep.cpu.brand_string || true

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/FloatTabsDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Release build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/FloatTabsDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify native Release architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/FloatTabsDerivedData/Build/Products/Release/FloatTabs.app/Contents/MacOS/FloatTabs"
          if [[ ! -f "$binary" ]]; then
            echo "Release binary not found: $binary" >&2
            exit 1
          fi
          architectures="$(lipo -archs "$binary")"
          echo "Release binary architectures: $architectures"
          if [[ "$architectures" != "arm64" ]]; then
            echo "Release binary must be arm64-only; found: $architectures." >&2
            exit 1
          fi

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/FloatTabsDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Report XCTest failures
        if: failure()
        shell: bash
        run: |
          echo '::group::Filtered xcodebuild failures'
          if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
            grep -E 'Test Case .* failed|error:|Assertion|XCTAssert|failed \(' "$RUNNER_TEMP/xcodebuild-test.log" || true
          fi
          echo '::endgroup::'

          if [ -d "$RUNNER_TEMP/FloatTabsTests.xcresult" ]; then
            echo '::group::XCResult test summary'
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/FloatTabsTests.xcresult" || true
            echo '::endgroup::'
          fi

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-XCTest-diagnostics-arm64
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/FloatTabsTests.xcresult

  required-check:
    name: Build & Test (Apple Silicon arm64)
    needs: [scope-gate, workflow-validation, product-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report required-check outcome
        env:
          SCOPE_RESULT: ${{ needs.scope-gate.result }}
          SCOPE: ${{ needs.scope-gate.outputs.scope }}
          RUN_PRODUCT_TESTS: ${{ needs.scope-gate.outputs.run_product_tests }}
          RUN_WORKFLOW_VALIDATION: ${{ needs.scope-gate.outputs.run_workflow_validation }}
          WORKFLOW_VALIDATION_RESULT: ${{ needs.workflow-validation.result }}
          PRODUCT_TESTS_RESULT: ${{ needs.product-tests.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "SCOPE_GATE_FAIL (scope=${SCOPE:-unavailable})"
            exit 1
          fi

          if [[ "$RUN_WORKFLOW_VALIDATION" == "true" && "$WORKFLOW_VALIDATION_RESULT" != "success" ]]; then
            echo "WORKFLOW_CONFIG_FAIL (result=$WORKFLOW_VALIDATION_RESULT)"
            exit 1
          fi

          if [[ "$RUN_PRODUCT_TESTS" == "true" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
              echo "PRODUCT_TESTS_FAIL (fork PR blocked from self-hosted runner)"
              exit 1
            fi
            if [[ "$PRODUCT_TESTS_RESULT" != "success" ]]; then
              echo "PRODUCT_TESTS_FAIL (result=$PRODUCT_TESTS_RESULT)"
              exit 1
            fi
            echo "PRODUCT_TESTS_PASS (scope=$SCOPE)"
            exit 0
          fi

          if [[ "$PRODUCT_TESTS_RESULT" != "skipped" ]]; then
            echo "SCOPE_GATE_FAIL (unexpected product job result=$PRODUCT_TESTS_RESULT)"
            exit 1
          fi
          if [[ "$RUN_WORKFLOW_VALIDATION" == "true" ]]; then
            echo "WORKFLOW_CONFIG_PASS"
          fi
          echo "SCOPE_GATE_PASS / PRODUCT_TESTS_SKIPPED (scope=$SCOPE)"
