name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/macos-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Write dynamic Mobile popover probe
        shell: bash
        run: |
          cat > /tmp/FloatTabsMobilePopoverProbe.swift <<'SWIFT'
          import AppKit
          import Foundation
          import WebKit

          final class Waiter: NSObject, WKNavigationDelegate {
              var finished = false
              var failed = false

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  finished = true
              }

              func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                  failed = true
              }

              func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) {
                  failed = true
              }
          }

          enum Strategy: String {
              case pageZoom
              case logicalHost
          }

          func spin(until condition: () -> Bool, timeout: TimeInterval = 5) -> Bool {
              let deadline = Date(timeIntervalSinceNow: timeout)
              while Date() < deadline {
                  if condition() { return true }
                  RunLoop.main.run(until: Date(timeIntervalSinceNow: 0.01))
              }
              return condition()
          }

          func evaluate(_ script: String, in webView: WKWebView) -> Any? {
              var done = false
              var value: Any?
              var error: Error?
              webView.evaluateJavaScript(script) { result, evaluationError in
                  value = result
                  error = evaluationError
                  done = true
              }
              _ = spin(until: { done })
              if let error {
                  fputs("JavaScript error: \(error)\n", stderr)
              }
              return value
          }

          guard CommandLine.arguments.count == 2,
                let strategy = Strategy(rawValue: CommandLine.arguments[1]) else {
              fatalError("usage: probe pageZoom|logicalHost")
          }

          _ = NSApplication.shared

          let physicalSize = NSSize(width: 900, height: 850)
          let logicalWidth: CGFloat = 390
          let visibleScale = physicalSize.width / logicalWidth
          let logicalSize = NSSize(
              width: logicalWidth,
              height: physicalSize.height / visibleScale
          )

          let configuration = WKWebViewConfiguration()
          configuration.websiteDataStore = .nonPersistent()
          let webView = WKWebView(frame: .zero, configuration: configuration)
          let window = NSWindow(
              contentRect: NSRect(origin: .zero, size: physicalSize),
              styleMask: [.borderless],
              backing: .buffered,
              defer: false
          )
          window.isReleasedWhenClosed = false

          var logicalHost: NSView?
          switch strategy {
          case .pageZoom:
              webView.frame = NSRect(origin: .zero, size: physicalSize)
              webView.pageZoom = visibleScale
              window.contentView = webView

          case .logicalHost:
              let host = NSView(frame: NSRect(origin: .zero, size: physicalSize))
              host.bounds = NSRect(origin: .zero, size: logicalSize)
              webView.frame = NSRect(origin: .zero, size: logicalSize)
              webView.autoresizingMask = []
              host.addSubview(webView)
              window.contentView = host
              logicalHost = host
          }

          window.makeKeyAndOrderFront(nil)
          window.contentView?.layoutSubtreeIfNeeded()
          webView.layoutSubtreeIfNeeded()

          let waiter = Waiter()
          webView.navigationDelegate = waiter
          webView.loadHTMLString(
              """
              <!doctype html>
              <html>
                <head>
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <style>
                    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:system-ui; }
                    #trigger {
                      position:fixed;
                      left:20px;
                      bottom:20px;
                      width:64px;
                      height:64px;
                      border:0;
                      border-radius:32px;
                    }
                    #menu {
                      position:fixed;
                      width:220px;
                      height:156px;
                      border:1px solid #999;
                      background:white;
                      z-index:1000;
                    }
                    .item {
                      display:block;
                      box-sizing:border-box;
                      width:100%;
                      height:52px;
                      border:0;
                    }
                  </style>
                </head>
                <body>
                  <button id="trigger">+</button>
                  <script>
                    window.trace = [];
                    window.selected = 0;
                    window.closedByOutside = 0;
                    window.openCount = 0;
                    window.triggerRectAtOpen = null;
                    window.menuRectAtOpen = null;

                    function label(node) {
                      return node?.id || node?.className || node?.tagName || 'unknown';
                    }

                    function record(phase, event) {
                      window.trace.push({
                        phase,
                        type:event.type,
                        target:label(event.target),
                        x:event.clientX,
                        y:event.clientY,
                        buttons:event.buttons,
                        pointerType:event.pointerType || null
                      });
                    }

                    function closeMenu(reason) {
                      const menu = document.getElementById('menu');
                      if (!menu) return;
                      window.trace.push({phase:'close', reason});
                      menu.remove();
                    }

                    function openMenu(event) {
                      if (document.getElementById('menu')) return;
                      const trigger = document.getElementById('trigger');
                      const rect = trigger.getBoundingClientRect();
                      window.triggerRectAtOpen = {
                        left:rect.left, top:rect.top, right:rect.right, bottom:rect.bottom,
                        width:rect.width, height:rect.height
                      };

                      const menu = document.createElement('div');
                      menu.id = 'menu';
                      menu.style.left = `${Math.max(8, rect.left)}px`;
                      menu.style.top = `${Math.max(8, rect.top - 168)}px`;
                      for (let i = 0; i < 3; i++) {
                        const item = document.createElement('button');
                        item.className = 'item';
                        item.id = `item-${i + 1}`;
                        item.textContent = `item ${i + 1}`;
                        item.addEventListener('pointerup', e => {
                          record('item-pointerup', e);
                          window.selected += 1;
                          closeMenu('selected');
                        });
                        menu.appendChild(item);
                      }
                      document.body.appendChild(menu);
                      const mr = menu.getBoundingClientRect();
                      window.menuRectAtOpen = {
                        left:mr.left, top:mr.top, right:mr.right, bottom:mr.bottom,
                        width:mr.width, height:mr.height
                      };
                      window.openCount += 1;
                      window.trace.push({phase:'open', triggerRect:window.triggerRectAtOpen, menuRect:window.menuRectAtOpen});
                    }

                    const trigger = document.getElementById('trigger');
                    trigger.addEventListener('pointerdown', e => {
                      record('trigger-pointerdown', e);
                      openMenu(e);
                    });

                    document.addEventListener('pointerdown', e => {
                      record('document-pointerdown', e);
                      const menu = document.getElementById('menu');
                      if (!menu) return;
                      if (!menu.contains(e.target) && !trigger.contains(e.target)) {
                        window.closedByOutside += 1;
                        closeMenu('outside-pointerdown');
                      }
                    }, true);

                    for (const type of ['pointerdown','mousedown','pointerup','mouseup','click']) {
                      document.addEventListener(type, e => record('capture', e), true);
                    }
                  </script>
                </body>
              </html>
              """,
              baseURL: nil
          )

          guard spin(until: { waiter.finished || waiter.failed }), waiter.finished else {
              fatalError("navigation failed")
          }

          let innerWidth = (evaluate("window.innerWidth", in: webView) as? NSNumber)?.doubleValue ?? -1
          let innerHeight = (evaluate("window.innerHeight", in: webView) as? NSNumber)?.doubleValue ?? -1

          // Trigger center: left=20, bottom=20, 64x64 in logical CSS space.
          let physicalPoint = NSPoint(
              x: 52 * visibleScale,
              y: 52 * visibleScale
          )

          func mouseEvent(_ type: NSEvent.EventType, pressure: Float, number: Int) -> NSEvent {
              NSEvent.mouseEvent(
                  with: type,
                  location: physicalPoint,
                  modifierFlags: [],
                  timestamp: ProcessInfo.processInfo.systemUptime,
                  windowNumber: window.windowNumber,
                  context: nil,
                  eventNumber: number,
                  clickCount: 1,
                  pressure: pressure
              )!
          }

          // Deliberately split down/up with a run-loop gap. This allows the page
          // to mount and position a popover after pointerdown, matching modern
          // dropdown primitives more closely than a static click target.
          window.sendEvent(mouseEvent(.leftMouseDown, pressure: 1, number: 1))
          guard spin(until: {
              ((evaluate("window.openCount", in: webView) as? NSNumber)?.intValue ?? 0) == 1
          }, timeout: 2) else {
              fatalError("trigger pointerdown did not open menu")
          }

          let elementAtRelease = evaluate(
              "document.elementFromPoint(52, window.innerHeight - 52)?.id || document.elementFromPoint(52, window.innerHeight - 52)?.className || 'none'",
              in: webView
          ) as? String ?? "unknown"

          window.sendEvent(mouseEvent(.leftMouseUp, pressure: 0, number: 2))
          RunLoop.main.run(until: Date(timeIntervalSinceNow: 0.15))

          let menuOpen = (evaluate("document.getElementById('menu') ? 1 : 0", in: webView) as? NSNumber)?.intValue ?? -1
          let selected = (evaluate("window.selected", in: webView) as? NSNumber)?.intValue ?? -1
          let closedByOutside = (evaluate("window.closedByOutside", in: webView) as? NSNumber)?.intValue ?? -1
          let traceJSON = evaluate("JSON.stringify(window.trace)", in: webView) as? String ?? "[]"
          let triggerRectJSON = evaluate("JSON.stringify(window.triggerRectAtOpen)", in: webView) as? String ?? "null"
          let menuRectJSON = evaluate("JSON.stringify(window.menuRectAtOpen)", in: webView) as? String ?? "null"

          print("RESULT strategy=\(strategy.rawValue) innerWidth=\(innerWidth) innerHeight=\(innerHeight) physicalPoint=\(physicalPoint) elementAtRelease=\(elementAtRelease) menuOpen=\(menuOpen) selected=\(selected) closedByOutside=\(closedByOutside) triggerRect=\(triggerRectJSON) menuRect=\(menuRectJSON) trace=\(traceJSON)")

          // Expected one-click dropdown semantics: pointerdown opens the menu,
          // pointerup at the unchanged trigger position must not auto-select an
          // item or dismiss the menu.
          guard (360...420).contains(innerWidth),
                menuOpen == 1,
                selected == 0,
                closedByOutside == 0 else {
              fatalError("dynamic Mobile popover interaction contract failed")
          }

          withExtendedLifetime(logicalHost) {}
          window.orderOut(nil)
          SWIFT

      - name: Probe dynamic Mobile popover with pageZoom
        continue-on-error: true
        run: xcrun swift /tmp/FloatTabsMobilePopoverProbe.swift pageZoom

      - name: Probe dynamic Mobile popover with logical host
        if: always()
        continue-on-error: true
        run: xcrun swift /tmp/FloatTabsMobilePopoverProbe.swift logicalHost

      - name: Unit tests
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          test
