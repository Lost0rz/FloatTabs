name: one-shot rail cleanup

on:
  push:
    branches:
      - agent/fix-rail-and-resize

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-rail-and-resize
          fetch-depth: 0

      - name: Remove unsupported auto-full-width resize experiment
        shell: bash
        run: |
          set -euo pipefail
          git revert --no-commit 754d1841cf85dac73456fa18384eada62a29c112

      - name: Align every rail fold animation to the shared clock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('FloatTabs/UI/ExternalTabRail.swift')
          source = path.read_text()
          replacements = {
              'slide.duration = 0.26': 'slide.duration = ExternalTabMetrics.railFoldAnimationDuration',
              'fold.duration = 0.25': 'fold.duration = ExternalTabMetrics.railFoldAnimationDuration',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Verify intended scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'slide.duration = ExternalTabMetrics.railFoldAnimationDuration' FloatTabs/UI/ExternalTabRail.swift
          grep -Fq 'fold.duration = ExternalTabMetrics.railFoldAnimationDuration' FloatTabs/UI/ExternalTabRail.swift
          if grep -Fq 'static func resizedFrame(' FloatTabs/Web/WebViewContainer.swift; then
            echo 'unsupported auto-full-width resize helper still present' >&2
            exit 1
          fi
          if grep -Fq 'final class PanelResizeHandleGeometryTests' FloatTabsTests/ScreenPositioningTests.swift; then
            echo 'auto-full-width resize tests still present' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cleanup and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/one-shot-rail-cleanup.yml
          git add -- FloatTabs/UI/ExternalTabRail.swift FloatTabs/Web/WebViewContainer.swift FloatTabsTests/ScreenPositioningTests.swift
          git commit -m 'fix: align rail fold timing and keep floating resize semantics'
          git push origin HEAD:agent/fix-rail-and-resize
