name: Stage 4 ChatGPT warm-slot fix

on:
  push:
    branches:
      - feat/stage-4-closeout
    paths:
      - .github/workflows/stage4-chatgpt-warmfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-4-closeout
          fetch-depth: 0

      - name: Patch runtime rendering reuse and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pool_path = Path('FloatTabs/Web/WebViewPool.swift')
          pool = pool_path.read_text()

          old = '''    func webView(for profile: WebAppProfile) -> WKWebView {
        let desiredRendering = profile.renderingProfile.normalized()

        if let existing = webViews[profile.id],
           let appliedRendering = appliedRenderingProfiles[profile.id] {
            if desiredRendering.requiresWebViewRebuild(comparedTo: appliedRendering) {
                let navigationURL = Self.rebuildNavigationURL(
                    initialURL: existing.backForwardList.currentItem?.initialURL,
                    visibleURL: existing.url,
                    storedCurrentURL: profile.currentURL,
                    homeURL: profile.homeURL
                )
                return rebuildWebView(
                    for: profile,
                    navigationURL: navigationURL
                )
            }

            WebViewFactory.applyRuntimeRendering(desiredRendering, to: existing)
            appliedRenderingProfiles[profile.id] = desiredRendering
            recoverDeferredContentProcessIfNeeded(for: profile, in: existing)
            return existing
        }

        return createWebView(
            for: profile,
            navigationURL: profile.currentURL ?? profile.homeURL,
            cachePolicy: .useProtocolCachePolicy
        )
    }
'''

          new = '''    func webView(for profile: WebAppProfile) -> WKWebView {
        let desiredRendering = profile.renderingProfile.normalized()

        if let existing = webViews[profile.id],
           let appliedRendering = appliedRenderingProfiles[profile.id] {
            let compatibilityURL = Self.rebuildNavigationURL(
                initialURL: nil,
                visibleURL: existing.url,
                storedCurrentURL: profile.currentURL,
                homeURL: profile.homeURL
            )
            let desiredRuntimeRendering = SiteCompatibilityPolicy.runtimeRendering(
                for: desiredRendering,
                navigationURL: compatibilityURL
            )

            if desiredRuntimeRendering.requiresWebViewRebuild(comparedTo: appliedRendering) {
                let navigationURL = Self.rebuildNavigationURL(
                    initialURL: existing.backForwardList.currentItem?.initialURL,
                    visibleURL: existing.url,
                    storedCurrentURL: profile.currentURL,
                    homeURL: profile.homeURL
                )
                return rebuildWebView(
                    for: profile,
                    navigationURL: navigationURL
                )
            }

            // Reapply the effective runtime profile, not the persisted base profile.
            // This is essential for narrow site compatibility overrides such as
            // ChatGPT Automatic+Mobile, which must keep its macOS pointer identity
            // while the warm WKWebView is detached and later reused.
            WebViewFactory.applyRuntimeRendering(desiredRuntimeRendering, to: existing)
            appliedRenderingProfiles[profile.id] = desiredRuntimeRendering
            recoverDeferredContentProcessIfNeeded(for: profile, in: existing)
            return existing
        }

        return createWebView(
            for: profile,
            navigationURL: profile.currentURL ?? profile.homeURL,
            cachePolicy: .useProtocolCachePolicy
        )
    }
'''

          if pool.count(old) != 1:
              raise SystemExit(f'WebViewPool webView block matches: {pool.count(old)}')
          pool = pool.replace(old, new, 1)

          old_store = '        appliedRenderingProfiles[profile.id] = rendering\n'
          new_store = '''        // Store the effective runtime profile so warm-slot reuse compares
        // against the identity actually applied to this WKWebView.
        appliedRenderingProfiles[profile.id] = runtimeRendering
'''
          if pool.count(old_store) != 1:
              raise SystemExit(f'WebViewPool applied rendering store matches: {pool.count(old_store)}')
          pool = pool.replace(old_store, new_store, 1)
          pool_path.write_text(pool)

          tests_path = Path('FloatTabsTests/WebViewPoolTests.swift')
          tests = tests_path.read_text()
          anchor = '''    func testDevicePresetChangeDoesNotRebuildOrAlterBrowserIdentity() {
'''
          regression = '''    func testChatGPTMobileAutomaticWarmReuseKeepsCompatibilityIdentityWithoutReload() {
        var loadedRequests: [URLRequest] = []
        let pool = WebViewPool(
            onURLChange: { _, _ in },
            initialLoad: { _, request in loadedRequests.append(request) }
        )
        var profile = makeProfile(
            name: "ChatGPT",
            homeURL: URL(string: "https://chatgpt.com/")!
        )
        profile.renderingProfile = profile.renderingProfile.settingWebsiteMode(.mobile)

        let first = pool.webView(for: profile)
        let firstUA = first.customUserAgent
        let second = pool.webView(for: profile)
        let third = pool.webView(for: profile)

        XCTAssertTrue(first === second)
        XCTAssertTrue(second === third)
        XCTAssertEqual(loadedRequests.count, 1)
        XCTAssertEqual(second.customUserAgent, firstUA)
        XCTAssertEqual(third.customUserAgent, firstUA)
        XCTAssertTrue(third.customUserAgent?.contains("Macintosh") == true)
        XCTAssertFalse(third.customUserAgent?.contains("iPhone") == true)
    }

'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'WebViewPoolTests insertion anchor matches: {tests.count(anchor)}')
          tests = tests.replace(anchor, regression + anchor, 1)
          tests_path.write_text(tests)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/Web/WebViewPool.swift FloatTabsTests/WebViewPoolTests.swift
          git commit -m 'fix: preserve ChatGPT runtime identity on warm reuse'
          git push origin HEAD:feat/stage-4-closeout
