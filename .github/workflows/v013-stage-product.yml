name: Stage v0.1.3 Build 5 Product Patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  stage-product:
    if: github.event.pull_request.head.ref == 'trigger/v013-build5-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Apply product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          settings_path = Path('FloatTabs/UI/GlobalSettingsController.swift')
          settings = settings_path.read_text()
          if 'enum AppReleaseInfo {' in settings:
              raise SystemExit('AppReleaseInfo already exists; product patch is already staged')

          release_info = '''enum AppReleaseInfo {
              static let latestFixes = [
                  "Tab, Add, Pin and Settings controls respond on the first click.",
                  "Collapsed Tab rail width is reclaimed for Web content while retaining the 12 pt move gutter.",
                  "Fullscreen restore waits for WebKit presentation teardown and keeps shell/source state synchronized.",
                  "Settings now shows the exact app version, build number and latest fixes.",
              ]

              static func displayVersion(shortVersion: String?, build: String?) -> String {
                  let version = shortVersion?.trimmingCharacters(in: .whitespacesAndNewlines)
                  let buildNumber = build?.trimmingCharacters(in: .whitespacesAndNewlines)
                  let resolvedVersion = version.flatMap { $0.isEmpty ? nil : $0 } ?? "Unknown"
                  guard let buildNumber, !buildNumber.isEmpty else {
                      return "Version \\(resolvedVersion)"
                  }
                  return "Version \\(resolvedVersion) (Build \\(buildNumber))"
              }

              static var currentVersionDisplay: String {
                  displayVersion(
                      shortVersion: Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String,
                      build: Bundle.main.object(forInfoDictionaryKey: "CFBundleVersion") as? String
                  )
              }

              static var latestFixesDisplay: String {
                  latestFixes.map { "• \\($0)" }.joined(separator: "\\n")
              }
          }

          '''

          class_marker = '@MainActor\nprivate final class AccountLanguageSettingsViewController: NSViewController {'
          pos = settings.index(class_marker)
          settings = settings[:pos] + release_info + settings[pos:]

          class_pos = settings.index(class_marker)
          load_start = settings.index('    override func loadView() {', class_pos)
          export_start = settings.index('    @objc private func exportBackup()', load_start)
          new_load = '''    override func loadView() {
              let root = NSView()
              let scrollView = NSScrollView()
              scrollView.translatesAutoresizingMaskIntoConstraints = false
              scrollView.hasVerticalScroller = true
              scrollView.drawsBackground = false
              scrollView.borderType = .noBorder
              scrollView.autohidesScrollers = true

              let document = SettingsDocumentView()
              document.translatesAutoresizingMaskIntoConstraints = false
              scrollView.documentView = document

              let exportButton = NSButton(title: "Export Backup…", target: self, action: #selector(exportBackup))
              let restoreButton = NSButton(title: "Restore Backup…", target: self, action: #selector(restoreBackup))
              let actions = NSStackView(views: [exportButton, restoreButton])
              actions.orientation = .horizontal
              actions.alignment = .centerY
              actions.spacing = 10

              let versionLabel = NSTextField(labelWithString: AppReleaseInfo.currentVersionDisplay)
              versionLabel.font = .monospacedSystemFont(ofSize: 12, weight: .medium)
              versionLabel.textColor = .labelColor

              let stack = NSStackView(views: [
                  sectionTitle("Account"),
                  detailLabel("FloatTabs V1 is local-only. It does not require a FloatTabs cloud account or sync service."),
                  spacer(8),
                  sectionTitle("Backup & Restore"),
                  detailLabel("Backups include Web App/Slot configuration, rendering and resource settings, global appearance, Fixed shared window size, window-size switching preference, and the global Show/Hide shortcut."),
                  detailLabel("Website passwords, cookies, OAuth/login sessions, WebKit caches, and page runtime state are not exported. A new Mac may require website sign-in again."),
                  actions,
                  detailLabel("FloatTabs also keeps a local automatic snapshot for each app version/build and creates a rollback backup before every manual restore."),
                  spacer(10),
                  sectionTitle("Language"),
                  detailLabel("A per-app language override is not exposed in V1. No non-functional language selector is shown."),
                  spacer(14),
                  sectionTitle("About FloatTabs"),
                  versionLabel,
                  detailLabel("Latest fixes in this build:"),
                  detailLabel(AppReleaseInfo.latestFixesDisplay),
                  spacer(8),
              ])
              stack.orientation = .vertical
              stack.alignment = .leading
              stack.spacing = 8
              stack.translatesAutoresizingMaskIntoConstraints = false
              document.addSubview(stack)
              root.addSubview(scrollView)

              NSLayoutConstraint.activate([
                  scrollView.leadingAnchor.constraint(equalTo: root.leadingAnchor),
                  scrollView.trailingAnchor.constraint(equalTo: root.trailingAnchor),
                  scrollView.topAnchor.constraint(equalTo: root.topAnchor),
                  scrollView.bottomAnchor.constraint(equalTo: root.bottomAnchor),
                  document.leadingAnchor.constraint(equalTo: scrollView.contentView.leadingAnchor),
                  document.trailingAnchor.constraint(equalTo: scrollView.contentView.trailingAnchor),
                  document.topAnchor.constraint(equalTo: scrollView.contentView.topAnchor),
                  document.widthAnchor.constraint(equalTo: scrollView.contentView.widthAnchor),
                  stack.leadingAnchor.constraint(equalTo: document.leadingAnchor, constant: 28),
                  stack.trailingAnchor.constraint(lessThanOrEqualTo: document.trailingAnchor, constant: -28),
                  stack.topAnchor.constraint(equalTo: document.topAnchor, constant: 24),
                  stack.bottomAnchor.constraint(equalTo: document.bottomAnchor, constant: -20),
              ])
              view = root
          }

          '''
          settings = settings[:load_start] + new_load + settings[export_start:]
          settings_path.write_text(settings)

          tests_path = Path('FloatTabsTests/ExternalShellTests.swift')
          tests = tests_path.read_text()
          marker = '@MainActor\nfinal class ExternalShellTests: XCTestCase {\n'
          test_case = '''    func testReleaseInfoFormatsVersionAndBuild() {
              XCTAssertEqual(
                  AppReleaseInfo.displayVersion(shortVersion: "0.1.3", build: "5"),
                  "Version 0.1.3 (Build 5)"
              )
              XCTAssertEqual(
                  AppReleaseInfo.displayVersion(shortVersion: "0.1.3", build: nil),
                  "Version 0.1.3"
              )
              XCTAssertFalse(AppReleaseInfo.latestFixes.isEmpty)
          }

          '''
          if marker not in tests:
              raise SystemExit('ExternalShellTests class marker not found')
          tests = tests.replace(marker, marker + test_case, 1)
          tests_path.write_text(tests)

          project_path = Path('FloatTabs.xcodeproj/project.pbxproj')
          project = project_path.read_text()
          if project.count('CURRENT_PROJECT_VERSION = 4;') != 2:
              raise SystemExit('unexpected build-number state')
          project = project.replace('CURRENT_PROJECT_VERSION = 4;', 'CURRENT_PROJECT_VERSION = 5;')
          if project.count('MARKETING_VERSION = 0.1.3;') != 2:
              raise SystemExit('unexpected marketing-version state')
          project_path.write_text(project)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          bullet = '- Settings → Account & Language now shows the exact Version / Build and latest fixes for the installed build.\n'
          anchor = '- Fixed first-click Tab / rail control activation from a background application.\n'
          if bullet not in readme:
              if anchor not in readme:
                  raise SystemExit('README anchor not found')
              readme = readme.replace(anchor, bullet + anchor, 1)
          readme_path.write_text(readme)

          notes_path = Path('docs/release/FloatTabs_v0.1.3.md')
          notes = notes_path.read_text()
          refresh = '''## Build 5 refresh

The v0.1.3 release assets are refreshed in place with build 5. The marketing version remains `0.1.3`, while the build number distinguishes this corrected package from the original build 4 package.

Settings → Account & Language now ends with an **About FloatTabs** section showing the exact installed Version / Build and a short latest-fixes summary.

This is an in-place v0.1.3 correction, not a new release version.

'''
          if '## Build 5 refresh' not in notes:
              anchor = '## Highlights\n'
              if anchor not in notes:
                  raise SystemExit('release notes anchor not found')
              notes = notes.replace(anchor, refresh + anchor, 1)
          notes_path.write_text(notes)
          PY

          git diff --check
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 5;' FloatTabs.xcodeproj/project.pbxproj)" = "2"
          grep -q 'sectionTitle("About FloatTabs")' FloatTabs/UI/GlobalSettingsController.swift
          grep -q 'Version 0.1.3 (Build 5)' FloatTabsTests/ExternalShellTests.swift

      - name: Push product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c fix/v013-build5-product
          git add -- \
            FloatTabs/UI/GlobalSettingsController.swift \
            FloatTabsTests/ExternalShellTests.swift \
            FloatTabs.xcodeproj/project.pbxproj \
            README.md \
            docs/release/FloatTabs_v0.1.3.md
          git commit -m "fix: show v0.1.3 build information in Settings"
          git push origin HEAD:refs/heads/fix/v013-build5-product
