name: Stage 5D Interaction Polish Apply

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - '.github/workflows/stage5d-interaction-polish-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Apply guarded source edits
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          import textwrap

          workflow_path = '.github/workflows/stage5d-interaction-polish-apply.yml'
          raw = subprocess.check_output(
              ['git', 'show', f'HEAD^:{workflow_path}'],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n\n      - name: Resolve Swift packages"
          if start_marker not in raw or end_marker not in raw:
              raise SystemExit('could not recover guarded Stage 5D source-edit script')
          script = raw.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)
          bad = 'return Self.isDraggable(point: localPoint, in: bounds) ? self : nil'
          fixed = 'return Self.dragRects(in: bounds).contains(where: { $0.contains(localPoint) }) ? self : nil'
          if script.count(bad) != 1:
              raise SystemExit(f'expected one bad drag hit-test call, found {script.count(bad)}')
          script = script.replace(bad, fixed)
          exec(compile(script, '<stage5d-guarded-edits>', 'exec'))
          PY

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            FloatTabs/Panel/ScreenPositioning.swift \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabsTests/ExternalShellTests.swift \
            docs/product/FloatTabs_Stage_5D_Interaction_Rendering_Refinement.md
          git diff --cached --check
          git commit -m "fix: polish Stage 5D interaction shell"
          git push origin HEAD:perf/stage-5-resource-benchmark
