name: Remove redundant Rename action

on:
  push:
    branches:
      - feat/navigation-intent-slot-home-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-intent-slot-home-v2
          fetch-depth: 0

      - name: Apply guarded Rename cleanup
        shell: bash
        run: |
          echo '' | base64 --decode | python3

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FloatTabs FloatTabsTests
          git diff --cached --check
          git commit -m "fix: remove redundant tab rename action"
          git push origin HEAD:feat/navigation-intent-slot-home-v2
