name: Phase 5 Remote Construction

on:
  push:
    branches:
      - codex/ft-runtime-lifecycle-phase5-background-thrift-001

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, macOS, ARM64, mac-mini-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply bounded patch
        run: python3 .github/scripts/phase5_remote_patch.py

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat

      - name: Commit and remove temporary construction files
        run: |
          git config user.name "FloatTabs Phase 5 Remote Constructor"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase5-remote-construction.yml .github/scripts/phase5_remote_patch.py
          git add FloatTabs/Web/ChatGPTAttentionBridge.swift FloatTabsTests/ChatGPTAttentionBridgeTests.swift
          git commit -m "FT-RUNTIME-LIFECYCLE-MEMORY-001: add background generation liveness thrift"
          git push origin "HEAD:${GITHUB_REF_NAME}"
