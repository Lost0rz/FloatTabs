name: Stage 6D Final Validate

on:
  push:
    branches:
      - feat/stage-6d-global-settings
    paths:
      - '.github/stage6d_fix2.py'
      - '.github/stage6d-final-trigger'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-6d-global-settings

      - name: Apply final Stage 6D audit fixes
        run: python3 .github/stage6d_fix2.py

      - name: Check diff
        run: git diff --check

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Full unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit validated final Stage 6D audit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/GlobalSettingsController.swift \
            docs/architecture/FloatTabs_Technical_Architecture_v1.2.md \
            docs/product/FloatTabs_Product_Development_Spec_v0.5.md \
            docs/product/FloatTabs_Stage_6D_Global_Settings.md
          git commit -m 'fix: align Stage 6D appearance and source of truth'
          git push origin HEAD:feat/stage-6d-global-settings
