name: Monterey Compatibility CI

on:
  push:
    branches:
      - audit/v013-monterey-candidate-f
    paths:
      - 'tools/release/build_monterey_dmg.sh'
      - 'tools/release/monterey_transform_lib.py'
      - 'tools/release/prepare_monterey_sources.py'
      - 'tools/release/prepare_monterey_webview.py'
      - 'tools/release/prepare_monterey_runtime_safe_mode.py'
      - 'tools/release/prepare_monterey_webview_minimal.py'
      - 'tools/release/prepare_monterey_lazy_restore.py'
      - 'tools/release/prepare_monterey_isolated_runtime.py'
      - 'tools/release/prepare_monterey_candidate_f.py'
      - '.github/workflows/monterey-compat-ci.yml'
      - 'docs/release/compatibility/**'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/release/build_monterey_dmg.sh'
      - 'tools/release/monterey_transform_lib.py'
      - 'tools/release/prepare_monterey_sources.py'
      - 'tools/release/prepare_monterey_webview.py'
      - 'tools/release/prepare_monterey_runtime_safe_mode.py'
      - 'tools/release/prepare_monterey_webview_minimal.py'
      - 'tools/release/prepare_monterey_lazy_restore.py'
      - 'tools/release/prepare_monterey_isolated_runtime.py'
      - 'tools/release/prepare_monterey_candidate_f.py'
      - '.github/workflows/monterey-compat-ci.yml'
      - '.github/workflows/publish-monterey-release.yml'
      - 'docs/release/compatibility/**'

permissions:
  contents: read
  statuses: write

jobs:
  macos-12-compile-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce standard-edition source isolation
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/monterey-compat-ci\.yml|\.github/workflows/publish-monterey-release\.yml|docs/release/compatibility/.*|tools/release/build_monterey_dmg\.sh|tools/release/monterey_transform_lib\.py|tools/release/prepare_monterey_[A-Za-z0-9_]+\.py)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'error: Monterey branch modified standard-edition source or unrelated files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(FloatTabs/|FloatTabsTests/|FloatTabs\.xcodeproj/)'; then
            echo 'error: committed product source changes are forbidden on the Monterey compatibility branch' >&2
            exit 1
          fi

      - name: Apply isolated Monterey Candidate F preparation
        run: |
          python3 tools/release/prepare_monterey_sources.py
          python3 tools/release/prepare_monterey_webview.py
          python3 tools/release/prepare_monterey_runtime_safe_mode.py
          python3 tools/release/prepare_monterey_webview_minimal.py
          python3 tools/release/prepare_monterey_lazy_restore.py
          python3 tools/release/prepare_monterey_isolated_runtime.py
          python3 tools/release/prepare_monterey_candidate_f.py

      - name: Verify Candidate F generated runtime boundary
        run: |
          set -euo pipefail
          grep -Fq 'Monterey Compatibility Edition' FloatTabs/Web/WebViewFactory.swift
          grep -Fq 'Monterey Compatibility Edition' FloatTabs/Panel/PanelController.swift
          grep -Fq 'final class MontereyNavigationObserver: NSObject, WKNavigationDelegate' FloatTabs/Web/SlotNavigationObserver.swift
          grep -Fq '[FloatTabs Monterey Candidate F] navigation committed slot=' FloatTabs/Web/SlotNavigationObserver.swift
          grep -Fq 'let observer = MontereyNavigationObserver(' FloatTabs/Web/WebViewPool.swift
          grep -Fq 'webView.uiDelegate = popupCoordinator' FloatTabs/Web/WebViewPool.swift
          grep -Fq 'websiteMode: activeProfile.renderingProfile.effectiveWebsiteMode' FloatTabs/Panel/PanelController.swift
          grep -Fq 'private(set) var websiteMode: WebsiteMode = .desktop' FloatTabs/Web/WebViewContainer.swift
          observer="$(sed -n '/final class MontereyNavigationObserver: NSObject, WKNavigationDelegate/,/typealias SlotNavigationObserver = MontereyNavigationObserver/p' FloatTabs/Web/SlotNavigationObserver.swift)"
          if printf '%s\n' "$observer" | grep -Eq 'decidePolicyFor|shouldPerformDownload|WKNavigationActionPolicy\.download|WKNavigationResponsePolicy\.download|didBecome download|preferredContentMode|customUserAgent|applicationNameForUserAgent|pageZoom[[:space:]]*='; then
            echo 'error: forbidden navigation policy/download/rendering behavior leaked into Candidate F minimal observer' >&2
            exit 1
          fi
          if grep -Fq '.canJoinAllApplications' FloatTabs/Panel/FloatingPanel.swift; then
            echo 'error: standard macOS 13 collection behavior leaked into Monterey edition' >&2
            exit 1
          fi
          if grep -Fq 'observeModernFullscreenState' FloatTabs/Panel/FullscreenSourceHost.swift; then
            echo 'error: standard fullscreen observer leaked into Monterey edition' >&2
            exit 1
          fi
          if grep -Fq 'WKWebView.FullscreenState' FloatTabs/Panel/FullscreenSourceHost.swift; then
            echo 'error: macOS 13 FullscreenState API leaked into Monterey edition' >&2
            exit 1
          fi

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Debug build with macOS 12 deployment target
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: XCTest with macOS 12 deployment target
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Reset checkout before packaging
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Build and verify Candidate F Universal 2 DMG
        env:
          FLOATTABS_OUTPUT_DIR: ${{ runner.temp }}/FloatTabsMontereyCandidateF
          FLOATTABS_MONTEREY_TARGET: '12.0'
          FLOATTABS_PACKAGE_SUFFIX: 'Monterey-Candidate-F'
        run: |
          chmod +x tools/release/build_monterey_dmg.sh
          tools/release/build_monterey_dmg.sh

      - name: Verify expected Candidate F assets
        env:
          OUTPUT_DIR: ${{ runner.temp }}/FloatTabsMontereyCandidateF
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/FloatTabs-0.1.3-Monterey-Candidate-F.dmg"
          test -f "$OUTPUT_DIR/FloatTabs-0.1.3-Monterey-Candidate-F.dmg.sha256"
          test -f "$OUTPUT_DIR/FloatTabs-0.1.3-Monterey-Candidate-F.dSYM.zip"
          test -f "$OUTPUT_DIR/FloatTabs-0.1.3-Monterey-Candidate-F.dSYM.zip.sha256"
          (
            cd "$OUTPUT_DIR"
            shasum -a 256 -c FloatTabs-0.1.3-Monterey-Candidate-F.dmg.sha256
            shasum -a 256 -c FloatTabs-0.1.3-Monterey-Candidate-F.dSYM.zip.sha256
          )

      - name: Upload Monterey Candidate F test package and symbols
        uses: actions/upload-artifact@v4
        with:
          name: FloatTabs-0.1.3-Monterey-Candidate-F-test
          path: |
            ${{ runner.temp }}/FloatTabsMontereyCandidateF/FloatTabs-0.1.3-Monterey-Candidate-F.dmg
            ${{ runner.temp }}/FloatTabsMontereyCandidateF/FloatTabs-0.1.3-Monterey-Candidate-F.dmg.sha256
            ${{ runner.temp }}/FloatTabsMontereyCandidateF/FloatTabs-0.1.3-Monterey-Candidate-F.dSYM.zip
            ${{ runner.temp }}/FloatTabsMontereyCandidateF/FloatTabs-0.1.3-Monterey-Candidate-F.dSYM.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish Candidate F push validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            *) state=failure ;;
          esac
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='candidate-f/monterey-compat' \
            -f description="Candidate F ${JOB_STATUS}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
