name: Apply Address Bar Actions

on:
  push:
    branches:
      - agent/address-bar-current-page-actions
    paths:
      - '.github/address_bar_patch.py'
      - '.github/address_bar_patch_fix.py'
      - '.github/address-bar-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/address-bar-current-page-actions
          fetch-depth: 0

      - name: Apply address bar implementation
        run: |
          python3 .github/address_bar_patch.py
          python3 .github/address_bar_patch_fix.py

      - name: Check patch
        run: |
          git diff --check
          git diff -- \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/Tabs/TabStore.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/TabStoreTests.swift

      - name: Resolve packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Run focused address bar and data tests
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          -only-testing:FloatTabsTests/AppCommandControllerTests
          -only-testing:FloatTabsTests/TabStoreTests
          test

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/Tabs/TabStore.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/TabStoreTests.swift
          git diff --cached --quiet && exit 0
          git commit -m 'feat: make command-l a current-page address bar'
          git push origin HEAD:agent/address-bar-current-page-actions
