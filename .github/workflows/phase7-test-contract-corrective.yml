name: Phase7 Test Contract Corrective

on:
  push:
    branches:
      - codex/ft-runtime-lifecycle-phase7-automatic-001

permissions:
  contents: write

jobs:
  corrective:
    if: github.repository == 'Lost0rz/FloatTabs'
    runs-on: [self-hosted, macOS, ARM64, mac-mini-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify bounded corrective branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/ft-runtime-lifecycle-phase7-automatic-001"
          test -f tools/phase7_test_contract_corrective.py
          grep -q '^PHASE7_EXPANDED_TEST_CORRECTIVE = True$' tools/phase7_test_contract_corrective.py

      - name: Apply bounded test-contract corrective
        run: python3 tools/phase7_test_contract_corrective.py

      - name: Verify diff hygiene and test-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^FloatTabsTests/(AppCommandControllerTests|BrowserProfileDuplicateTests|ExternalShellTests|WebAttentionCrossFeatureTests|WebAttentionLifecycleTests|WebViewFactoryTests|WebViewPoolTests|WebsiteCacheCleanupTests)\.swift$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected corrective paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Full XCTest
        id: xctest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/FloatTabsPhase7Corrective.xcresult"
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/FloatTabsPhase7Corrective" \
            -resultBundlePath "$RUNNER_TEMP/FloatTabsPhase7Corrective.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/phase7-xctest.log"

      - name: Upload XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase7-Test-Corrective-XCTest-Diagnostics
          path: |
            ${{ runner.temp }}/phase7-xctest.log
            ${{ runner.temp }}/FloatTabsPhase7Corrective.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Require full XCTest pass
        if: steps.xctest.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Remove temporary corrective machinery
        shell: bash
        run: |
          rm -f tools/phase7_test_contract_corrective.py
          rm -f .github/workflows/phase7-test-contract-corrective.yml

      - name: Commit and push verified corrective
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update Phase 7 tests for automatic lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
