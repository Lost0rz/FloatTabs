name: Stage 5D Core Refinement

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - .github/stage5d-core-refinement.trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Prepare final Stage 5D patch
        run: python3 .github/stage5d-core-refinement-v2.py

      - name: Apply Stage 5D core patch
        run: python3 .github/stage5d-core-refinement.py

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'resizeHandleSize: CGFloat = 32' FloatTabs/Panel/ScreenPositioning.swift
          grep -q 'websiteLayoutScale = 1' FloatTabs/Web/WebViewFactory.swift
          grep -q 'pageZoom = userPageZoom' FloatTabs/Web/WebViewFactory.swift
          ! grep -q 'magnification = rendering.zoom' FloatTabs/Web/WebViewFactory.swift
          grep -q 'Website Mode' FloatTabs/UI/ExternalTabRail.swift
          grep -q 'showsPrimaryRenderingControls: false' FloatTabs/UI/WebAppEditorController.swift

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Full unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit validated core refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Lost0rz@users.noreply.github.com'
          git add \
            FloatTabs/Panel/ScreenPositioning.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/Web/WebViewFactory.swift \
            FloatTabsTests/ExternalShellTests.swift \
            FloatTabsTests/WebViewFactoryTests.swift
          git commit -m 'fix: refine resizing rendering and tab controls'
          git push origin HEAD:perf/stage-5-resource-benchmark
