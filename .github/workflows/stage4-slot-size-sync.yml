name: Stage 4 slot-size presentation fix

on:
  push:
    branches:
      - feat/stage-4-closeout
    paths:
      - .github/workflows/stage4-slot-size-sync.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-4-closeout
          fetch-depth: 0

      - name: Apply synchronized slot-size presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          panel_path = Path('FloatTabs/Panel/PanelController.swift')
          panel = panel_path.read_text()

          old_switch = '''        if activeChanged, hasPositionedPanel, followPreferredSize {
            applyPreferredViewport(activeProfile.renderingProfile.viewportSize)
        }
'''
          new_switch = '''        if activeChanged, hasPositionedPanel, followPreferredSize {
            // Automatic Slot switching must be transactional. Animating the panel
            // while a different resident WKWebView is promoted exposes the host
            // background until WebKit catches up to the intermediate sizes.
            applyPreferredViewport(
                activeProfile.renderingProfile.viewportSize,
                animated: false
            )
        }
'''
          if panel.count(old_switch) != 1:
              raise SystemExit(f'active switch block matches: {panel.count(old_switch)}')
          panel = panel.replace(old_switch, new_switch, 1)

          old_signature = '    private func applyPreferredViewport(_ viewportSize: CGSize) {\n'
          new_signature = '''    private func applyPreferredViewport(
        _ viewportSize: CGSize,
        animated: Bool = true
    ) {
'''
          if panel.count(old_signature) != 1:
              raise SystemExit(f'applyPreferredViewport signature matches: {panel.count(old_signature)}')
          panel = panel.replace(old_signature, new_signature, 1)

          old_frame = '''        guard target != panel.frame else { return }
        panel.setFrame(target, display: true, animate: true)
        persistPanelFrame()
'''
          new_frame = '''        guard target != panel.frame else { return }
        panel.setFrame(target, display: true, animate: animated)
        if !animated {
            // Finish AppKit geometry before the target resident WebView is promoted.
            // This prevents one-frame stale WebView bounds during fast Slot switches.
            rootView.layoutSubtreeIfNeeded()
        }
        persistPanelFrame()
'''
          if panel.count(old_frame) != 1:
              raise SystemExit(f'preferred viewport frame block matches: {panel.count(old_frame)}')
          panel = panel.replace(old_frame, new_frame, 1)
          panel_path.write_text(panel)

          pool_path = Path('FloatTabs/Web/WebViewPool.swift')
          pool = pool_path.read_text()

          old_present = '''        // Reordering the existing subviews keeps every resident WKWebView in the
        // same window hierarchy. AppKit moves shared views without remove/re-add.
        var orderedSubviews = host.subviews
        if let index = orderedSubviews.firstIndex(where: { $0 === webView }) {
            let selected = orderedSubviews.remove(at: index)
            orderedSubviews.append(selected)
            host.subviews = orderedSubviews
        }

        for resident in host.subviews.compactMap({ $0 as? WKWebView }) {
            resident.isHidden = false
            resident.alphaValue = 1
            resident.autoresizingMask = [.width, .height]
            if resident.frame != host.bounds {
                resident.frame = host.bounds
            }
        }

        active = webView
'''
          new_present = '''        // Synchronize resident geometry before promoting the target WebView.
        // When Slots use different preferred window sizes, bringing the target to
        // front first can expose the container background while its old frame and
        // WebKit compositor catch up to the resized host.
        for resident in host.subviews.compactMap({ $0 as? WKWebView }) {
            resident.isHidden = false
            resident.alphaValue = 1
            resident.autoresizingMask = [.width, .height]
            if resident.frame != host.bounds {
                resident.frame = host.bounds
            }
        }
        webView.layoutSubtreeIfNeeded()

        // Reordering the existing subviews keeps every resident WKWebView in the
        // same window hierarchy. AppKit moves shared views without remove/re-add.
        var orderedSubviews = host.subviews
        if let index = orderedSubviews.firstIndex(where: { $0 === webView }) {
            let selected = orderedSubviews.remove(at: index)
            orderedSubviews.append(selected)
            host.subviews = orderedSubviews
        }

        active = webView
'''
          if pool.count(old_present) != 1:
              raise SystemExit(f'warm presentation block matches: {pool.count(old_present)}')
          pool = pool.replace(old_present, new_present, 1)
          pool_path.write_text(pool)

          tests_path = Path('FloatTabsTests/WebViewPoolTests.swift')
          tests = tests_path.read_text()
          anchor = '''    private func makePool() -> WebViewPool {
'''
          regression = '''    func testWarmResidencyResizesTargetBeforePromotionAfterHostSizeChange() {
        let container = WebPanelContainerView(
            frame: NSRect(x: 0, y: 0, width: 430, height: 820)
        )
        let window = NSWindow(
            contentRect: NSRect(x: 0, y: 0, width: 430, height: 820),
            styleMask: [.borderless],
            backing: .buffered,
            defer: false
        )
        window.contentView = container
        container.frame = window.contentView?.bounds ?? container.frame
        container.layoutSubtreeIfNeeded()

        let residency = WarmWebViewResidencyCoordinator(container: container)
        let first = WebViewFactory.makeWebView()
        let second = WebViewFactory.makeWebView()
        residency.show(webView: first)
        residency.show(webView: second)

        window.setContentSize(NSSize(width: 700, height: 900))
        container.frame = window.contentView?.bounds ?? container.frame
        container.layoutSubtreeIfNeeded()

        residency.show(webView: first)
        let host = first.superview

        XCTAssertEqual(first.frame, host?.bounds)
        XCTAssertEqual(second.frame, host?.bounds)
        XCTAssertTrue(host?.subviews.last === first)
        XCTAssertTrue(residency.activeWebView === first)
    }

'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'test insertion anchor matches: {tests.count(anchor)}')
          tests = tests.replace(anchor, regression + anchor, 1)
          tests_path.write_text(tests)
          PY

      - name: Remove construction workflow
        shell: bash
        run: rm .github/workflows/stage4-slot-size-sync.yml

      - name: Validate and push
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/Panel/PanelController.swift FloatTabs/Web/WebViewPool.swift FloatTabsTests/WebViewPoolTests.swift .github/workflows/stage4-slot-size-sync.yml
          git commit -m 'fix: synchronize warm slot size presentation'
          git push origin HEAD:feat/stage-4-closeout
