name: RC1 Apply

on:
  push:
    branches:
      - release/v0.1.0-rc1
    paths:
      - '.github/rc1_patch.py'
      - '.github/rc1_fix1.py'
      - '.github/rc1_fix2.py'
      - '.github/rc1-trigger'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v0.1.0-rc1

      - name: Apply RC1 implementation
        run: |
          python3 .github/rc1_patch.py
          python3 .github/rc1_fix1.py
          python3 .github/rc1_fix2.py

      - name: Check diff
        run: git diff --check

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Release build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Full unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Build and verify QA DMG
        env:
          FLOATTABS_OUTPUT_DIR: ${{ runner.temp }}/FloatTabsRC1
        run: |
          chmod +x tools/release/build_dmg.sh
          tools/release/build_dmg.sh
          test -f "$RUNNER_TEMP/FloatTabsRC1/FloatTabs-0.1.0.dmg"

      - name: Commit validated RC1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .gitignore \
            FloatTabs.xcodeproj/project.pbxproj \
            FloatTabs/App/AppCoordinator.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/Persistence/AppPreferencesStore.swift \
            FloatTabs/Persistence/FloatTabsBackupService.swift \
            FloatTabs/Persistence/ProfileRepository.swift \
            FloatTabs/Tabs/TabStore.swift \
            FloatTabs/UI/GlobalSettingsController.swift \
            FloatTabs/Web/SlotLifecycleCoordinator.swift \
            FloatTabsTests/AppPreferencesStoreTests.swift \
            FloatTabsTests/FloatTabsBackupServiceTests.swift \
            FloatTabsTests/TabStoreTests.swift \
            README.md \
            docs/release/FloatTabs_v0.1.0_RC1.md \
            tools/release/build_dmg.sh
          git update-index --chmod=+x tools/release/build_dmg.sh
          git commit -m 'release: implement RC1 backup restore and DMG tooling'
          git push origin HEAD:release/v0.1.0-rc1
