name: Stage 5 Residency Construction

on:
  push:
    branches:
      - feat/stage-5-residency-policy
    paths:
      - .github/stage5-residency.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-5-residency-policy
          fetch-depth: 0

      - name: Make Hot host reconciliation mutation-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('FloatTabs/Web/WebViewContainer.swift')
          text = path.read_text()
          old = "    func retainHotSlots(_ validHotSlotIDs: Set<UUID>) {\n        for slotID in hotHostViews.keys where !validHotSlotIDs.contains(slotID) {\n            guard let host = hotHostViews.removeValue(forKey: slotID) else { continue }\n            host.webView?.removeFromSuperview()\n            host.removeFromSuperview()\n        }\n    }\n"
          new = "    func retainHotSlots(_ validHotSlotIDs: Set<UUID>) {\n        let staleHotSlotIDs = hotHostViews.keys.filter { !validHotSlotIDs.contains($0) }\n        for slotID in staleHotSlotIDs {\n            guard let host = hotHostViews.removeValue(forKey: slotID) else { continue }\n            host.webView?.removeFromSuperview()\n            host.removeFromSuperview()\n        }\n    }\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one retainHotSlots match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/Web/WebViewContainer.swift
          git diff --cached --check
          git commit -m 'fix: make hot host reconciliation mutation-safe'
          git push origin HEAD:feat/stage-5-residency-policy
