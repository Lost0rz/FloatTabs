name: Stage 5D Real Mac Follow-up

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Apply Real-Mac follow-up fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Put more of the top/bottom move target inside the visible page edge.
          replace_once(
              "FloatTabs/Panel/ScreenPositioning.swift",
              '''    /// Keep movement acquisition primarily outside WebKit. The effective top /\n    /// bottom target is 16 pt deep: 12 pt outside the viewport and only 4 pt\n    /// inside it. The website right edge remains protected for scrollbars.\n    static let outerInteractionGutter: CGFloat = 12\n    static let innerMovementOverlap: CGFloat = 4\n''',
              '''    /// Keep movement acquisition discoverable at the visible page edge while\n    /// making the reliable in-page portion large enough for real pointer use.\n    /// The effective top / bottom target is 22 pt deep: 12 pt in the shell and\n    /// 10 pt inside the viewport. The website right edge remains protected.\n    static let outerInteractionGutter: CGFloat = 12\n    static let innerMovementOverlap: CGFloat = 10\n'''
          )

          # 2) Move the only resize target fully inside the Web corner. Real-Mac
          # acceptance showed the transparent outside-gutter part was the unreliable
          # part, while the in-page part acquired correctly.
          replace_once(
              "FloatTabs/Web/WebViewContainer.swift",
              '''            resizeHandleView.trailingAnchor.constraint(\n                equalTo: trailingAnchor,\n                constant: -PanelMetrics.resizeHandleInset\n            ),\n            resizeHandleView.bottomAnchor.constraint(\n                equalTo: bottomAnchor,\n                constant: PanelMetrics.resizeHandleInset\n            ),\n''',
              '''            // Keep the complete resize target inside the visible Web corner.\n            // Real-Mac acceptance showed the transparent outer gutter was an\n            // unreliable acquisition surface, while the in-page area was stable.\n            resizeHandleView.trailingAnchor.constraint(\n                equalTo: webPanelContainerView.trailingAnchor\n            ),\n            resizeHandleView.bottomAnchor.constraint(\n                equalTo: webPanelContainerView.bottomAnchor\n            ),\n'''
          )
          replace_once(
              "FloatTabs/Web/WebViewContainer.swift",
              '''        let bottomExclusion = max(\n            PanelMetrics.resizeHandleSize,\n            PanelMetrics.webRightInteractionSafety\n        )\n''',
              '''        let bottomExclusion = max(\n            outer + PanelMetrics.resizeHandleSize,\n            PanelMetrics.webRightInteractionSafety\n        )\n'''
          )
          replace_once(
              "FloatTabs/Web/WebViewContainer.swift",
              '''/// The only resize affordance. It lives mostly in the outer bottom-right gutter,\n/// with a small corner overlap so it remains easy to acquire without restoring\n/// native edge resizing.\n''',
              '''/// The only resize affordance. Both its visible grip and complete hit target\n/// live inside the bottom-right Web corner. This deliberately avoids relying on\n/// transparent outside-window-looking pixels for a precision interaction.\n'''
          )

          # 3) Unify every rail control on the same 40x32 resting geometry.
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    static let addHeight: CGFloat = 28\n    static let addNormalWidth: CGFloat = 34\n    static let addHoverWidth: CGFloat = 54\n    static let addOpenWidth: CGFloat = 58\n\n    static let systemControlHeight: CGFloat = 28\n    static let systemControlNormalWidth: CGFloat = 34\n    static let systemControlHoverWidth: CGFloat = 54\n''',
              '''    // Add / Settings / Pin are members of the same rail, not separate\n    // floating buttons. Keep their resting and hover geometry identical to tabs.\n    static let addHeight: CGFloat = tabHeight\n    static let addNormalWidth: CGFloat = collapsedWidth\n    static let addHoverWidth: CGFloat = hoverWidth\n    static let addOpenWidth: CGFloat = hoverWidth\n\n    static let systemControlHeight: CGFloat = tabHeight\n    static let systemControlNormalWidth: CGFloat = collapsedWidth\n    static let systemControlHoverWidth: CGFloat = hoverWidth\n'''
          )

          # Centralize hover truth in the rail. Child tracking areas still provide
          # events, but a pointer move now clears stale expanded rows deterministically.
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    private var trackingAreaReference: NSTrackingArea?\n    private var pointerY: CGFloat?\n''',
              '''    private var trackingAreaReference: NSTrackingArea?\n    private var pointerLocation: NSPoint?\n    private var pointerY: CGFloat?\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    override func mouseExited(with event: NSEvent) {\n        pointerY = nil\n        layoutControls(animated: true, duration: ExternalTabMetrics.dockSettleDuration)\n    }\n''',
              '''    override func mouseExited(with event: NSEvent) {\n        pointerLocation = nil\n        pointerY = nil\n        synchronizeHoverState(at: nil)\n        layoutControls(animated: true, duration: ExternalTabMetrics.dockSettleDuration)\n    }\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    private func updateDockPointer(with event: NSEvent) {\n        let location = convert(event.locationInWindow, from: nil)\n        pointerY = location.y\n        layoutControls(animated: true, duration: ExternalTabMetrics.dockMotionDuration)\n    }\n\n    private func layoutControls(animated: Bool, duration: TimeInterval) {\n''',
              '''    private func updateDockPointer(with event: NSEvent) {\n        let location = convert(event.locationInWindow, from: nil)\n        pointerLocation = location\n        pointerY = location.y\n        synchronizeHoverState(at: location)\n        layoutControls(animated: true, duration: ExternalTabMetrics.dockMotionDuration)\n    }\n\n    private func synchronizeHoverState(at location: NSPoint?) {\n        for tab in tabViews.values {\n            tab.setHovered(location.map { tab.frame.contains($0) } ?? false)\n        }\n        addControl.setHovered(location.map { addControl.frame.contains($0) } ?? false)\n        currentControls.setHovered(\n            location.map { currentControls.frame.contains($0) } ?? false\n        )\n        pinControl.setHovered(location.map { pinControl.frame.contains($0) } ?? false)\n    }\n\n    private func layoutControls(animated: Bool, duration: TimeInterval) {\n'''
          )

          # Active tab remains physically attached to the Web surface. Every other
          # rail item stops at the animated outline rather than protruding through it.
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''                let width = min(tab.preferredWidth, self.bounds.width)\n                let targetFrame = NSRect(\n                    x: max(self.bounds.width - width, 0),\n                    y: y,\n                    width: width,\n                    height: ExternalTabMetrics.tabHeight\n                )\n''',
              '''                let targetFrame = self.attachedFrame(\n                    preferredWidth: tab.preferredWidth,\n                    y: y,\n                    height: ExternalTabMetrics.tabHeight,\n                    isActiveTab: tab.isActiveTab\n                )\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''            let addWidth = min(self.addControl.preferredWidth, self.bounds.width)\n            let addFrame = NSRect(\n                x: max(self.bounds.width - addWidth, 0),\n                y: y,\n                width: addWidth,\n                height: ExternalTabMetrics.addHeight\n            )\n''',
              '''            let addFrame = self.attachedFrame(\n                preferredWidth: self.addControl.preferredWidth,\n                y: y,\n                height: ExternalTabMetrics.addHeight\n            )\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''            let pinWidth = min(self.pinControl.preferredWidth, self.bounds.width)\n            let pinFrame = NSRect(\n                x: max(self.bounds.width - pinWidth, 0),\n                y: pinY,\n                width: pinWidth,\n                height: ExternalTabMetrics.systemControlHeight\n            )\n''',
              '''            let pinFrame = self.attachedFrame(\n                preferredWidth: self.pinControl.preferredWidth,\n                y: pinY,\n                height: ExternalTabMetrics.systemControlHeight\n            )\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''            let systemWidth = min(self.currentControls.preferredWidth, self.bounds.width)\n            let systemFrame = NSRect(\n                x: max(self.bounds.width - systemWidth, 0),\n                y: systemY,\n                width: systemWidth,\n                height: ExternalTabMetrics.systemControlHeight\n            )\n''',
              '''            let systemFrame = self.attachedFrame(\n                preferredWidth: self.currentControls.preferredWidth,\n                y: systemY,\n                height: ExternalTabMetrics.systemControlHeight\n            )\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    private func setFrame(_ frame: NSRect, for view: NSView, animated: Bool) {\n''',
              '''    private func attachedFrame(\n        preferredWidth: CGFloat,\n        y: CGFloat,\n        height: CGFloat,\n        isActiveTab: Bool = false\n    ) -> NSRect {\n        let rightInset = isActiveTab ? 0 : PanelMetrics.interactionBorderOutset\n        let availableWidth = max(bounds.width - rightInset, 0)\n        let width = min(preferredWidth, availableWidth)\n        return NSRect(\n            x: max(bounds.width - rightInset - width, 0),\n            y: y,\n            width: width,\n            height: height\n        )\n    }\n\n    private func setFrame(_ frame: NSRect, for view: NSView, animated: Bool) {\n'''
          )

          # Explicit hover setter lets the parent rail clear stale expansion even if
          # AppKit tracking exits race an animated frame change.
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    var isShowingLabel: Bool { isHovered }\n    var displayedIcon: NSImage? { iconView.image }\n''',
              '''    var isShowingLabel: Bool { isHovered }\n    var isActiveTab: Bool { isActive }\n    var displayedIcon: NSImage? { iconView.image }\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    func setDockInfluence(_ influence: CGFloat) {\n        dockInfluence = min(max(influence, 0), 1)\n    }\n\n    func update(profile: WebAppProfile, isActive: Bool) {\n''',
              '''    func setDockInfluence(_ influence: CGFloat) {\n        dockInfluence = min(max(influence, 0), 1)\n    }\n\n    func setHovered(_ hovered: Bool) {\n        guard isHovered != hovered else { return }\n        isHovered = hovered\n        label.isHidden = !hovered\n        updateAppearance()\n    }\n\n    func update(profile: WebAppProfile, isActive: Bool) {\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    override func mouseEntered(with event: NSEvent) {\n        isHovered = true\n        label.isHidden = false\n        updateAppearance()\n        onPointerMoved?(event)\n    }\n''',
              '''    override func mouseEntered(with event: NSEvent) {\n        setHovered(true)\n        onPointerMoved?(event)\n    }\n'''
          )
          replace_once(
              "FloatTabs/UI/ExternalTabRail.swift",
              '''    override func mouseExited(with event: NSEvent) {\n        isHovered = false\n        label.isHidden = true\n        updateAppearance()\n        onPointerMoved?(event)\n    }\n''',
              '''    override func mouseExited(with event: NSEvent) {\n        setHovered(false)\n        onPointerMoved?(event)\n    }\n'''
          )

          # Make Add / Settings / Pin visually attach to the panel edge: same left
          # rounding as tabs, square/open page-side seam, and shared dimensions.
          for marker in [
              'final class AddWebAppControl: NSView {',
              'final class PinPanelControl: NSView {',
              'final class CurrentWebAppControl: NSView {'
          ]:
              # Scope replacement to the first initializer after each marker.
              p = Path("FloatTabs/UI/ExternalTabRail.swift")
              text = p.read_text()
              start = text.index(marker)
              init_pos = text.index('        layer?.cornerRadius = ExternalTabMetrics.tabRadius\n', start)
              insert = '''        layer?.cornerRadius = ExternalTabMetrics.tabRadius\n        layer?.maskedCorners = [.layerMinXMinYCorner, .layerMinXMaxYCorner]\n'''
              text = text[:init_pos] + insert + text[init_pos + len('        layer?.cornerRadius = ExternalTabMetrics.tabRadius\n'):]
              p.write_text(text)

          # Add explicit hover setters to the three utility controls. Replace each
          # class-local setDockInfluence block sequentially after its class marker.
          p = Path("FloatTabs/UI/ExternalTabRail.swift")
          text = p.read_text()
          for marker, setter in [
              ('final class AddWebAppControl: NSView {', '''    func setHovered(_ hovered: Bool) {\n        guard isHovered != hovered else { return }\n        isHovered = hovered\n        updateAppearance()\n    }\n\n'''),
              ('final class PinPanelControl: NSView {', '''    func setHovered(_ hovered: Bool) {\n        guard isHovered != hovered else { return }\n        isHovered = hovered\n        updateAppearance()\n    }\n\n'''),
              ('final class CurrentWebAppControl: NSView {', '''    func setHovered(_ hovered: Bool) {\n        let resolved = hovered && isEnabled\n        guard isHovered != resolved else { return }\n        isHovered = resolved\n        updateAppearance()\n    }\n\n''')
          ]:
              start = text.index(marker)
              pos = text.index('    func setDockInfluence(_ influence: CGFloat) {\n        dockInfluence = min(max(influence, 0), 1)\n    }\n\n', start)
              block = '    func setDockInfluence(_ influence: CGFloat) {\n        dockInfluence = min(max(influence, 0), 1)\n    }\n\n'
              text = text[:pos] + block + setter + text[pos + len(block):]
          p.write_text(text)

          # Utility mouse events use the setters and report exits back to the parent
          # so the parent can clear a previously expanded sibling immediately.
          p = Path("FloatTabs/UI/ExternalTabRail.swift")
          text = p.read_text()
          text = text.replace(
              '''    override func mouseEntered(with event: NSEvent) {\n        isHovered = true\n        updateAppearance()\n        onPointerMoved?(event)\n    }\n''',
              '''    override func mouseEntered(with event: NSEvent) {\n        setHovered(true)\n        onPointerMoved?(event)\n    }\n'''
          )
          text = text.replace(
              '''    override func mouseExited(with event: NSEvent) {\n        isHovered = false\n        updateAppearance()\n    }\n''',
              '''    override func mouseExited(with event: NSEvent) {\n        setHovered(false)\n        onPointerMoved?(event)\n    }\n'''
          )
          p.write_text(text)

          # 4) Regression coverage for the Real-Mac findings.
          replace_once(
              "FloatTabsTests/ExternalShellTests.swift",
              '''        XCTAssertEqual(zone.currentControlsFrame.width, ExternalTabMetrics.systemControlNormalWidth, accuracy: 0.001)\n        XCTAssertEqual(zone.pinControlFrame.width, ExternalTabMetrics.systemControlNormalWidth, accuracy: 0.001)\n        XCTAssertLessThan(zone.currentControlsFrame.maxY, zone.pinControlFrame.minY)\n''',
              '''        XCTAssertEqual(zone.currentControlsFrame.width, ExternalTabMetrics.systemControlNormalWidth, accuracy: 0.001)\n        XCTAssertEqual(zone.pinControlFrame.width, ExternalTabMetrics.systemControlNormalWidth, accuracy: 0.001)\n        XCTAssertEqual(activeView.frame.maxX, zone.bounds.maxX, accuracy: 0.001)\n        XCTAssertEqual(\n            inactiveView.frame.maxX,\n            zone.bounds.maxX - PanelMetrics.interactionBorderOutset,\n            accuracy: 0.001\n        )\n        XCTAssertEqual(\n            zone.addControlFrame.maxX,\n            zone.bounds.maxX - PanelMetrics.interactionBorderOutset,\n            accuracy: 0.001\n        )\n        XCTAssertEqual(\n            zone.currentControlsFrame.maxX,\n            zone.bounds.maxX - PanelMetrics.interactionBorderOutset,\n            accuracy: 0.001\n        )\n        XCTAssertEqual(\n            zone.pinControlFrame.maxX,\n            zone.bounds.maxX - PanelMetrics.interactionBorderOutset,\n            accuracy: 0.001\n        )\n        XCTAssertLessThan(zone.currentControlsFrame.maxY, zone.pinControlFrame.minY)\n'''
          )
          replace_once(
              "FloatTabsTests/ExternalShellTests.swift",
              '''    func testTabControlsWinOverPerimeterDragWhenTheyOverlap() {\n''',
              '''    func testInactiveTabHoverCanBeClearedWithoutLeavingExpandedGeometry() {\n        let (_, zone) = makeZoneHarness()\n        let active = makeProfile(order: 0, name: "GPT")\n        let inactive = makeProfile(order: 1, name: "X")\n        zone.apply(profiles: [active, inactive], activeTabID: active.id)\n        zone.layoutSubtreeIfNeeded()\n\n        let inactiveView = try! XCTUnwrap(zone.tabView(for: inactive.id))\n        inactiveView.setHovered(true)\n        XCTAssertEqual(inactiveView.preferredWidth, ExternalTabMetrics.hoverWidth, accuracy: 0.001)\n        XCTAssertTrue(inactiveView.isShowingLabel)\n\n        inactiveView.setHovered(false)\n        XCTAssertEqual(inactiveView.preferredWidth, ExternalTabMetrics.collapsedWidth, accuracy: 0.001)\n        XCTAssertFalse(inactiveView.isShowingLabel)\n    }\n\n    func testTabControlsWinOverPerimeterDragWhenTheyOverlap() {\n'''
          )
          replace_once(
              "FloatTabsTests/ExternalShellTests.swift",
              '''    func testPanelRootConsumesTransparentInWindowGapsInsteadOfClickingThrough() {\n''',
              '''    func testResizeHandleLivesInsideWebCornerInsteadOfOuterTransparentGutter() {\n        let root = PanelRootView()\n        root.frame = NSRect(origin: .zero, size: PanelMetrics.defaultPanelSize)\n        root.layoutSubtreeIfNeeded()\n\n        let webFrame = root.webPanelContainerView.frame\n        let insideWebCorner = NSPoint(x: webFrame.maxX - 4, y: webFrame.minY + 4)\n        XCTAssertTrue(root.hitTest(insideWebCorner) is PanelResizeHandleView)\n\n        let outerTransparentCorner = NSPoint(\n            x: root.bounds.maxX - 4,\n            y: root.bounds.minY + 4\n        )\n        XCTAssertFalse(root.hitTest(outerTransparentCorner) is PanelResizeHandleView)\n    }\n\n    func testTopAndBottomMoveTargetsIncludeReliableInPageArea() {\n        XCTAssertGreaterThanOrEqual(PanelMetrics.innerMovementOverlap, 10)\n\n        let root = PanelRootView()\n        root.frame = NSRect(origin: .zero, size: PanelMetrics.defaultPanelSize)\n        root.layoutSubtreeIfNeeded()\n        let webFrame = root.webPanelContainerView.frame\n\n        let topInside = NSPoint(x: webFrame.midX, y: webFrame.maxY - 8)\n        let bottomInside = NSPoint(x: webFrame.midX, y: webFrame.minY + 8)\n        XCTAssertTrue(root.hitTest(topInside) is PanelPerimeterDragView)\n        XCTAssertTrue(root.hitTest(bottomInside) is PanelPerimeterDragView)\n    }\n\n    func testPanelRootConsumesTransparentInWindowGapsInsteadOfClickingThrough() {\n'''
          )
          PY

          git diff --check
          git diff -- FloatTabs/Panel/ScreenPositioning.swift FloatTabs/Web/WebViewContainer.swift FloatTabs/UI/ExternalTabRail.swift FloatTabsTests/ExternalShellTests.swift

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Focused Stage 5D shell tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            -only-testing:FloatTabsTests/ExternalShellTests \
            test

      - name: Full unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/Panel/ScreenPositioning.swift FloatTabs/Web/WebViewContainer.swift FloatTabs/UI/ExternalTabRail.swift FloatTabsTests/ExternalShellTests.swift
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix: refine Stage 5D real Mac interaction geometry [stage5d-followup-bot]'
          git push origin HEAD:perf/stage-5-resource-benchmark
