name: Stage 5D Contract Update

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark

permissions:
  contents: write

jobs:
  update-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Align stale shell tests with accepted Real-Mac contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('FloatTabsTests/ScreenPositioningTests.swift')
          text = path.read_text()
          original = text

          text = text.replace(
              'XCTAssertEqual(PanelMetrics.innerMovementOverlap, 4)',
              'XCTAssertEqual(PanelMetrics.innerMovementOverlap, 10)'
          )
          text = text.replace(
              'PanelMetrics.outerInteractionGutter + PanelMetrics.innerMovementOverlap,\n            16',
              'PanelMetrics.outerInteractionGutter + PanelMetrics.innerMovementOverlap,\n            22'
          )
          text = text.replace(
              'XCTAssertEqual(root.resizeHandleView.frame.maxX, root.bounds.maxX, accuracy: 0.001)',
              'XCTAssertEqual(\n            root.resizeHandleView.frame.maxX,\n            root.webPanelContainerView.frame.maxX,\n            accuracy: 0.001\n        )'
          )
          text = text.replace(
              'XCTAssertEqual(root.resizeHandleView.frame.minY, root.bounds.minY, accuracy: 0.001)',
              'XCTAssertEqual(\n            root.resizeHandleView.frame.minY,\n            root.webPanelContainerView.frame.minY,\n            accuracy: 0.001\n        )'
          )
          text = text.replace(
              '''        let point = NSPoint(\n            x: root.bounds.maxX - PanelMetrics.resizeHandleSize / 2,\n            y: root.bounds.minY + PanelMetrics.resizeHandleSize / 2\n        )\n        XCTAssertTrue(root.hitTest(point) is PanelResizeHandleView)\n''',
              '''        let point = NSPoint(\n            x: root.resizeHandleView.frame.midX,\n            y: root.resizeHandleView.frame.midY\n        )\n        XCTAssertTrue(root.webPanelContainerView.frame.contains(point))\n        XCTAssertTrue(root.hitTest(point) is PanelResizeHandleView)\n'''
          )

          if text == original:
              print('Test contract is already current; nothing to update.')
          else:
              path.write_text(text)
          PY

          git diff --check
          git diff -- FloatTabsTests/ScreenPositioningTests.swift

      - name: Commit updated test contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabsTests/ScreenPositioningTests.swift
          if git diff --cached --quiet; then
            echo 'No test contract changes to commit.'
            exit 0
          fi
          git commit -m 'test: align Stage 5D shell contract with Real-Mac acceptance [stage5d-contract-bot]'
          git push origin HEAD:perf/stage-5-resource-benchmark
