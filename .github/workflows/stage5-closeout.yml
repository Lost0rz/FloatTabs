name: Stage 5 Closeout

on:
  push:
    branches:
      - feat/stage-5-residency-policy
    paths:
      - .github/stage5-closeout.trigger

permissions:
  contents: write

jobs:
  closeout:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-5-residency-policy
          fetch-depth: 0

      - name: Apply closeout patch
        run: python3 .github/stage5_closeout_patch.py

      - name: Commit closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabsTests/WebViewPoolTests.swift FloatTabsTests/ProfileRepositoryTests.swift docs/architecture/FloatTabs_Technical_Architecture_v1.2.md docs/product/FloatTabs_Product_Development_Spec_v0.5.md docs/product/FloatTabs_Stage_5_Residency_Policy.md
          git diff --cached --check
          git commit -m 'test: close out stage 5 residency policy'
          git push origin HEAD:feat/stage-5-residency-policy
