name: Stage 5 Closeout

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - '.github/stage5_closeout_patch.py'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark

      - name: Apply Stage 5 closeout patch
        run: python3 .github/stage5_closeout_patch.py

      - name: Check diff
        run: git diff --check

      - name: Compile benchmark harnesses
        run: |
          python3 -m py_compile tools/benchmark/floattabs_benchmark.py
          python3 -m py_compile tools/benchmark/floattabs_lifecycle_benchmark.py

      - name: Run benchmark self-tests
        run: |
          python3 tools/benchmark/floattabs_benchmark.py --self-test
          python3 tools/benchmark/floattabs_lifecycle_benchmark.py --self-test

      - name: Run full unit tests
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit validated closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Web/SlotLifecycleCoordinator.swift \
            FloatTabsTests/WebViewPoolTests.swift \
            docs/product/FloatTabs_Stage_5E_Resource_Lifecycle.md \
            docs/performance/FloatTabs_Stage_5_Resource_Benchmark.md \
            tools/benchmark/floattabs_lifecycle_benchmark.py \
            tools/benchmark/README.md
          git commit -m 'perf: finalize Stage 5 resource timings'
          git push origin HEAD:perf/stage-5-resource-benchmark
