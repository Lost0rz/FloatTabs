      - name: Apply guarded patch
        shell: bash
        env:
          PATCH_B64: >-
            <omitted>
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/navigation-intent-patch.py
          python3 /tmp/navigation-intent-patch.py

      - name: Commit business changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FloatTabs FloatTabsTests
          git commit -m "feat: add navigation intent and slot home"
          git push origin HEAD:feat/navigation-intent-slot-home
