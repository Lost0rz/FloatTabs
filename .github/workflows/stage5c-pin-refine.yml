name: Stage 5C Pin Refine

on:
  push:
    branches:
      - feat/stage-5c-presentation-pin
    paths:
      - .github/stage5c-pin-refine.trigger

permissions:
  contents: write

jobs:
  refine:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-5c-presentation-pin
          fetch-depth: 0

      - name: Restore Pin surface from accepted first implementation
        run: |
          git checkout 31c49959f64483540fff79849e71505f9de26f10 -- \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/ExternalShellTests.swift

      - name: Replace unreliable app-deactivation observer with workspace frontmost-app observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FloatTabs/Panel/PanelController.swift')
          text = p.read_text()
          old_observer = '''        NotificationCenter.default.addObserver(
              self,
              selector: #selector(applicationDidResignActive(_:)),
              name: NSApplication.didResignActiveNotification,
              object: NSApp
          )'''
          new_observer = '''        NSWorkspace.shared.notificationCenter.addObserver(
              self,
              selector: #selector(workspaceDidActivateApplication(_:)),
              name: NSWorkspace.didActivateApplicationNotification,
              object: nil
          )'''
          if old_observer not in text:
              raise SystemExit('old application observer not found')
          text = text.replace(old_observer, new_observer)

          old_handler = '''    @objc private func applicationDidResignActive(_ notification: Notification) {
          guard Self.shouldAutoHide(panelIsVisible: panel.isVisible, isPinned: isPinned) else {
              return
          }
          autoHideAfterApplicationDeactivation()
      }'''
          new_handler = '''    static func shouldAutoHideForActivatedApplication(
          panelIsVisible: Bool,
          isPinned: Bool,
          activatedProcessIdentifier: pid_t,
          ownProcessIdentifier: pid_t
      ) -> Bool {
          panelIsVisible
              && !isPinned
              && activatedProcessIdentifier != ownProcessIdentifier
      }

      @objc private func workspaceDidActivateApplication(_ notification: Notification) {
          guard let activatedApplication = notification.userInfo?[NSWorkspace.applicationUserInfoKey]
                  as? NSRunningApplication,
                Self.shouldAutoHideForActivatedApplication(
                  panelIsVisible: panel.isVisible,
                  isPinned: isPinned,
                  activatedProcessIdentifier: activatedApplication.processIdentifier,
                  ownProcessIdentifier: ProcessInfo.processInfo.processIdentifier
                ) else {
              return
          }
          autoHideAfterApplicationDeactivation()
      }'''
          if old_handler not in text:
              raise SystemExit('old application handler not found')
          p.write_text(text.replace(old_handler, new_handler))
          PY

      - name: Use Option-Space as temporary global summon toggle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FloatTabs/Hotkeys/GlobalHotkeyController.swift')
          text = p.read_text()
          old = 'initial: .init(.backtick, modifiers: [.command])'
          new = 'initial: .init(.space, modifiers: [.option])'
          if old not in text:
              raise SystemExit('current backtick shortcut declaration not found')
          p.write_text(text.replace(old, new))
          PY

      - name: Extend auto-hide tests for workspace activation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FloatTabsTests/ExternalShellTests.swift')
          text = p.read_text()
          needle = '''    func testPanelAutoHideDecisionRespectsPin() {
          XCTAssertTrue(PanelController.shouldAutoHide(panelIsVisible: true, isPinned: false))
          XCTAssertFalse(PanelController.shouldAutoHide(panelIsVisible: true, isPinned: true))'''
          if needle not in text:
              raise SystemExit('auto-hide test anchor not found')
          insert = '''    func testWorkspaceAutoHideRequiresAnotherFrontmostApplication() {
          XCTAssertTrue(
              PanelController.shouldAutoHideForActivatedApplication(
                  panelIsVisible: true,
                  isPinned: false,
                  activatedProcessIdentifier: 200,
                  ownProcessIdentifier: 100
              )
          )
          XCTAssertFalse(
              PanelController.shouldAutoHideForActivatedApplication(
                  panelIsVisible: true,
                  isPinned: true,
                  activatedProcessIdentifier: 200,
                  ownProcessIdentifier: 100
              )
          )
          XCTAssertFalse(
              PanelController.shouldAutoHideForActivatedApplication(
                  panelIsVisible: true,
                  isPinned: false,
                  activatedProcessIdentifier: 100,
                  ownProcessIdentifier: 100
              )
          )
      }

'''
          text = text.replace(needle, insert + needle)
          p.write_text(text)
          PY

      - name: Validate intended diff
        run: |
          git diff --check
          grep -q 'initial: .init(.space, modifiers: \[.option\])' FloatTabs/Hotkeys/GlobalHotkeyController.swift
          grep -q 'NSWorkspace.didActivateApplicationNotification' FloatTabs/Panel/PanelController.swift
          grep -q 'workspaceDidActivateApplication' FloatTabs/Panel/PanelController.swift
          grep -q 'PinPanelControl' FloatTabs/UI/ExternalTabRail.swift
          grep -q 'case togglePin' FloatTabs/Hotkeys/AppCommandController.swift
          grep -q 'host.isHidden = true' FloatTabs/Web/WebViewContainer.swift
          ! grep -q 'applicationDidResignActive' FloatTabs/Panel/PanelController.swift

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Hotkeys/GlobalHotkeyController.swift \
            FloatTabs/Hotkeys/AppCommandController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabsTests/AppCommandControllerTests.swift \
            FloatTabsTests/ExternalShellTests.swift
          git commit -m 'fix: restore pin with frontmost-app auto-hide'
          git push origin HEAD:feat/stage-5c-presentation-pin
