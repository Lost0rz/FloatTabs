name: Apply Native Fullscreen Host Repair

on:
  push:
    branches:
      - agent/fix-web-fullscreen-state

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-web-fullscreen-state
          fetch-depth: 0

      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {text.count(old)}')
              return text.replace(old, new)

          p = Path('FloatTabs/App/AppDelegate.swift')
          s = p.read_text()
          pattern = re.compile(r'import AppKit\nimport WebKit\n\n/// Keeps element fullscreen.*?\n@MainActor\nfinal class AppDelegate', re.S)
          s, n = pattern.subn('import AppKit\n\n@MainActor\nfinal class AppDelegate', s, count=1)
          if n != 1:
              raise SystemExit(f'AppDelegate coordinator removal failed: {n}')
          s = replace_once(s, '        NativeFullscreenSessionResetCoordinator.shared.start()\n', '', 'coordinator start')
          s = replace_once(s, '        NativeFullscreenSessionResetCoordinator.shared.stop()\n', '', 'coordinator stop')
          p.write_text(s)

          p = Path('FloatTabs/Web/WebViewFactory.swift')
          s = p.read_text()
          s = replace_once(s, '        NativeFullscreenSessionResetCoordinator.shared.install(in: configuration)\n', '', 'bridge install')
          p.write_text(s)

          p = Path('FloatTabs/Panel/FloatingPanel.swift')
          s = p.read_text()
          old = '''                NativeFullscreenSessionResetCoordinator.shared.handleObservedFullscreenTransition(\n                    for: webView,\n                    previousState: previousState,\n                    currentState: state,\n                    window: currentWindow\n                )\n\n'''
          s = replace_once(s, old, '', 'observed cleanup')
          p.write_text(s)

          p = Path('FloatTabs/Web/WebViewContainer.swift')
          s = p.read_text()
          s = replace_once(s, '    private let logicalHostView = NSView()\n', '    private let logicalHostView = WebSlotHostView(frame: .zero)\n', 'logical host')
          if '            webView.autoresizingMask = []\n' not in s:
              raise SystemExit('autoresizing anchor missing')
          s = s.replace('            webView.autoresizingMask = []\n', '            webView.autoresizingMask = [.width, .height]\n')
          old = '''            hostedWebView?.removeFromSuperview()\n            webView.removeFromSuperview()\n            webView.translatesAutoresizingMaskIntoConstraints = true\n            webView.autoresizingMask = [.width, .height]\n            logicalHostView.addSubview(webView)\n            hostedWebView = webView\n'''
          new = '''            hostedWebView?.removeFromSuperview()\n            logicalHostView.attach(webView)\n            hostedWebView = webView\n'''
          s = replace_once(s, old, new, 'transient attach')
          p.write_text(s)

          p = Path('FloatTabsTests/WebViewFactoryTests.swift')
          s = p.read_text()
          pattern = re.compile(r'\n    func testWebViewsUseNativeElementFullscreenWithExitOnlyResetBridge\(\) throws \{.*?\n    \}\n\n    func testFullscreenSessionResetPoliciesRequireAnActiveNativePresentation\(\) \{.*?\n    \}\n', re.S)
          replacement = r'''
    func testWebViewsLeaveNativeElementFullscreenEntryAndExitUntouched() {
        let webView = WebViewFactory.makeWebView()
        let scripts = webView.configuration.userContentController.userScripts

        XCTAssertTrue(webView.configuration.preferences.isElementFullscreenEnabled)
        XCTAssertFalse(scripts.contains(where: { script in
            script.source.contains("__floatTabsNativeFullscreenExitBridgeInstalled")
                || script.source.contains("requestFullscreen")
                || script.source.contains("exitFullscreen")
                || script.source.contains("closeAllMediaPresentations")
        }))
    }

    func testTransientWebViewUsesStableFrameBasedFullscreenHost() throws {
        let webView = WebViewFactory.makeWebView()
        let container = WebPanelContainerView(frame: NSRect(x: 0, y: 0, width: 600, height: 820))
        container.show(webView: webView)
        container.layoutSubtreeIfNeeded()
        let host = try XCTUnwrap(webView.superview as? WebSlotHostView)

        XCTAssertTrue(webView.translatesAutoresizingMaskIntoConstraints)
        XCTAssertTrue(webView.autoresizingMask.contains(.width))
        XCTAssertTrue(webView.autoresizingMask.contains(.height))
        XCTAssertTrue(webView.superview === host)
        XCTAssertFalse(host.constraints.contains(where: { constraint in
            (constraint.firstItem as? NSView) === webView
                || (constraint.secondItem as? NSView) === webView
        }))
    }
'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'test replacement failed: {n}')
          p.write_text(s)

          combined = ''.join(Path(f).read_text() for f in [
              'FloatTabs/App/AppDelegate.swift',
              'FloatTabs/Web/WebViewFactory.swift',
              'FloatTabs/Panel/FloatingPanel.swift',
          ])
          for token in ['NativeFullscreenSessionResetCoordinator', 'closeAllMediaPresentations', 'floatTabsNativeFullscreenExit', 'fullscreen_public_close_requested', 'fullscreen_public_close_completed']:
              if token in combined:
                  raise SystemExit(f'rejected fullscreen token remains: {token}')
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/macos-ci.yml
          git rm .github/workflows/tmp-native-fullscreen-host-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FloatTabs/App/AppDelegate.swift FloatTabs/Panel/FloatingPanel.swift FloatTabs/Web/WebViewFactory.swift FloatTabs/Web/WebViewContainer.swift FloatTabsTests/WebViewFactoryTests.swift .github/workflows/macos-ci.yml
          git commit -m 'fix: use fullscreen-safe WebKit host hierarchy'
          git push origin HEAD:agent/fix-web-fullscreen-state
