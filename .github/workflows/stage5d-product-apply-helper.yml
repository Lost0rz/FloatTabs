name: Stage 5D Product Apply Helper

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - '.github/workflows/stage5d-product-apply-helper.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Apply original guarded Stage 5D source edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          source_commit = 'cea2a197b7df05aa0f6b22bc71d00300b746eb71'
          workflow_path = '.github/workflows/stage5d-interaction-polish-apply.yml'
          workflow = subprocess.check_output(
              ['git', 'show', f'{source_commit}:{workflow_path}'],
              text=True,
          )
          match = re.search(
              r"      - name: Apply guarded source edits\n        shell: bash\n        run: \|\n(?P<body>.*?)(?=\n      - name: Resolve Swift packages)",
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit('could not extract original guarded source-edit block')

          body = textwrap.dedent(match.group('body'))
          bad = 'return Self.isDraggable(point: localPoint, in: bounds) ? self : nil'
          fixed = 'return Self.dragRects(in: bounds).contains(where: { $0.contains(localPoint) }) ? self : nil'
          if body.count(bad) != 1:
              raise SystemExit(f'expected one known hit-test typo, found {body.count(bad)}')
          body = body.replace(bad, fixed)
          Path('/tmp/stage5d-apply.sh').write_text('set -euo pipefail\n' + body)
          PY
          bash /tmp/stage5d-apply.sh

          python3 <<'PY'
          from pathlib import Path

          tests = Path('FloatTabsTests/ExternalShellTests.swift')
          text = tests.read_text()
          old = '''        XCTAssertLessThan(path.boundingBoxOfPath.minX, web.minX - 10)\n        XCTAssertGreaterThanOrEqual(path.boundingBoxOfPath.maxX, web.maxX)\n'''
          new = '''        XCTAssertLessThan(path.boundingBox.minX, web.minX - 10)\n        XCTAssertGreaterThanOrEqual(path.boundingBox.maxX, web.maxX)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one composite-outline assertion block, found {text.count(old)}')
          tests.write_text(text.replace(old, new))

          source = Path('FloatTabs/Web/WebViewContainer.swift')
          text = source.read_text()
          needle = '''        let joinTop = min(tabRect.maxY, webRect.maxY - webRadius - 1)\n        guard joinTop - joinBottom >= 8 else {\n'''
          diagnostic = '''        let joinTop = min(tabRect.maxY, webRect.maxY - webRadius - 1)\n        print("STAGE5D_OUTLINE web=\\(webRect) tab=\\(tabRect) join=\\(joinBottom)...\\(joinTop) active=\\(String(describing: activeTabFrame))")\n        guard joinTop - joinBottom >= 8 else {\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected one outline diagnostic insertion point, found {text.count(needle)}')
          source.write_text(text.replace(needle, diagnostic))
          PY
          git diff --check

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests with persisted failure diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee /tmp/stage5d-tests.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            mkdir -p .ci-diagnostics
            python3 <<'PY'
          from pathlib import Path
          source = Path('/tmp/stage5d-tests.log').read_text(errors='replace').splitlines()
          needles = (
              'STAGE5D_OUTLINE',
              'Test Case',
              'XCTAssert',
              'error:',
              'failed',
              'Failure',
              '** TEST',
          )
          selected = [line for line in source if any(needle in line for needle in needles)]
          tail = source[-120:]
          out = [
              'Stage 5D product helper test diagnostics',
              '========================================',
              '',
              'Filtered failure lines:',
              *selected[-240:],
              '',
              'Last 120 log lines:',
              *tail,
              '',
          ]
          Path('.ci-diagnostics/stage5d-product-apply-failure.txt').write_text('\n'.join(out))
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-diagnostics/stage5d-product-apply-failure.txt
            git commit -m "ci: persist Stage 5D failing test diagnostics"
            git push origin HEAD:perf/stage-5-resource-benchmark
          fi

          exit "$status"

      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          p = Path('FloatTabs/Web/WebViewContainer.swift')
          text = p.read_text()
          diagnostic = '''        print("STAGE5D_OUTLINE web=\\(webRect) tab=\\(tabRect) join=\\(joinBottom)...\\(joinTop) active=\\(String(describing: activeTabFrame))")\n'''
          if text.count(diagnostic) != 1:
              raise SystemExit(f'expected one temporary diagnostic, found {text.count(diagnostic)}')
          p.write_text(text.replace(diagnostic, ''))
          PY
          if [ -f .ci-diagnostics/stage5d-product-apply-failure.txt ]; then
            git rm .ci-diagnostics/stage5d-product-apply-failure.txt
          fi
          git add \
            FloatTabs/Panel/ScreenPositioning.swift \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabsTests/ExternalShellTests.swift \
            docs/product/FloatTabs_Stage_5D_Interaction_Rendering_Refinement.md
          git diff --cached --check
          git commit -m "fix: polish Stage 5D interaction shell"
          git push origin HEAD:perf/stage-5-resource-benchmark
