name: Stage 5D Product Apply Helper

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - '.github/workflows/stage5d-product-apply-helper.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Apply corrected Stage 5D source edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          source_commit = 'cea2a197b7df05aa0f6b22bc71d00300b746eb71'
          workflow_path = '.github/workflows/stage5d-interaction-polish-apply.yml'
          workflow = subprocess.check_output(
              ['git', 'show', f'{source_commit}:{workflow_path}'],
              text=True,
          )
          match = re.search(
              r"      - name: Apply guarded source edits\n        shell: bash\n        run: \|\n(?P<body>.*?)(?=\n      - name: Resolve Swift packages)",
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit('could not extract original guarded source-edit block')

          body = textwrap.dedent(match.group('body'))
          bad = 'return Self.isDraggable(point: localPoint, in: bounds) ? self : nil'
          fixed = 'return Self.dragRects(in: bounds).contains(where: { $0.contains(localPoint) }) ? self : nil'
          if body.count(bad) != 1:
              raise SystemExit(f'expected one known hit-test typo, found {body.count(bad)}')
          body = body.replace(bad, fixed)
          Path('/tmp/stage5d-apply.sh').write_text('set -euo pipefail\n' + body)
          PY
          bash /tmp/stage5d-apply.sh

          # Keep the historical PanelRootView safety net intact: transparent pixels
          # that are still inside the FloatTabs window must remain owned by FloatTabs.
          # Returning nil for root-only hits reintroduces desktop click-through in the
          # narrow shell gaps around move/resize controls.
          python3 <<'PY'
          from pathlib import Path

          source = Path('FloatTabs/Web/WebViewContainer.swift')
          tests = Path('FloatTabsTests/ExternalShellTests.swift')
          text = tests.read_text()
          old = '''        XCTAssertLessThan(path.boundingBoxOfPath.minX, web.minX - 10)\n        XCTAssertGreaterThanOrEqual(path.boundingBoxOfPath.maxX, web.maxX)\n'''
          new = '''        print("STAGE5D_TEST_BOUND path=\\(path.boundingBox) web=\\(web) active=\\(activeTab)")\n        XCTAssertLessThan(path.boundingBox.minX, web.minX - 10)\n        XCTAssertGreaterThanOrEqual(path.boundingBox.maxX, web.maxX)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one composite-outline assertion block, found {text.count(old)}')
          tests.write_text(text.replace(old, new))

          text = source.read_text()
          needle = '''        let joinTop = min(tabRect.maxY, webRect.maxY - webRadius - 1)\n        guard joinTop - joinBottom >= 8 else {\n'''
          diagnostic = '''        let joinTop = min(tabRect.maxY, webRect.maxY - webRadius - 1)\n        print("STAGE5D_OUTLINE web=\\(webRect) tab=\\(tabRect) join=\\(joinBottom)...\\(joinTop) active=\\(String(describing: activeTabFrame))")\n        guard joinTop - joinBottom >= 8 else {\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected one outline diagnostic insertion point, found {text.count(needle)}')
          source.write_text(text.replace(needle, diagnostic))
          PY
          git diff --check

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock is unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Focused shell and hit-testing regressions
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            -only-testing:FloatTabsTests/ExternalShellTests \
            -only-testing:FloatTabsTests/PanelPerimeterDragHitTestingTests \
            test 2>&1 | tee /tmp/stage5d-focused-tests.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            set -e
            mkdir -p .ci-diagnostics
            {
              echo "Stage 5D focused failure diagnostics"
              echo "===================================="
              echo "Run captured: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo
              echo "Failure contexts:"
              grep -n -B 8 -A 14 -E "Test Case .* failed|XCTAssert|FloatTabsTests/.+error:|STAGE5D_|Assertion failed|failed -|error:" /tmp/stage5d-focused-tests.log || true
              echo
              echo "Final 360 log lines:"
              tail -n 360 /tmp/stage5d-focused-tests.log
            } > .ci-diagnostics/stage5d-focused-failure.txt

            git restore FloatTabs FloatTabsTests docs || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-diagnostics/stage5d-focused-failure.txt
            git commit -m "ci: persist exact Stage 5D focused failure"
            git push origin HEAD:perf/stage-5-resource-benchmark
          fi

          exit "$status"

      - name: Full unit tests with persisted failure diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee /tmp/stage5d-full-tests.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            set -e
            mkdir -p .ci-diagnostics
            {
              echo "Stage 5D full-suite failure diagnostics"
              echo "======================================="
              echo "Run captured: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo
              echo "Focused failure contexts:"
              grep -n -B 6 -A 8 -E "Test Case .* failed|XCTAssert|FloatTabsTests/.+error:|STAGE5D_|Assertion failed|failed -" /tmp/stage5d-full-tests.log || true
              echo
              echo "Final 260 log lines:"
              tail -n 260 /tmp/stage5d-full-tests.log
            } > .ci-diagnostics/stage5d-product-apply-failure.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-diagnostics/stage5d-product-apply-failure.txt
            git commit -m "ci: persist exact Stage 5D full-suite failure"
            git push origin HEAD:perf/stage-5-resource-benchmark
          fi

          exit "$status"

      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path

          source = Path('FloatTabs/Web/WebViewContainer.swift')
          text = source.read_text()
          diagnostic = '''        print("STAGE5D_OUTLINE web=\\(webRect) tab=\\(tabRect) join=\\(joinBottom)...\\(joinTop) active=\\(String(describing: activeTabFrame))")\n'''
          if text.count(diagnostic) != 1:
              raise SystemExit(f'expected one temporary outline diagnostic, found {text.count(diagnostic)}')
          source.write_text(text.replace(diagnostic, ''))

          tests = Path('FloatTabsTests/ExternalShellTests.swift')
          text = tests.read_text()
          test_diagnostic = '''        print("STAGE5D_TEST_BOUND path=\\(path.boundingBox) web=\\(web) active=\\(activeTab)")\n'''
          if text.count(test_diagnostic) != 1:
              raise SystemExit(f'expected one temporary test diagnostic, found {text.count(test_diagnostic)}')
          tests.write_text(text.replace(test_diagnostic, ''))
          PY
          if [ -f .ci-diagnostics/stage5d-product-apply-failure.txt ]; then
            git rm .ci-diagnostics/stage5d-product-apply-failure.txt
          fi
          if [ -f .ci-diagnostics/stage5d-full-suite-failure.txt ]; then
            git rm .ci-diagnostics/stage5d-full-suite-failure.txt
          fi
          if [ -f .ci-diagnostics/stage5d-focused-failure.txt ]; then
            git rm .ci-diagnostics/stage5d-focused-failure.txt
          fi
          git add \
            FloatTabs/Panel/ScreenPositioning.swift \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabsTests/ExternalShellTests.swift \
            docs/product/FloatTabs_Stage_5D_Interaction_Rendering_Refinement.md
          git diff --cached --check
          git commit -m "fix: polish Stage 5D interaction shell"
          git push origin HEAD:perf/stage-5-resource-benchmark