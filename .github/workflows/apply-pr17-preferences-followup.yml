name: Apply PR17 Preferences Follow-up

on:
  push:
    branches:
      - agent/address-bar-current-page-actions
    paths:
      - '.github/pr17_preferences_followup.py'
      - '.github/run_pr17_preferences_followup.py'
      - '.github/pr17-preferences-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/address-bar-current-page-actions
          fetch-depth: 0

      - name: Apply preference follow-up
        run: python3 .github/run_pr17_preferences_followup.py

      - name: Check patch
        run: |
          git diff --check
          git diff -- \
            FloatTabs/Persistence/AppPreferencesStore.swift \
            FloatTabs/UI/GlobalSettingsController.swift \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/Persistence/FloatTabsBackupService.swift \
            FloatTabs/App/AppCoordinator.swift \
            FloatTabsTests/AppPreferencesStoreTests.swift \
            FloatTabsTests/ExternalShellTests.swift \
            FloatTabsTests/TabStoreTests.swift \
            FloatTabsTests/FloatTabsBackupServiceTests.swift

      - name: Resolve packages
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -resolvePackageDependencies
          -onlyUsePackageVersionsFromResolvedFile

      - name: Run focused preference and shell tests
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          -only-testing:FloatTabsTests/AppPreferencesStoreTests
          -only-testing:FloatTabsTests/ExternalShellTests
          -only-testing:FloatTabsTests/TabStoreTests
          -only-testing:FloatTabsTests/FloatTabsBackupServiceTests
          test

      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Persistence/AppPreferencesStore.swift \
            FloatTabs/UI/GlobalSettingsController.swift \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/Persistence/FloatTabsBackupService.swift \
            FloatTabs/App/AppCoordinator.swift \
            FloatTabsTests/AppPreferencesStoreTests.swift \
            FloatTabsTests/ExternalShellTests.swift \
            FloatTabsTests/TabStoreTests.swift \
            FloatTabsTests/FloatTabsBackupServiceTests.swift
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add border themes and shared window sizing'
          git push origin HEAD:agent/address-bar-current-page-actions
