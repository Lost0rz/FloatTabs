name: Stage 5D Finalize

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - .github/stage5d-finalize.trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Apply complete Stage 5D patch
        run: |
          python3 .github/stage5d-finalize.py
          python3 .github/stage5d-finalize-fix.py

      - name: Validate intended boundaries
        run: |
          git diff --check
          grep -q 'resizeHandleSize: CGFloat = 32' FloatTabs/Panel/ScreenPositioning.swift
          grep -q 'frame.contains(point) ? self : nil' FloatTabs/Web/WebViewContainer.swift
          grep -q 'activeAlways' FloatTabs/Web/WebViewContainer.swift
          grep -q 'websiteLayoutScale = 1' FloatTabs/Web/WebViewFactory.swift
          grep -q 'pageZoom = userPageZoom' FloatTabs/Web/WebViewFactory.swift
          ! grep -q 'magnification = rendering.zoom' FloatTabs/Web/WebViewFactory.swift
          grep -q 'WebsiteFaviconProvider' FloatTabs/UI/ExternalTabRail.swift
          grep -q 'Website Mode' FloatTabs/UI/ExternalTabRail.swift
          grep -q 'showsPrimaryRenderingControls: false' FloatTabs/UI/WebAppEditorController.swift
          test -f docs/product/FloatTabs_Stage_5D_Interaction_Rendering_Refinement.md

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Full unit tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test 2>&1 | tee /tmp/stage5d-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'Test Case .* failed|error:|XCTAssert|failed -|Failing tests:|Executed .* failures' /tmp/stage5d-tests.log > .github/stage5d-test-failure.txt || true
            tail -n 120 /tmp/stage5d-tests.log >> .github/stage5d-test-failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+Lost0rz@users.noreply.github.com'
            git add .github/stage5d-test-failure.txt
            git commit -m 'ci: capture Stage 5D test failure'
            git push origin HEAD:perf/stage-5-resource-benchmark
            exit "$status"
          fi

      - name: Commit validated Stage 5D product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Lost0rz@users.noreply.github.com'
          git add \
            FloatTabs/Panel/ScreenPositioning.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/UI/WebAppEditorController.swift \
            FloatTabs/Web/WebViewContainer.swift \
            FloatTabs/Web/WebViewFactory.swift \
            FloatTabsTests/ExternalShellTests.swift \
            FloatTabsTests/WebViewFactoryTests.swift \
            docs/product/FloatTabs_Stage_5D_Interaction_Rendering_Refinement.md
          git commit -m 'feat: refine Stage 5D interaction and rendering'
          git push origin HEAD:perf/stage-5-resource-benchmark
