name: Stage 5E Resource Lifecycle Implementation

on:
  push:
    branches:
      - perf/stage-5-resource-benchmark
    paths:
      - '.github/workflows/stage5e-resource-lifecycle-implementation.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/stage-5-resource-benchmark
          fetch-depth: 0

      - name: Recover validated patch script
        shell: bash
        run: |
          git show 8362a82fefc9f40e73c86e4e4ac649d8421fc038:.github/workflows/stage5e-resource-lifecycle-implementation.yml \
            | awk '/^          python3 - <<'\''PY'\''$/ { capture=1; next } capture && /^          PY$/ { exit } capture { sub(/^          /, ""); print }' \
            > /tmp/stage5e_apply.py
          test -s /tmp/stage5e_apply.py
          python3 -m py_compile /tmp/stage5e_apply.py

      - name: Apply Stage 5E resource lifecycle contract
        run: python3 /tmp/stage5e_apply.py

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -derivedDataPath .derivedData \
            -resolvePackageDependencies \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Verify package lock unchanged
        run: git diff --exit-code -- FloatTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Debug build
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Full unit tests
        run: |
          xcodebuild \
            -project FloatTabs.xcodeproj \
            -scheme FloatTabs \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            test

      - name: Benchmark harness self-test
        run: python3 tools/benchmark/floattabs_benchmark.py --self-test

      - name: Commit validated Stage 5E implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            FloatTabs/Web/SlotLifecycleCoordinator.swift \
            FloatTabs/Web/WebViewPool.swift \
            FloatTabs/UI/ExternalTabRail.swift \
            FloatTabs/Panel/PanelController.swift \
            FloatTabs/MenuBar/StatusItemController.swift \
            FloatTabs/App/AppCoordinator.swift \
            FloatTabs/Tabs/WebAppProfile.swift \
            FloatTabsTests/WebViewPoolTests.swift \
            FloatTabsTests/ExternalShellTests.swift \
            docs/product/FloatTabs_Stage_5D_Interaction_Rendering_Refinement.md \
            docs/product/FloatTabs_Stage_5E_Resource_Lifecycle.md
          git diff --cached --check
          git commit -m 'perf: refine slot resource lifecycle'
          git push origin HEAD:perf/stage-5-resource-benchmark
