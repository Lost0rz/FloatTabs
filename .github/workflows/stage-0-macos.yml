name: Stage 0 macOS

on:
  push:
    branches:
      - feat/stage-0-floating-panel
  pull_request:
    paths:
      - 'FloatTabs/**'
      - 'FloatTabsTests/**'
      - 'FloatTabs.xcodeproj/**'
      - '.github/workflows/stage-0-macos.yml'

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -project FloatTabs.xcodeproj -scheme FloatTabs -resolvePackageDependencies

      - name: Debug build
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit tests
        run: >-
          xcodebuild
          -project FloatTabs.xcodeproj
          -scheme FloatTabs
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          MACOSX_DEPLOYMENT_TARGET=14.0
          test
